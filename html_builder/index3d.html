<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Battle Arena -- 2.5D Scene Editor</title>
<style>
  :root { --ink:#eae6da; --dim:#a29d88; --accent:#f2d98a; --bg:#10120e; --panel:#171a13; --line:#3a3f2f; --field:#23271c; --sel:#5a6e2f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px "Trebuchet MS","Segoe UI",sans-serif; overflow:hidden; }
  button, select, input, textarea { font:inherit; color:var(--ink); background:var(--field); border:1px solid #545a41; border-radius:5px; padding:4px 7px; }
  input[type=color] { padding:0; width:34px; height:24px; }
  input[type=checkbox] { width:auto; }
  button { cursor:pointer; } button:hover { background:#394026; } button.on { background:var(--sel); border-color:#8ab24a; color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  #app { display:flex; flex-direction:column; height:100%; }
  #top { display:flex; align-items:center; gap:8px; padding:6px 12px; background:linear-gradient(#20241c,#171a13); border-bottom:2px solid var(--line); flex-wrap:wrap; }
  #top h1 { font-size:14px; margin:0 8px 0 0; color:var(--accent); white-space:nowrap; }
  #top .sp { flex:1; } #top .badge { font-size:11px; padding:2px 7px; border-radius:9px; background:#2b3a1c; border:1px solid #567; color:#cfe; }
  #dirty { color:#f6a; font-weight:bold; min-width:14px; }
  #main { flex:1; display:flex; min-height:0; }
  .side { background:var(--panel); border:0 solid var(--line); overflow-y:auto; flex:none; }
  #left { width:250px; border-right-width:2px; padding:8px; } #right { width:310px; border-left-width:2px; display:flex; flex-direction:column; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#b9b39a; margin:12px 0 5px; } h2:first-child { margin-top:0; }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:4px; } .tools button { text-align:left; padding:5px 7px; }
  .tools kbd, .kbd { color:var(--dim); font-size:10px; float:right; }
  .opts label { display:flex; align-items:center; gap:6px; margin:3px 0; color:var(--ink); font-size:12px; }
  #stage { flex:1; position:relative; min-width:0; background:#1a1a2a; }
  #skyBg { position:absolute; inset:0; display:none; }
  #gl, #ov { position:absolute; inset:0; width:100%; height:100%; display:block; } #ov { pointer-events:none; }
  #status { position:absolute; left:0; right:0; bottom:0; padding:3px 10px; background:rgba(10,12,8,.8); font-size:11px; color:var(--dim); display:flex; gap:14px; pointer-events:none; }
  #loading { position:absolute; left:50%; top:46%; transform:translateX(-50%); padding:8px 16px; background:rgba(0,0,0,.75); border-radius:8px; display:none; }
  #models { height:190px; overflow-y:auto; border:1px solid var(--line); border-radius:5px; background:#12150f; }
  .mrow { padding:3px 7px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; border-bottom:1px solid #1d2117; }
  .mrow:hover { background:#232919; } .mrow.cur { background:var(--sel); color:#fff; } .mrow small { color:var(--dim); margin-left:6px; }
  .tabs { display:flex; border-bottom:2px solid var(--line); } .tabs button { flex:1; border:0; border-radius:0; background:#1b1f15; padding:8px 4px; } .tabs button.on { background:var(--sel); }
  .pane { padding:10px; overflow-y:auto; flex:1; display:none; } .pane.show { display:block; }
  .f { display:grid; grid-template-columns:92px 1fr; gap:5px 8px; align-items:center; margin:4px 0; } .f > span { color:var(--dim); font-size:12px; }
  .f input[type=text], .f input[type=number], .f select, .f textarea { width:100%; } .f textarea { min-height:54px; resize:vertical; }
  .num3 { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .box { border:1px solid var(--line); border-radius:6px; padding:7px; margin:6px 0; background:#14170f; }
  .box .hd { display:flex; gap:5px; align-items:center; margin-bottom:5px; } .box .hd b { flex:1; color:var(--accent); font-size:12px; }
  .box .hd button { padding:1px 7px; } .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:5px 0; } .hint { color:var(--dim); font-size:11px; margin:4px 0; line-height:1.35; }
  .olrow { padding:3px 6px; cursor:pointer; border-bottom:1px solid #1d2117; font-size:12px; display:flex; gap:6px; } .olrow:hover { background:#232919; } .olrow.sel { background:var(--sel); }
  .olrow i { font-style:normal; color:var(--dim); width:58px; flex:none; font-size:10px; text-transform:uppercase; padding-top:1px; }
  body.playing .side { pointer-events:none; opacity:.35; } body.playing #top button:not(#btnWalk), body.playing #top select { pointer-events:none; opacity:.4; }
  #pHud { position:absolute; inset:0; pointer-events:none; } .pBanner { position:absolute; top:8px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); border:1px solid #8ab24a; border-radius:999px; padding:4px 14px; font-size:12px; white-space:nowrap; pointer-events:auto; }
  #pBubble { display:none; position:absolute; left:50%; bottom:58px; transform:translateX(-50%); width:280px; background:rgba(18,16,28,.9); border:1px solid #e8c766; border-radius:12px; padding:9px 13px; } #pBubble b { color:#e8c766; text-transform:uppercase; font-size:12px; letter-spacing:.05em; } #pBubble div { margin:3px 0 6px; line-height:1.35; } #pBubble span { background:#c9a13c; color:#241a05; font-weight:bold; border-radius:8px; padding:2px 9px; font-size:12px; }
  #pHint { display:none; position:absolute; left:50%; bottom:40px; transform:translateX(-50%); background:#c9a13c; color:#241a05; font-weight:bold; border-radius:999px; padding:5px 16px; }
  #pSay { display:none; position:absolute; left:50%; bottom:44px; transform:translateX(-50%); width:min(620px,86%); background:rgba(18,16,28,.95); border:1px solid #e8c766; border-radius:12px; padding:11px 18px 13px; pointer-events:auto; cursor:pointer; } #pSay .s-who { color:#e8c766; font-weight:800; text-transform:uppercase; font-size:12px; } #pSay .s-who:empty { display:none; } #pSay .s-text { font-size:15px; line-height:1.5; margin:5px 0 7px; white-space:pre-wrap; } #pSay .s-go { text-align:right; font-size:11px; color:var(--dim); }
  #pNote { display:none; position:absolute; left:50%; top:46px; transform:translateX(-50%); background:rgba(40,30,70,.92); border:1px solid #98f; border-radius:8px; padding:6px 14px; }
  #toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:#222; border:1px solid #888; padding:8px 16px; border-radius:8px; display:none; z-index:30; max-width:70vw; }
  #toast.err { border-color:#e66; color:#fcc; } #toast.ok { border-color:#8c6; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:20; } #modal.open { display:flex; }
  #modal .card { background:#1b1f15; border:2px solid var(--line); border-radius:10px; padding:16px 18px; width:380px; max-width:92vw; } #modal h3 { margin:0 0 8px; color:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>2.5D Scene Editor</h1>
    <select id="sceneSel" title="Open a scene"></select>
    <button id="btnNew">New scene…</button><button id="btnSave" title="Ctrl+S">Save</button><button id="btnWalk" title="Walk around the scene right here">▶ Play here</button><button id="btnPlay" title="Open the saved scene in the real game">Open in game ↗</button>
    <button id="btnUndo" title="Ctrl+Z">Undo</button><button id="btnRedo" title="Ctrl+Y">Redo</button>
    <span id="kindBadge" class="badge">–</span><span id="dirty"></span><span class="sp"></span>
    <span class="hint" style="margin:0">RMB orbit · MMB / Shift+RMB pan · wheel zoom · F focus · T top view</span>
  </div>
  <div id="main">
    <div id="left" class="side">
      <h2>Tools</h2>
      <div class="tools" id="tools"></div>
      <h2>View</h2>
      <div class="opts">
        <label>Grid snap <select id="snap"><option value="0">off</option><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1" selected>1</option><option value="2">2</option><option value="4">4</option></select></label>
        <label><input type="checkbox" id="vGrid" checked> Grid</label>
        <label><input type="checkbox" id="vRef" checked> Hero scale reference</label>
        <label><input type="checkbox" id="vLabels" checked> Labels</label>
        <label><input type="checkbox" id="vTerrOnly"> Terrain only (hide everything else)</label>
        <label><input type="checkbox" id="vEnv" checked> Preview environment</label>
      </div>
      <h2>Layers <span class="kbd">show / lock</span></h2>
      <div class="opts" id="layers"></div>
      <h2>Model palette</h2>
      <div class="row"><input type="text" id="mSearch" placeholder="search…" style="flex:1"><select id="mFolder" style="max-width:110px"></select></div>
      <div id="models"></div>
      <div class="hint" id="curModel">No model chosen. Pick one, then use the Place tool.</div>
    </div>
    <div id="stage"><div id="skyBg"></div><canvas id="gl"></canvas><canvas id="ov"></canvas><div id="loading">Loading…</div><div id="status"></div></div>
    <div id="right" class="side">
      <div class="tabs"><button data-tab="insp" class="on">Inspector</button><button data-tab="scene">Scene</button><button data-tab="outl">Outliner</button></div>
      <div class="pane show" id="p-insp"></div><div class="pane" id="p-scene"></div><div class="pane" id="p-outl"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="modal"><div class="card" id="modalCard"></div></div>
<script src="/battle/battlemap.js"></script>
<script src="/hub3d/envfx.js"></script>
<script>
"use strict";
/* ============================== utilities ============================== */
const $ = (s, r) => (r || document).querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r3 = (v) => Math.round(v * 1000) / 1000;
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) { if (k === "class") e.className = props[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), props[k]); else if (k === "value") e.value = props[k]; else if (props[k] !== false && props[k] != null) e.setAttribute(k, props[k] === true ? "" : props[k]); }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
let toastT = 0;
function toast(msg, kind) { const t = $("#toast"); t.textContent = msg; t.className = kind || ""; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = "none"; }, kind === "err" ? 6000 : 2400); }
const V = {
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};
function perspective(fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2); return [t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]; }
function lookAt(e, c, up) { const z = V.norm(V.sub(e, c)), x = V.norm(V.cross(up, z)), y = V.cross(z, x); return { m: [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -V.dot(x, e), -V.dot(y, e), -V.dot(z, e), 1], x, y, z }; }
function mul4(a, b) { const o = new Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3]; return o; }
const pS = (p) => p.sa ? [p.sc * p.sa[0], p.sc * p.sa[1], p.sc * p.sa[2]] : [p.sc, p.sc, p.sc];   // per-axis scale in the piece's own axes (sa = optional stretch multipliers on top of sc)
function pieceMatrix(p) { const a = (p.rot || 0) * Math.PI / 360, s = pS(p); return B3DMap.mat4TRS([p.x, p.y || 0, p.z], [0, Math.sin(a), 0, Math.cos(a)], s); }

/* ============================== camera ============================== */
const cam = { tx: 0, ty: 0, tz: 0, yaw: 20, pitch: 45, dist: 40, fov: 40, w: 1, h: 1, vp: null, pos: [0, 0, 0], X: [1, 0, 0], Y: [0, 1, 0], Z: [0, 0, 1] };
function updateCam() {
  const ya = cam.yaw * Math.PI / 180, pi = clamp(cam.pitch, 5, 89.5) * Math.PI / 180, t = [cam.tx, cam.ty, cam.tz];
  const pos = V.add(t, [Math.sin(ya) * Math.cos(pi) * cam.dist, Math.sin(pi) * cam.dist, Math.cos(ya) * Math.cos(pi) * cam.dist]);
  const L = lookAt(pos, t, Math.abs(cam.pitch) > 89 ? [Math.sin(ya) * -1, 0, Math.cos(ya) * -1] : [0, 1, 0]);
  cam.pos = pos; cam.X = L.x; cam.Y = L.y; cam.Z = L.z; cam.vp = mul4(perspective(cam.fov * Math.PI / 180, cam.w / cam.h, 0.3, 1200), L.m);
}
function project(p) { const m = cam.vp, cw = m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15]; if (cw <= 0.01) return null; return { x: ((m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12]) / cw * 0.5 + 0.5) * cam.w, y: (1 - ((m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13]) / cw * 0.5 + 0.5)) * cam.h }; }
function rayAt(sx, sy) {
  const t = Math.tan(cam.fov * Math.PI / 360), nx = (sx / cam.w * 2 - 1) * t * (cam.w / cam.h), ny = (1 - sy / cam.h * 2) * t;
  return { o: cam.pos, d: V.norm(V.add(V.add(V.mul(cam.X, nx), V.mul(cam.Y, ny)), V.mul(cam.Z, -1))) };
}
function onPlane(ray, y) { if (Math.abs(ray.d[1]) < 1e-5) return null; const t = (y - ray.o[1]) / ray.d[1]; return t > 0 ? [ray.o[0] + ray.d[0] * t, y, ray.o[2] + ray.d[2] * t] : null; }
function rayBox(ray, mn, mx) {
  let t0 = 0, t1 = 1e9;
  for (let i = 0; i < 3; i++) {
    if (Math.abs(ray.d[i]) < 1e-9) { if (ray.o[i] < mn[i] || ray.o[i] > mx[i]) return null; continue; }
    let a = (mn[i] - ray.o[i]) / ray.d[i], b = (mx[i] - ray.o[i]) / ray.d[i]; if (a > b) [a, b] = [b, a];
    t0 = Math.max(t0, a); t1 = Math.min(t1, b); if (t0 > t1) return null;
  }
  return t0;
}

/* ============================== GL ============================== */
const cv = $("#gl"), ov = $("#ov"), g2 = ov.getContext("2d");
const gl = cv.getContext("webgl", { antialias: true, alpha: true });
if (!gl) { document.body.innerHTML = "<p style='padding:30px'>WebGL is not available in this browser.</p>"; throw new Error("no webgl"); }
const idxUint = !!gl.getExtension("OES_element_index_uint");
function prog(vs, fs, attrs) {
  const p = gl.createProgram();
  for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); gl.attachShader(p, sh); }
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u };
}
const MP = prog(`attribute vec3 a_p; attribute vec3 a_n; attribute vec2 a_t; uniform mat4 u_vp, u_model; varying vec3 v_n; varying vec2 v_t;
  void main(){ v_n = mat3(u_model[0].xyz, u_model[1].xyz, u_model[2].xyz) * a_n; v_t = a_t; gl_Position = u_vp * u_model * vec4(a_p,1.0); }`,
  `precision mediump float; varying vec3 v_n; varying vec2 v_t; uniform sampler2D u_tex; uniform vec4 u_color; uniform vec3 u_ldir, u_lcol, u_amb; uniform float u_cut;
  void main(){ vec4 c = texture2D(u_tex, v_t) * u_color; if (c.a < u_cut) discard; vec3 n = normalize(v_n); float d = max(dot(n, -u_ldir), 0.0);
    vec3 l = u_amb + u_lcol * d; gl_FragColor = vec4(c.rgb * min(l, vec3(1.35)), c.a); }`, ["a_p", "a_n", "a_t"]);
const FP = prog(`attribute vec3 a_p; uniform mat4 u_vp; void main(){ gl_Position = u_vp * vec4(a_p,1.0); }`,
  `precision mediump float; uniform vec4 u_c; void main(){ gl_FragColor = u_c; }`, ["a_p"]);

const PP = prog(`attribute vec3 a_p; attribute vec3 a_n; uniform mat4 u_vp; varying vec3 v_n; varying vec2 v_w; void main(){ v_n = a_n; v_w = a_p.xz; gl_Position = u_vp * vec4(a_p,1.0); }`,
  `#ifdef GL_FRAGMENT_PRECISION_HIGH
  precision highp float;
  #else
  precision mediump float;
  #endif
  varying vec3 v_n; varying vec2 v_w; uniform sampler2D u_splat, u_t0, u_t1, u_t2, u_t3; uniform vec4 u_rect, u_inv; uniform vec3 u_ldir, u_lcol, u_amb;
  void main(){ vec4 w = texture2D(u_splat, (v_w - u_rect.xy) * u_rect.zw); float tot = w.r + w.g + w.b + w.a; if (tot < 0.004) discard;
    vec3 c = texture2D(u_t0, v_w * u_inv.x).rgb * w.r + texture2D(u_t1, v_w * u_inv.y).rgb * w.g + texture2D(u_t2, v_w * u_inv.z).rgb * w.b + texture2D(u_t3, v_w * u_inv.w).rgb * w.a;
    c /= tot; vec3 n = normalize(v_n); float d = max(dot(n, -u_ldir), 0.0); vec3 l = u_amb + u_lcol * d; gl_FragColor = vec4(c * min(l, vec3(1.35)), min(tot, 1.0)); }`, ["a_p", "a_n"]);
const flatBuf = gl.createBuffer();
const white = (() => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([255, 255, 255, 255])); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); return t; })();
function flat(mode, arr, col) {                      // arr: flat [x,y,z,...]
  if (!arr.length) return;
  gl.useProgram(FP.p); gl.uniformMatrix4fv(FP.u.u_vp, false, cam.vp); gl.uniform4f(FP.u.u_c, col[0], col[1], col[2], col[3] === undefined ? 1 : col[3]);

  gl.enableVertexAttribArray(0); gl.disableVertexAttribArray(1); gl.disableVertexAttribArray(2); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.drawArrays(mode, 0, arr.length / 3);
}
const boxEdges = (a, b) => { const [x0, y0, z0] = a, [x1, y1, z1] = b, c = [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], [x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]]; const e = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]]; return e.flatMap(([i, j]) => [...c[i], ...c[j]]); };
const rectTris = (x0, z0, x1, z1, y) => [x0, y, z0, x1, y, z0, x1, y, z1, x0, y, z0, x1, y, z1, x0, y, z1];
const circleLines = (cx, cz, r, y, n = 48) => { const o = []; for (let i = 0; i < n; i++) { const a = i / n * 6.2832, b = (i + 1) / n * 6.2832; o.push(cx + Math.cos(a) * r, y, cz + Math.sin(a) * r, cx + Math.cos(b) * r, y, cz + Math.sin(b) * r); } return o; };

/* ============================== models ============================== */
const modelReady = new Map();            // url -> { objs, min, max, failed? }   (sync access for drawing)
const modelLoading = new Map();
const texCache = new Map();
async function makeTex(im, base) {
  const key = im.uri ? new URL(im.uri, base).href : null; if (key && texCache.has(key)) return texCache.get(key);
  const pr = (async () => {
    let blob; if (im.bytes) blob = new Blob([im.bytes], { type: im.mime }); else { const r = await fetch(key); if (!r.ok) throw new Error("texture"); blob = await r.blob(); }
    const bmp = await createImageBitmap(blob, { premultiplyAlpha: "none", colorSpaceConversion: "none" });
    const pot = (v) => Math.min(2048, 1 << Math.max(0, Math.round(Math.log2(Math.max(1, v)))));
