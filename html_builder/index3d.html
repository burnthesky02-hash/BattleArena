<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Battle Arena -- 2.5D Scene Editor</title>
<style>
  :root { --ink:#eae6da; --dim:#a29d88; --accent:#f2d98a; --bg:#10120e; --panel:#171a13; --line:#3a3f2f; --field:#23271c; --sel:#5a6e2f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px "Trebuchet MS","Segoe UI",sans-serif; overflow:hidden; }
  button, select, input, textarea { font:inherit; color:var(--ink); background:var(--field); border:1px solid #545a41; border-radius:5px; padding:4px 7px; }
  input[type=color] { padding:0; width:34px; height:24px; }
  input[type=checkbox] { width:auto; }
  button { cursor:pointer; } button:hover { background:#394026; } button.on { background:var(--sel); border-color:#8ab24a; color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  #app { display:flex; flex-direction:column; height:100%; }
  #top { display:flex; align-items:center; gap:8px; padding:6px 12px; background:linear-gradient(#20241c,#171a13); border-bottom:2px solid var(--line); flex-wrap:wrap; }
  #top h1 { font-size:14px; margin:0 8px 0 0; color:var(--accent); white-space:nowrap; }
  #top .sp { flex:1; } #top .badge { font-size:11px; padding:2px 7px; border-radius:9px; background:#2b3a1c; border:1px solid #567; color:#cfe; }
  #dirty { color:#f6a; font-weight:bold; min-width:14px; }
  #main { flex:1; display:flex; min-height:0; }
  .side { background:var(--panel); border:0 solid var(--line); overflow-y:auto; flex:none; }
  #left { width:250px; border-right-width:2px; padding:8px; } #right { width:310px; border-left-width:2px; display:flex; flex-direction:column; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#b9b39a; margin:12px 0 5px; } h2:first-child { margin-top:0; }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:4px; } .tools button { text-align:left; padding:5px 7px; }
  .tools kbd, .kbd { color:var(--dim); font-size:10px; float:right; }
  .opts label { display:flex; align-items:center; gap:6px; margin:3px 0; color:var(--ink); font-size:12px; }
  #stage { flex:1; position:relative; min-width:0; background:#1a1a2a; }
  #skyBg { position:absolute; inset:0; display:none; }
  #gl, #ov { position:absolute; inset:0; width:100%; height:100%; display:block; } #ov { pointer-events:none; }
  #status { position:absolute; left:0; right:0; bottom:0; padding:3px 10px; background:rgba(10,12,8,.8); font-size:11px; color:var(--dim); display:flex; gap:14px; pointer-events:none; }
  #loading { position:absolute; left:50%; top:46%; transform:translateX(-50%); padding:8px 16px; background:rgba(0,0,0,.75); border-radius:8px; display:none; }
  #models { height:190px; overflow-y:auto; border:1px solid var(--line); border-radius:5px; background:#12150f; }
  .mrow { padding:3px 7px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; border-bottom:1px solid #1d2117; }
  .mrow:hover { background:#232919; } .mrow.cur { background:var(--sel); color:#fff; } .mrow small { color:var(--dim); margin-left:6px; }
  .tabs { display:flex; border-bottom:2px solid var(--line); } .tabs button { flex:1; border:0; border-radius:0; background:#1b1f15; padding:8px 4px; } .tabs button.on { background:var(--sel); }
  .pane { padding:10px; overflow-y:auto; flex:1; display:none; } .pane.show { display:block; }
  .f { display:grid; grid-template-columns:92px 1fr; gap:5px 8px; align-items:center; margin:4px 0; } .f > span { color:var(--dim); font-size:12px; }
  .f input[type=text], .f input[type=number], .f select, .f textarea { width:100%; } .f textarea { min-height:54px; resize:vertical; }
  .num3 { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .box { border:1px solid var(--line); border-radius:6px; padding:7px; margin:6px 0; background:#14170f; }
  .box .hd { display:flex; gap:5px; align-items:center; margin-bottom:5px; } .box .hd b { flex:1; color:var(--accent); font-size:12px; }
  .box .hd button { padding:1px 7px; } .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:5px 0; } .hint { color:var(--dim); font-size:11px; margin:4px 0; line-height:1.35; }
  .olrow { padding:3px 6px; cursor:pointer; border-bottom:1px solid #1d2117; font-size:12px; display:flex; gap:6px; } .olrow:hover { background:#232919; } .olrow.sel { background:var(--sel); }
  .olrow i { font-style:normal; color:var(--dim); width:58px; flex:none; font-size:10px; text-transform:uppercase; padding-top:1px; }
  body.playing .side { pointer-events:none; opacity:.35; } body.playing #top button:not(#btnWalk), body.playing #top select { pointer-events:none; opacity:.4; }
  #pHud { position:absolute; inset:0; pointer-events:none; } .pBanner { position:absolute; top:8px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); border:1px solid #8ab24a; border-radius:999px; padding:4px 14px; font-size:12px; white-space:nowrap; pointer-events:auto; }
  #pBubble { display:none; position:absolute; left:50%; bottom:58px; transform:translateX(-50%); width:280px; background:rgba(18,16,28,.9); border:1px solid #e8c766; border-radius:12px; padding:9px 13px; } #pBubble b { color:#e8c766; text-transform:uppercase; font-size:12px; letter-spacing:.05em; } #pBubble div { margin:3px 0 6px; line-height:1.35; } #pBubble span { background:#c9a13c; color:#241a05; font-weight:bold; border-radius:8px; padding:2px 9px; font-size:12px; }
  #pHint { display:none; position:absolute; left:50%; bottom:40px; transform:translateX(-50%); background:#c9a13c; color:#241a05; font-weight:bold; border-radius:999px; padding:5px 16px; }
  #pSay { display:none; position:absolute; left:50%; bottom:44px; transform:translateX(-50%); width:min(620px,86%); background:rgba(18,16,28,.95); border:1px solid #e8c766; border-radius:12px; padding:11px 18px 13px; pointer-events:auto; cursor:pointer; } #pSay .s-who { color:#e8c766; font-weight:800; text-transform:uppercase; font-size:12px; } #pSay .s-who:empty { display:none; } #pSay .s-text { font-size:15px; line-height:1.5; margin:5px 0 7px; white-space:pre-wrap; } #pSay .s-go { text-align:right; font-size:11px; color:var(--dim); }
  #pNote { display:none; position:absolute; left:50%; top:46px; transform:translateX(-50%); background:rgba(40,30,70,.92); border:1px solid #98f; border-radius:8px; padding:6px 14px; }
  #toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:#222; border:1px solid #888; padding:8px 16px; border-radius:8px; display:none; z-index:30; max-width:70vw; }
  #toast.err { border-color:#e66; color:#fcc; } #toast.ok { border-color:#8c6; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:20; } #modal.open { display:flex; }
  #modal .card { background:#1b1f15; border:2px solid var(--line); border-radius:10px; padding:16px 18px; width:380px; max-width:92vw; } #modal h3 { margin:0 0 8px; color:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>2.5D Scene Editor</h1>
    <select id="sceneSel" title="Open a scene"></select>
    <button id="btnNew">New scene…</button><button id="btnSave" title="Ctrl+S">Save</button><button id="btnWalk" title="Walk around the scene right here">▶ Play here</button><button id="btnPlay" title="Open the saved scene in the real game">Open in game ↗</button>
    <button id="btnUndo" title="Ctrl+Z">Undo</button><button id="btnRedo" title="Ctrl+Y">Redo</button>
    <span id="kindBadge" class="badge">–</span><span id="dirty"></span><span class="sp"></span>
    <span class="hint" style="margin:0">RMB orbit · MMB / Shift+RMB pan · wheel zoom · F focus · T top view</span>
  </div>
  <div id="main">
    <div id="left" class="side">
      <h2>Tools</h2>
      <div class="tools" id="tools"></div>
      <h2>View</h2>
      <div class="opts">
        <label>Grid snap <select id="snap"><option value="0">off</option><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1" selected>1</option><option value="2">2</option><option value="4">4</option></select></label>
        <label><input type="checkbox" id="vGrid" checked> Grid</label>
        <label><input type="checkbox" id="vRef" checked> Hero scale reference</label>
        <label><input type="checkbox" id="vLabels" checked> Labels</label>
        <label><input type="checkbox" id="vEnv" checked> Preview environment</label>
      </div>
      <h2>Layers <span class="kbd">show / lock</span></h2>
      <div class="opts" id="layers"></div>
      <h2>Model palette</h2>
      <div class="row"><input type="text" id="mSearch" placeholder="search…" style="flex:1"><select id="mFolder" style="max-width:110px"></select></div>
      <div id="models"></div>
      <div class="hint" id="curModel">No model chosen. Pick one, then use the Place tool.</div>
    </div>
    <div id="stage"><div id="skyBg"></div><canvas id="gl"></canvas><canvas id="ov"></canvas><div id="loading">Loading…</div><div id="status"></div></div>
    <div id="right" class="side">
      <div class="tabs"><button data-tab="insp" class="on">Inspector</button><button data-tab="scene">Scene</button><button data-tab="outl">Outliner</button></div>
      <div class="pane show" id="p-insp"></div><div class="pane" id="p-scene"></div><div class="pane" id="p-outl"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="modal"><div class="card" id="modalCard"></div></div>
<script src="/battle/battlemap.js"></script>
<script src="/hub3d/envfx.js"></script>
<script>

async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(url + " → HTTP " + r.status); return r.json(); }

    h("label", { class: "row" }, copy, "Start as a copy of the open scene (same kind only)"), h("div", { class: "hint" }, "Ids are lowercase letters, digits, - and _. Nothing is written to disk until you press Save."),
