<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Editor</title>
<style>
  :root { --ink:#eae6da; --dim:#a29d88; --accent:#f2d98a; --bg:#10120e; --panel:#171a13; --line:#3a3f2f; --field:#23271c; --sel:#5a6e2f; --good:#8fe0a4; --bad:#ff8a8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 "Segoe UI", Verdana, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #bar h1 { margin: 0 8px 0 0; font-size: 15px; color: var(--accent); letter-spacing: .5px; }
  button, .btn { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; text-decoration: none; }
  button:hover, .btn:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  button.pri { background: var(--sel); border-color: #86a043; color: #fff; }
  button.warn:hover { border-color: var(--bad); color: var(--bad); }
  button.x { padding: 2px 8px; }
  #main { flex: 1; min-height: 0; display: grid; grid-template-columns: 170px 300px 1fr; }
  #tabs, #list, #form { overflow-y: auto; min-height: 0; }
  #tabs { background: var(--panel); border-right: 1px solid var(--line); padding: 8px 0; }
  .tab { padding: 9px 14px; cursor: pointer; color: var(--dim); border-left: 3px solid transparent; }
  .tab:hover { color: var(--ink); background: rgba(255,255,255,.04); }
  .tab.on { color: var(--accent); border-left-color: var(--accent); background: rgba(242,217,138,.08); }
  #listcol { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #lhead { flex: none; padding: 8px; display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
  #lhead input { flex: 1; min-width: 0; }
  #desc { flex: none; padding: 8px 10px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); }
  #list { flex: 1; }
  .row { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.04); display: flex; align-items: center; gap: 6px; }
  .row:hover { background: rgba(255,255,255,.05); }
  .row.on { background: rgba(90,110,47,.45); }
  .row small { color: var(--dim); margin-left: auto; font-size: 11px; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .grp { padding: 6px 10px 3px; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  #form { padding: 14px 18px 40px; }
  #form h2 { margin: 0 0 4px; font-size: 18px; color: var(--accent); }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .f { display: grid; grid-template-columns: 210px 1fr; gap: 10px; align-items: start; margin: 7px 0; max-width: 900px; }
  .f > label { color: var(--dim); padding-top: 5px; }
  input[type=text], input[type=number], textarea, select { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 70px; resize: vertical; }
  input[type=checkbox] { width: 18px; height: 18px; margin-top: 5px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .grid label { display: block; color: var(--dim); font-size: 11px; margin-bottom: 1px; }
  .line { display: flex; gap: 6px; margin-bottom: 5px; align-items: center; }
  .card { border: 1px solid var(--line); border-radius: 7px; padding: 8px; margin-bottom: 7px; background: rgba(0,0,0,.18); }
  .card .f { grid-template-columns: 150px 1fr; margin: 4px 0; }
  .ro { padding: 5px 0; color: var(--ink); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 9px 18px; border-radius: 8px; background: #000d; border: 1px solid var(--line); opacity: 0; transition: .2s; pointer-events: none; max-width: 80vw; }
  #toast.show { opacity: 1; } #toast.ok { border-color: var(--good); } #toast.err { border-color: var(--bad); color: var(--bad); }
  .actions { position: sticky; top: -14px; z-index: 5; display: flex; gap: 8px; padding: 10px 0; margin: -10px 0 6px; background: linear-gradient(var(--bg) 80%, transparent); }
  .dirty { color: var(--accent); align-self: center; font-size: 12px; }
  .empty { color: var(--dim); padding: 40px; text-align: center; }
  @media (max-width: 900px) { #main { grid-template-columns: 120px 1fr; } #listcol { display: none; } .f { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="bar">
  <h1>Database Editor</h1>
  <a class="btn" href="/builder3d">Scene Editor</a>
  <a class="btn" href="/">&larr; Back to Game</a>
  <span style="flex:1"></span>
  <span class="sub" style="margin:0">Edits to items, gear, enemies, bosses, shops and drops apply to the running game immediately and are saved in data/db_overrides.json.</span>
</div>
<div id="main">
  <div id="tabs"></div>
  <div id="listcol">
    <div id="lhead"><input id="q" type="text" placeholder="Search..."><button id="btnNew" class="pri" style="display:none">+ New</button></div>
    <div id="desc"></div>
    <div id="list"></div>
  </div>
  <div id="form"><div class="empty">Pick a table, then a row.</div></div>
</div>
<div id="toast"></div>
<script>
(function () {
  "use strict";
  var S = null, table = null, rows = [], edited = {}, selId = null, cur = null, dirty = false, query = "";
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, props) {
    var e = document.createElement(tag);
    if (props) for (var k in props) { if (props[k] == null) continue; if (k === "text") e.textContent = props[k]; else if (k === "class") e.className = props[k]; else if (k.slice(0, 2) === "on") e[k] = props[k]; else e.setAttribute(k, props[k]); }
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    return e;
  }
  var tt = null;
  function toast(msg, ok) { var t = $("toast"); t.textContent = msg; t.className = "show " + (ok === false ? "err" : "ok"); clearTimeout(tt); tt = setTimeout(function () { t.className = ""; }, 3200); }
  function jget(u) { return fetch(u).then(function (r) { return r.json(); }); }
  function jpost(u, b) { return fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function mark() { dirty = true; var d = $("dirtyMark"); if (d) d.textContent = "unsaved changes"; }
  function T() { return S.tables.filter(function (t) { return t.id === table; })[0]; }

  // ---------- field widgets: each returns an element editing obj[f.key] ----------
  function numInput(get, set, step, isFloat) {
    var i = el("input", { type: "number", step: step || (isFloat ? "0.01" : "1") }); i.value = get();
    i.onchange = function () { var v = parseFloat(i.value); set(isNaN(v) ? 0 : (isFloat ? v : Math.round(v))); mark(); }; return i;
  }
  function select(opts, val, set) {
    var s = el("select"); var has = opts.some(function (o) { return o[0] === val; });
    (has ? opts : [[val, val + " (unknown)"]].concat(opts)).forEach(function (o) { var op = el("option", { value: o[0], text: o[1] }); if (o[0] === val) op.selected = true; s.appendChild(op); });
    s.onchange = function () { set(s.value); mark(); }; return s;
  }
  function catOpts(name) { return (S.catalogs[name] || []).map(function (c) { return [c.id, c.name]; }); }

  function widget(f, obj, redraw) {
    var k = f.key, t = f.type;
    if (t === "ro") return el("div", { class: "ro", text: obj[k] == null || obj[k] === "" ? "-" : String(obj[k]) });
    if (t === "text") { var i = el("input", { type: "text" }); i.value = obj[k] == null ? "" : obj[k]; i.oninput = function () { obj[k] = i.value; mark(); }; return i; }
    if (t === "area") { var a = el("textarea"); a.value = obj[k] == null ? "" : obj[k]; a.oninput = function () { obj[k] = a.value; mark(); }; return a; }
    if (t === "int" || t === "float") return numInput(function () { return obj[k] == null ? 0 : obj[k]; }, function (v) { obj[k] = v; }, null, t === "float");
    if (t === "bool") { var c = el("input", { type: "checkbox" }); c.checked = !!obj[k]; c.onchange = function () { obj[k] = c.checked; mark(); }; return c; }
    if (t === "select") return select(f.catalog ? catOpts(f.catalog) : f.options.map(function (o) { return [o, o]; }), obj[k], function (v) { obj[k] = v; });
    if (t === "stats") {
      obj[k] = obj[k] || {}; var g = el("div", { class: "grid" });
      S.stat_keys.forEach(function (sk) { var w = el("div", null, el("label", { text: S.stat_labels[sk] })); w.appendChild(numInput(function () { return obj[k][sk] || 0; }, function (v) { obj[k][sk] = v; })); g.appendChild(w); });
      return g;
    }
    if (t === "resist") {
      obj[k] = obj[k] || {}; var g2 = el("div", { class: "grid" });
      S.elements.forEach(function (en) { var w = el("div", null, el("label", { text: en })); w.appendChild(numInput(function () { return obj[k][en] == null ? 1 : obj[k][en]; }, function (v) { obj[k][en] = v; }, "0.05", true)); g2.appendChild(w); });
      return g2;
    }
    if (t === "numdict") {
      obj[k] = obj[k] || {}; var g3 = el("div", { class: "grid" });
      f.keys.forEach(function (key) { var w = el("div", null, el("label", { text: key })); w.appendChild(numInput(function () { return obj[k][key] || 0; }, function (v) { obj[k][key] = v; }, f.float ? "0.01" : "1", !!f.float)); g3.appendChild(w); });
      return g3;
    }
    if (t === "range") {
      obj[k] = obj[k] || [0, 0]; var g4 = el("div", { class: "grid" });
      ["min", "max"].forEach(function (n, ix) { var w = el("div", null, el("label", { text: n })); w.appendChild(numInput(function () { return obj[k][ix] || 0; }, function (v) { obj[k][ix] = v; })); g4.appendChild(w); });
      return g4;
    }
    if (t === "strlist") { var sl = el("input", { type: "text" }); sl.value = (obj[k] || []).join(", "); sl.onchange = function () { obj[k] = sl.value.split(",").map(function (x) { return x.trim(); }).filter(Boolean); mark(); }; return sl; }
    if (t === "idlist") {
      obj[k] = obj[k] || []; var box = el("div"), opts = catOpts(f.catalog);
      obj[k].forEach(function (id, ix) {
        box.appendChild(el("div", { class: "line" }, select(opts, id, function (v) { obj[k][ix] = v; }),
          el("button", { class: "x warn", text: "x", onclick: function () { obj[k].splice(ix, 1); mark(); redraw(); } })));
      });
      var add = select([["", "+ add..."]].concat(opts), "", function (v) { if (v) { obj[k].push(v); redraw(); } });
      box.appendChild(add); return box;
    }
    if (t === "rows") {
      obj[k] = obj[k] || []; var rb = el("div");
      obj[k].forEach(function (r, ix) {
        var card = el("div", { class: "card" });
        f.of.forEach(function (sf) { card.appendChild(el("div", { class: "f" }, el("label", { text: sf.label }), widget(sf, r, redraw))); });
        card.appendChild(el("button", { class: "warn", text: "Remove", onclick: function () { obj[k].splice(ix, 1); mark(); redraw(); } }));
        rb.appendChild(card);
      });
      rb.appendChild(el("button", { text: "+ Add", onclick: function () {
        var n = {}; f.of.forEach(function (sf) { n[sf.key] = sf.type === "int" ? (sf.key === "min_level" ? 1 : 0) : sf.type === "strlist" ? [] : sf.type === "select" && sf.catalog ? (catOpts(sf.catalog)[0] || [""])[0] : ""; });
        obj[k].push(n); mark(); redraw(); } }));
      return rb;
    }
    return el("div", { text: "(unsupported field type " + t + ")" });
  }

  // ---------- rendering ----------
  function drawTabs() {
    var box = $("tabs"); box.innerHTML = "";
    S.tables.forEach(function (t) { box.appendChild(el("div", { class: "tab" + (t.id === table ? " on" : ""), text: t.label, onclick: function () { openTable(t.id); } })); });
  }
  function label(r) { return r.title || r.name || r.text || r.id; }
  function drawList() {
    var box = $("list"), q = query.trim().toLowerCase(), lastGroup = null; box.innerHTML = "";
    rows.forEach(function (r) {
      var hay = (r.id + " " + label(r) + " " + (r.slot || "") + " " + (r.rarity || "") + " " + (r.kind || "")).toLowerCase();
      if (q && hay.indexOf(q) < 0) return;
      if (r.group && r.group !== lastGroup) { box.appendChild(el("div", { class: "grp", text: r.group })); }
      lastGroup = r.group || null;
      var side = r.rarity ? r.rarity + " " + r.slot : r.kind || (r.name && r.name !== label(r) ? r.name : r.id);
      box.appendChild(el("div", { class: "row" + (r.id === selId ? " on" : ""), onclick: function () { pick(r.id); } },
        edited[r.id] ? el("span", { class: "dot", title: "edited" }) : null, el("span", { text: String(label(r)).slice(0, 60) }), el("small", { text: side })));
    });
    if (!box.children.length) box.appendChild(el("div", { class: "empty", text: "Nothing here." }));
  }
  function drawForm() {
    var box = $("form"), t = T(); box.innerHTML = "";
    if (!cur) { box.appendChild(el("div", { class: "empty", text: "Pick a row to edit it." })); return; }
    var keep = box.scrollTop;
    box.appendChild(el("h2", { text: String(label(cur)) }));
    box.appendChild(el("div", { class: "sub", text: "id: " + cur.id + (edited[cur.id] ? "  |  edited from the shipped values" : "") }));
    var acts = el("div", { class: "actions" },
      el("button", { class: "pri", text: "Save", onclick: save }),
      el("button", { text: "Revert", onclick: function () { pick(selId, true); } }));
    if (t.resettable) acts.appendChild(el("button", { class: "warn", text: "Reset to shipped", disabled: edited[cur.id] ? null : "disabled", onclick: reset }));
    if (t.can_delete) acts.appendChild(el("button", { class: "warn", text: "Delete", onclick: del }));
    acts.appendChild(el("span", { class: "dirty", id: "dirtyMark", text: dirty ? "unsaved changes" : "" }));
    box.appendChild(acts);
    t.fields.forEach(function (f) { box.appendChild(el("div", { class: "f" }, el("label", { text: f.label }), widget(f, cur, drawForm))); });
    box.scrollTop = keep;
  }

  // ---------- actions ----------
  function load(tid, keepSel) {
    return jget("/api/db/rows?table=" + encodeURIComponent(tid)).then(function (res) {
      rows = res.rows; edited = {}; (res.edited || []).forEach(function (i) { edited[i] = true; });
      if (!keepSel) { selId = null; cur = null; }
      drawList(); drawForm();
    });
  }
  function openTable(tid) {
    if (dirty && !confirm("Discard unsaved changes?")) return;
    table = tid; dirty = false; query = ""; $("q").value = ""; var t = T();
    $("desc").textContent = t.desc; $("btnNew").style.display = t.can_add ? "" : "none"; drawTabs();
    load(tid, false).then(function () { if (rows.length === 1) pick(rows[0].id, true); });
    try { location.hash = tid; } catch (e) {}
  }
  function pick(id, force) {
    if (!force && dirty && !confirm("Discard unsaved changes?")) return;
    selId = id; dirty = false; cur = clone(rows.filter(function (r) { return r.id === id; })[0] || null); drawList(); drawForm();
  }
  function save() {
    jpost("/api/db/save", { table: table, row: cur }).then(function (res) {
      if (!res.ok) { toast(res.error || "Could not save.", false); return; }
      dirty = false; toast("Saved " + label(res.row) + (T().file_backed ? "." : ". Applied to the running game."), true);
      load(table, true).then(function () { selId = res.row.id; cur = clone(res.row); drawList(); drawForm(); });
    }).catch(function () { toast("Could not reach the server.", false); });
  }
  function reset() {
    if (!confirm("Put " + label(cur) + " back to its shipped values?")) return;
    jpost("/api/db/reset", { table: table, id: cur.id }).then(function (res) {
      if (!res.ok) { toast(res.error || "Could not reset.", false); return; }
      dirty = false; toast("Reset.", true); load(table, true).then(function () { cur = clone(res.row); drawList(); drawForm(); });
    });
  }
  function del() {
    if (!confirm("Delete " + label(cur) + "? A backup of the file is kept.")) return;
    jpost("/api/db/delete", { table: table, id: cur.id }).then(function (res) {
      if (!res.ok) { toast(res.error || "Could not delete.", false); return; }
      dirty = false; toast("Deleted.", true); load(table, false);
    });
  }
  $("btnNew").onclick = function () {
    if (dirty && !confirm("Discard unsaved changes?")) return;
    jpost("/api/db/new", { table: table }).then(function (res) {
      if (!res.ok) { toast(res.error, false); return; }
      cur = res.row; selId = cur.id; rows = rows.concat([clone(cur)]); dirty = true; drawList(); drawForm();
    });
  };
  $("q").oninput = function () { query = this.value; drawList(); };
  window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
  document.addEventListener("keydown", function (e) { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (cur) save(); } });

  jget("/api/db/schema").then(function (s) {
    S = s; var want = (location.hash || "").slice(1);
    openTable(S.tables.some(function (t) { return t.id === want; }) ? want : S.tables[0].id);
  }).catch(function () { $("form").innerHTML = ""; $("form").appendChild(el("div", { class: "empty", text: "Could not reach the game server (is hub_server.py running?)." })); });
})();
</script>
</body>
</html>
