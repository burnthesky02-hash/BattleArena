<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shop</title>
<style>
  :root {
    --gold: #e8c766; --gold-d: #b8892c; --gold-l: #fff3c8;
    --ink: #0b0912; --panel: rgba(20, 17, 32, 0.88); --panel-2: rgba(30, 25, 48, 0.9);
    --line: rgba(232, 199, 102, 0.28); --line-2: rgba(232, 199, 102, 0.55);
    --text: #f1ecdd; --dim: #aaa391; --good: #6fe39a; --bad: #ff7b7b;
    --r-common: #bebec3; --r-rare: #5aaae6; --r-epic: #b96ee6; --r-legendary: #ebaf3c; --r-mythic: #e63c5a;
    --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", Verdana, sans-serif; color: var(--text);
    background:
      radial-gradient(900px 420px at 18% -8%, rgba(120, 84, 200, .30), transparent 70%),
      radial-gradient(700px 380px at 92% 8%, rgba(232, 160, 60, .16), transparent 70%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, #151024 0%, #0b0912 100%);
    display: flex; flex-direction: column;
  }
  a { color: var(--gold); text-decoration: none; }
  a:hover { color: var(--gold-l); }

  /* ---------- header ---------- */
  #top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex: none;
    padding: 12px 24px; border-bottom: 1px solid var(--line-2);
    background: linear-gradient(180deg, rgba(40, 30, 66, .85), rgba(18, 14, 30, .85));
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand .crest { width: 44px; height: 44px; flex: none; color: var(--gold); filter: drop-shadow(0 0 8px rgba(232,199,102,.45)); }
  .brand h1 { margin: 0; font: 700 26px/1 var(--serif); letter-spacing: 3px; text-transform: uppercase; color: var(--gold-l); text-shadow: 0 2px 0 #000, 0 0 18px rgba(232,199,102,.35); }
  .brand .sub { font-size: 12px; color: var(--dim); margin-top: 4px; font-style: italic; }
  .right { display: flex; align-items: center; gap: 14px; flex: none; }
  .purse {
    display: inline-flex; align-items: center; gap: 9px; padding: 7px 16px 7px 8px; border-radius: 999px; font-weight: 800; font-size: 16px;
    background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.3)); border: 1px solid var(--line-2); box-shadow: inset 0 1px 6px rgba(0,0,0,.6);
  }
  .coin { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #fff3c8, #e8c766 45%, #9a6d17); color: #3a2704; font-size: 13px; font-weight: 900; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .back { padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.04); font-weight: 600; font-size: 13px; }
  .back:hover { border-color: var(--line-2); background: rgba(232,199,102,.1); }

  /* ---------- layout ---------- */
  #main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(380px, 1fr) minmax(360px, 460px); gap: 16px; padding: 16px 24px 18px; max-width: 1400px; width: 100%; margin: 0 auto; }
  .col { min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 10px 30px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.03); overflow: hidden; }

  /* tabs + controls */
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 12px 8px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,.18); }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; cursor: pointer; user-select: none; font-size: 12.5px; font-weight: 700; color: var(--dim);
    border: 1px solid transparent; background: rgba(255,255,255,.04); transition: .12s; }
  .tab svg { width: 16px; height: 16px; }
  .tab:hover { color: var(--text); border-color: var(--line); }
  .tab.active { color: #2a1d05; background: linear-gradient(180deg, #f3d77f, #c3922f); border-color: var(--gold-l); box-shadow: 0 0 14px rgba(232,199,102,.35); }
  #ctl { display: flex; gap: 8px; padding: 8px 12px; align-items: center; }
  #ctl input, #ctl select { padding: 7px 10px; border-radius: 9px; background: rgba(0,0,0,.35); color: var(--text); border: 1px solid var(--line); font-size: 12.5px; outline: none; }
  #ctl input { flex: 1; min-width: 0; }
  #ctl input:focus, #ctl select:focus { border-color: var(--line-2); }
  #note { padding: 0 14px 6px; font-size: 11.5px; color: var(--dim); }

  /* scrolling list */
  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 14px; display: flex; flex-direction: column; gap: 7px; scroll-behavior: smooth; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: var(--gold-d) rgba(0,0,0,.35); }
  #list::-webkit-scrollbar, #detail::-webkit-scrollbar { width: 10px; }
  #list::-webkit-scrollbar-track, #detail::-webkit-scrollbar-track { background: rgba(0,0,0,.35); border-radius: 8px; }
  #list::-webkit-scrollbar-thumb, #detail::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--gold), var(--gold-d)); border-radius: 8px; border: 2px solid rgba(0,0,0,.45); }
  .empty { text-align: center; color: var(--dim); padding: 30px 10px; font-style: italic; }

  .card {
    --rc: var(--r-common);
    display: grid; grid-template-columns: 50px 1fr auto; gap: 12px; align-items: center; padding: 9px 12px 9px 9px; cursor: pointer; position: relative; flex: none;
    border: 1px solid var(--line); border-left: 4px solid var(--rc); border-radius: 12px; background: linear-gradient(90deg, rgba(255,255,255,.035), rgba(255,255,255,.01)); transition: .12s;
  }
  .card:hover { border-color: var(--rc); background: linear-gradient(90deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); transform: translateX(2px); }
  .card.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 18px rgba(232,199,102,.25); background: linear-gradient(90deg, rgba(232,199,102,.14), rgba(255,255,255,.02)); }
  .ico { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--rc);
    background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--rc) 28%, transparent), rgba(0,0,0,.5) 75%); border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent); box-shadow: inset 0 0 12px rgba(0,0,0,.55); }
  .ico svg { width: 28px; height: 28px; filter: drop-shadow(0 0 5px color-mix(in srgb, var(--rc) 70%, transparent)); }
  .card .nm { font-weight: 800; font-size: 14.5px; color: var(--rc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { font-size: 11px; color: var(--dim); text-transform: capitalize; margin: 1px 0 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
  .chip.up { color: var(--good); border-color: rgba(111,227,154,.35); }
  .chip.down { color: var(--bad); border-color: rgba(255,123,123,.35); }
  .chip.flat { color: var(--text); }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .price { display: inline-flex; align-items: center; gap: 5px; font-weight: 900; font-size: 14px; color: var(--gold-l); }
  .price .coin { width: 16px; height: 16px; font-size: 9px; }
  .price.poor { color: var(--bad); }
  .who { display: flex; }
  .who img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; object-position: top; border: 1px solid var(--line-2); margin-left: -6px; background: #000; }
  .who img.no { filter: grayscale(1) brightness(.55); }
  .who img:first-child { margin-left: 0; }
  .tagrow { display: flex; gap: 5px; align-items: center; }
  .tag { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 5px; letter-spacing: .5px; }
  .tag.upg { color: #0c2a17; background: var(--good); }
  .tag.own { color: var(--text); background: rgba(255,255,255,.14); }

  /* ---------- detail panel ---------- */
  #detail { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 22px; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--gold-d) rgba(0,0,0,.35); }
  .d-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--dim); gap: 10px; font-style: italic; }
  .d-empty svg { width: 64px; height: 64px; color: var(--gold); opacity: .6; }
  .d-head { display: flex; gap: 14px; align-items: center; }
  .d-head .ico { width: 76px; height: 76px; border-radius: 16px; flex: none; }
  .d-head .ico svg { width: 42px; height: 42px; }
  .d-head h2 { margin: 0; font: 700 22px/1.15 var(--serif); color: var(--rc); text-shadow: 0 0 14px color-mix(in srgb, var(--rc) 45%, transparent); }
  .d-head .kind { font-size: 12px; color: var(--dim); margin-top: 3px; text-transform: capitalize; letter-spacing: .5px; }
  .d-desc { margin: 12px 0 8px; font-size: 13px; line-height: 1.5; color: #d9d3c1; font-style: italic; }
  .d-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; margin: 10px 0 14px; }
  .d-stat { padding: 6px 8px; border-radius: 9px; background: rgba(0,0,0,.35); border: 1px solid var(--line); text-align: center; }
  .d-stat b { display: block; font-size: 17px; color: var(--good); }
  .d-stat span { font-size: 10px; letter-spacing: 1px; color: var(--dim); }
  .buyrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .btn { padding: 10px 18px; border-radius: 11px; border: 1px solid var(--gold-l); cursor: pointer; font-weight: 900; font-size: 13.5px; letter-spacing: .3px; color: #2a1d05;
    background: linear-gradient(180deg, #f6dc8a, #c3922f); box-shadow: 0 3px 0 #6e4d10, 0 6px 14px rgba(0,0,0,.4); transition: .08s; white-space: nowrap; }
  .btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #6e4d10; }
  .btn.ghost { color: var(--text); background: rgba(255,255,255,.07); border-color: var(--line-2); box-shadow: none; }
  .btn.sm { padding: 7px 12px; font-size: 12px; }
  .btn:disabled { cursor: not-allowed; color: var(--dim); background: rgba(255,255,255,.07); border-color: var(--line); box-shadow: none; }
  .need { font-size: 12px; color: var(--bad); }
  .owned { font-size: 12px; color: var(--dim); }

  .sec { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .sec h3 { margin: 0; font: 700 13px var(--serif); letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { padding: 4px 10px; font-size: 11px; font-weight: 700; color: var(--dim); background: transparent; border: 0; cursor: pointer; }
  .seg button.on { color: #2a1d05; background: var(--gold); }

  .hero { display: grid; grid-template-columns: 54px 1fr; gap: 12px; padding: 10px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--line); background: var(--panel-2); }
  .hero.cant { opacity: .5; }
  .hero img { width: 54px; height: 66px; border-radius: 9px; object-fit: cover; object-position: top; border: 1px solid var(--line-2); background: #000; }
  .hero .hn { font-weight: 800; font-size: 14px; }
  .hero .hn small { font-weight: 600; color: var(--dim); font-size: 11px; margin-left: 4px; }
  .hero .cur { font-size: 11px; color: var(--dim); margin: 2px 0 6px; }
  .hero .cur em { color: var(--text); font-style: normal; }
  .hero .no { font-size: 12px; color: var(--bad); }
  .delta { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .dl { font-size: 11.5px; padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
  .dl i { font-style: normal; color: var(--dim); }
  .dl.up { border-color: rgba(111,227,154,.4); } .dl.up b { color: var(--good); }
  .dl.down { border-color: rgba(255,123,123,.4); } .dl.down b { color: var(--bad); }
  .nochange { font-size: 11.5px; color: var(--dim); margin-bottom: 8px; }
  .hint { font-size: 11.5px; color: var(--dim); margin-top: 4px; line-height: 1.4; }

  /* toast */
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 20; max-width: 90vw;
    padding: 11px 20px; border-radius: 12px; font-weight: 700; font-size: 13.5px; color: var(--text); background: rgba(14, 11, 24, .96); border: 1px solid var(--line-2); box-shadow: 0 10px 30px rgba(0,0,0,.6); transition: .22s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { border-color: rgba(255,123,123,.6); color: #ffd0d0; }
  #toast.ok { border-color: rgba(111,227,154,.6); }

  @media (max-width: 880px) {
    html, body { overflow: auto; height: auto; }
    #main { grid-template-columns: 1fr; padding: 12px; }
    .col { max-height: none; } #list { max-height: 55vh; } #detail { overflow: visible; }
    #top { padding: 10px 14px; } .brand h1 { font-size: 20px; } .brand .sub { display: none; }
  }
</style>
</head>
<body>
<div id="top">
  <div class="brand">
    <svg class="crest" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 3l17 6v13c0 11-7 19-17 23C14 41 7 33 7 22V9z"/><path d="M24 13l3.5 7 7.5 1-5.5 5 1.5 7.5-7-4-7 4 1.5-7.5-5.5-5 7.5-1z" fill="currentColor" fill-opacity=".25"/></svg>
    <div><h1>The Armory</h1><div class="sub">Steel, leather and a few things you'll hope you never need.</div></div>
  </div>
  <div class="right">
    <span class="purse"><span class="coin">$</span><span id="money">--</span></span>
    <a class="back" href="/">&larr; Back to Colosseum</a>
  </div>
</div>

<div id="main">
  <div class="col" id="left">
    <div id="tabs"></div>
    <div id="ctl">
      <input id="q" type="search" placeholder="Search..." autocomplete="off" />
      <select id="sort-select">
        <option value="rarity">Rarity</option>
        <option value="type">Item type</option>
        <option value="plow">Price: low to high</option>
        <option value="phigh">Price: high to low</option>
      </select>
    </div>
    <div id="note"></div>
    <div id="list"></div>
  </div>
  <div class="col"><div id="detail"></div></div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  // ---- Sound: fire-and-forget SFX + a single looping hub music track. ----
  var SFX_VOLUME = 0.7, MUSIC_VOLUME = 0.35;
  function playSfx(url, vol) {
    if (!url) return;
    try { var a = new Audio(url); a.volume = vol != null ? vol : SFX_VOLUME; a.play()["catch"](function () {}); } catch (e) { /* best-effort */ }
  }
  var _musicEl = null, _musicUrl = null;
  function playMusic(url, vol) {
    if (_musicUrl === url && _musicEl && !_musicEl.paused) return;
    stopMusic();
    try { _musicEl = new Audio(url); _musicEl.loop = true; _musicEl.volume = vol != null ? vol : MUSIC_VOLUME; _musicUrl = url; _musicEl.play()["catch"](function () {}); } catch (e) { /* best-effort */ }
  }
  function stopMusic() { if (_musicEl) { try { _musicEl.pause(); } catch (e) {} } _musicEl = null; _musicUrl = null; }
  var SFX = {
    hover: "/assets/SFX/10_UI_Menu_SFX/001_Hover_01.wav",
    denied: "/assets/SFX/10_UI_Menu_SFX/033_Denied_03.wav",
    buySell: "/assets/SFX/10_UI_Menu_SFX/079_Buy_sell_01.wav",
  };
  playMusic("/assets/Music/Main/Main.mp3");
  var _lastHoverEl = null, HOVER_SEL = "button, .tab, .card";
  document.addEventListener("mouseover", function (ev) {
    var el = ev.target.closest && ev.target.closest(HOVER_SEL);
    if (el && el !== _lastHoverEl && !el.disabled) { _lastHoverEl = el; playSfx(SFX.hover, 0.4); }
  });
  document.addEventListener("mouseout", function (ev) {
    var el = ev.target.closest && ev.target.closest(HOVER_SEL);
    if (el && el === _lastHoverEl) _lastHoverEl = null;
  });

  // ---- data ----
  var RARITY_ORDER = ["common", "rare", "epic", "legendary", "mythic"];
  var STAT_LABEL = { max_hp: "HP", max_mp: "MP", atk: "ATK", def_: "DEF", mag: "MAG", res: "RES", spd: "SPD", luk: "LUK" };
  var STAT_ORDER = ["max_hp", "max_mp", "atk", "def_", "mag", "res", "spd", "luk"];
  var ICON = {
    items: '<path d="M9 3h6M10 3v5l-4.2 9.2A3 3 0 008.5 21h7a3 3 0 002.7-3.8L14 8V3"/><path d="M8.2 14h7.6"/>',
    weapon: '<path d="M14.5 4.5l5.5-1-1 5.5-9.5 9.5-4.5-4.5z"/><path d="M5.5 14.5l4 4M4 20l2.5-2.5"/>',
    offhand: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M12 7v10"/>',
    armor: '<path d="M8 3L3 6l2 4 3-1v12h8V9l3 1 2-4-5-3-2 2h-4z"/>',
    helmet: '<path d="M4 15a8 8 0 0116 0v5h-4v-3H8v3H4z"/><path d="M12 7v5"/>',
    boots: '<path d="M8 3h6v8l6 3v5H5v-5l3-1z"/><path d="M5 17h15"/>',
    accessory: '<circle cx="12" cy="15" r="5.2"/><path d="M9 6.5L12 3l3 3.5-3 3z"/>',
  };
  function svg(key, cls) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "1.7"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    if (cls) s.setAttribute("class", cls);
    s.innerHTML = ICON[key] || ICON.accessory; return s;
  }
  var TABS = [
    { key: "items", label: "Items" }, { key: "weapon", label: "Weapons" }, { key: "offhand", label: "Off-Hand" },
    { key: "armor", label: "Armor" }, { key: "helmet", label: "Helmets" }, { key: "boots", label: "Boots" }, { key: "accessory", label: "Accessories" },
  ];
  var data = null, tab = "items", sortMode = "rarity", query = "", selId = null, partyMode = null;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function rcol(r) { return "var(--r-" + (r || "common") + ")"; }
  function coin(cls) { return el("span", "coin" + (cls ? " " + cls : ""), "$"); }

  var _toastT = null;
  function toast(msg, ok) {
    var t = document.getElementById("toast"); if (!msg) return;
    t.textContent = msg; t.className = "show " + (ok === false ? "bad" : "ok");
    clearTimeout(_toastT); _toastT = setTimeout(function () { t.className = ""; }, 3400);
  }

  // Which party the previews show: Colosseum fighters at the Colosseum, the story heroes anywhere else (read from where the 3D hub was left).
  function defaultPartyMode() {
    var scene = ""; try { scene = (JSON.parse(sessionStorage.getItem("h3dPos") || "{}") || {}).scene || ""; } catch (e) {}
    var colo = (data.party_colosseum || []).length, story = (data.party_story || []).length;
    if (scene && scene !== "olympus" && story) return "story";
    return colo ? "colosseum" : (story ? "story" : "colosseum");
  }
  function party() { return (partyMode === "story" ? data.party_story : data.party_colosseum) || []; }

  function sortEquipment(list) {
    var s = list.slice();
    var ri = function (x) { return RARITY_ORDER.indexOf(x.rarity); };
    if (sortMode === "type") s.sort(function (a, b) { var ta = a.subtype || a.slot, tb = b.subtype || b.slot; return ta !== tb ? (ta < tb ? -1 : 1) : ri(a) - ri(b) || a.cost - b.cost; });
    else if (sortMode === "plow") s.sort(function (a, b) { return a.cost - b.cost; });
    else if (sortMode === "phigh") s.sort(function (a, b) { return b.cost - a.cost; });
    else s.sort(function (a, b) { return ri(a) - ri(b) || a.cost - b.cost; });
    return s;
  }
  function visibleList() {
    var q = query.trim().toLowerCase();
    var base = tab === "items" ? data.items.slice() : sortEquipment(data.equipment.filter(function (e) { return e.slot === tab; }));
    if (tab === "items") {
      if (sortMode === "plow") base.sort(function (a, b) { return a.cost - b.cost; });
      else if (sortMode === "phigh") base.sort(function (a, b) { return b.cost - a.cost; });
    }
    if (q) base = base.filter(function (x) { return (x.name + " " + (x.subtype || "") + " " + (x.rarity || "") + " " + (x.description || "")).toLowerCase().indexOf(q) >= 0; });
    return base;
  }
  function find(id) { var all = tab === "items" ? data.items : data.equipment; for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i]; return null; }

  // net "worth" of a delta: used only to flag an upgrade
  function netGain(d) { var n = 0; for (var k in d) n += d[k]; return n; }
  function fitsFor(e) { var out = []; party().forEach(function (h) { var f = e.fits && e.fits[h.id]; if (f) out.push({ hero: h, fit: f }); }); return out; }

  function renderTabs() {
    var box = document.getElementById("tabs"); box.innerHTML = "";
    TABS.forEach(function (t) {
      var b = el("div", "tab" + (t.key === tab ? " active" : "")); b.appendChild(svg(t.key)); b.appendChild(document.createTextNode(t.label));
      b.onclick = function () { tab = t.key; selId = null; render(false); };
      box.appendChild(b);
    });
  }

  function card(x, isItem) {
    var c = el("div", "card" + (x.id === selId ? " sel" : "")); c.dataset.id = x.id;
    c.style.setProperty("--rc", isItem ? "var(--r-common)" : rcol(x.rarity));
    var ic = el("div", "ico"); ic.appendChild(svg(isItem ? "items" : x.slot)); c.appendChild(ic);
    var mid = el("div"); mid.style.minWidth = 0;
    mid.appendChild(el("div", "nm", x.name));
    if (isItem) {
      mid.appendChild(el("div", "meta", x.heal_hp ? "Restores " + x.heal_hp + " HP" : x.heal_mp ? "Restores " + x.heal_mp + " MP" : x.revive ? "Revives an ally" : "Consumable"));
    } else {
      mid.appendChild(el("div", "meta", x.rarity + (x.subtype ? " " + x.subtype : "")));
      var chips = el("div", "chips");
      STAT_ORDER.forEach(function (k) { if (x.bonuses && x.bonuses[k]) chips.appendChild(el("span", "chip up", "+" + x.bonuses[k] + " " + STAT_LABEL[k])); });
      if (!chips.children.length) chips.appendChild(el("span", "chip flat", "no bonus"));
      mid.appendChild(chips);
    }
    c.appendChild(mid);
    var side = el("div", "side");
    var pr = el("div", "price" + (data.money < x.cost ? " poor" : "")); pr.appendChild(coin()); pr.appendChild(document.createTextNode(x.cost)); side.appendChild(pr);
    var row = el("div", "tagrow");
    if (!isItem) {
      var fits = fitsFor(x);
      if (fits.length) {
        var who = el("div", "who");
        fits.forEach(function (f) { var im = el("img", f.fit.can ? "" : "no"); im.src = f.hero.portrait; im.alt = f.hero.name; im.title = f.hero.name + (f.fit.can ? "" : " can't equip this"); im.onerror = function () { im.style.visibility = "hidden"; }; who.appendChild(im); });
        row.appendChild(who);
      }
      if (fits.some(function (f) { return f.fit.can && f.fit.delta && netGain(f.fit.delta) > 0; })) row.appendChild(el("span", "tag upg", "UPGRADE"));
    }
    if (x.owned) row.appendChild(el("span", "tag own", "x" + x.owned));
    if (row.children.length) side.appendChild(row);
    c.appendChild(side);
    c.onclick = function () { selId = x.id; playSfx(SFX.hover, 0.3); markSelected(); renderDetail(false); };
    return c;
  }

  function markSelected() {
    var cards = document.querySelectorAll("#list .card");
    for (var i = 0; i < cards.length; i++) cards[i].classList.toggle("sel", cards[i].dataset.id === selId);
  }

  function renderList(keepScroll) {
    var list = document.getElementById("list"), top = list.scrollTop; list.innerHTML = "";
    document.getElementById("note").textContent = tab === "items" ? "Consumables are used in battle and from the field menu." : "Pick a piece to see what it does for each of your fighters.";
    var shown = visibleList();
    if (!shown.length) list.appendChild(el("div", "empty", query ? "Nothing matches your search." : "Nothing for sale here."));
    shown.forEach(function (x) { list.appendChild(card(x, tab === "items")); });
    list.style.scrollBehavior = "auto"; list.scrollTop = keepScroll ? top : 0; list.style.scrollBehavior = "";
    if (!selId || !shown.some(function (x) { return x.id === selId; })) { selId = shown.length ? shown[0].id : null; markSelected(); }
  }

  function renderDetail(keepScroll) {
    var d = document.getElementById("detail"), keep = d.scrollTop; d.innerHTML = "";
    var x = selId ? find(selId) : null;
    if (!x) { var em = el("div", "d-empty"); em.appendChild(svg("weapon")); em.appendChild(el("div", null, "Choose something from the shelves.")); d.appendChild(em); return; }
    var isItem = tab === "items";
    var head = el("div", "d-head"); head.style.setProperty("--rc", isItem ? "var(--r-common)" : rcol(x.rarity));
    var ic = el("div", "ico"); ic.appendChild(svg(isItem ? "items" : x.slot)); head.appendChild(ic);
    var tx = el("div"); tx.appendChild(el("h2", null, x.name));
    tx.appendChild(el("div", "kind", isItem ? "Consumable" : x.rarity + (x.subtype ? " " + x.subtype : "") + " | " + x.slot));
    head.appendChild(tx); d.appendChild(head);
    if (x.description) d.appendChild(el("div", "d-desc", x.description));

    if (!isItem) {
      var grid = el("div", "d-stats"), any = false;
      STAT_ORDER.forEach(function (k) { if (x.bonuses && x.bonuses[k]) { any = true; var s = el("div", "d-stat"); s.appendChild(el("b", null, "+" + x.bonuses[k])); s.appendChild(el("span", null, STAT_LABEL[k])); grid.appendChild(s); } });
      if (any) d.appendChild(grid);
    } else if (x.heal_hp || x.heal_mp || x.revive) {
      var g2 = el("div", "d-stats");
      if (x.heal_hp) { var a = el("div", "d-stat"); a.appendChild(el("b", null, "+" + x.heal_hp)); a.appendChild(el("span", null, "HP")); g2.appendChild(a); }
      if (x.heal_mp) { var b = el("div", "d-stat"); b.appendChild(el("b", null, "+" + x.heal_mp)); b.appendChild(el("span", null, "MP")); g2.appendChild(b); }
      if (x.revive) { var r = el("div", "d-stat"); r.appendChild(el("b", null, "KO")); r.appendChild(el("span", null, "REVIVES")); g2.appendChild(r); }
      d.appendChild(g2);
    }

    var buyrow = el("div", "buyrow"), poor = data.money < x.cost;
    var bb = el("button", "btn" + (isItem ? "" : " ghost"), isItem ? "Buy - " + x.cost : "Buy to stash - " + x.cost);
    bb.disabled = poor;
    bb.onclick = function () { isItem ? buy("/api/shop/buy_item", { item_id: x.id }) : buy("/api/shop/buy_equipment", { equipment_id: x.id }); };
    buyrow.appendChild(bb);
    buyrow.appendChild(el("span", "owned", isItem ? "You have " + x.owned : "In stash: " + x.owned));
    if (poor) buyrow.appendChild(el("span", "need", "Need " + (x.cost - data.money) + " more"));
    d.appendChild(buyrow);

    if (!isItem) {
      var sec = el("div", "sec"); sec.appendChild(el("h3", null, "Your party"));
      if ((data.party_colosseum || []).length && (data.party_story || []).length) {
        var seg = el("div", "seg");
        [["colosseum", "Colosseum"], ["story", "Story"]].forEach(function (p) {
          var bt = el("button", partyMode === p[0] ? "on" : "", p[1]);
          bt.onclick = function () { partyMode = p[0]; render(true); }; seg.appendChild(bt);
        });
        sec.appendChild(seg);
      }
      d.appendChild(sec);
      var hs = party();
      if (!hs.length) d.appendChild(el("div", "hint", "No one in this party yet."));
      hs.forEach(function (h) {
        var f = x.fits && x.fits[h.id]; if (!f) return;
        var box = el("div", "hero" + (f.can ? "" : " cant"));
        var im = el("img"); im.src = h.portrait; im.alt = h.name; im.onerror = function () { im.style.visibility = "hidden"; }; box.appendChild(im);
        var rt = el("div");
        var hn = el("div", "hn", h.name); hn.appendChild(el("small", null, h.class_name + " | Lv " + h.level)); rt.appendChild(hn);
        var cur = el("div", "cur"); cur.appendChild(document.createTextNode("Wearing: "));
        cur.appendChild(el("em", null, f.current ? f.current.name + " (" + f.current.bonus_text + ")" : "nothing in this slot")); rt.appendChild(cur);
        if (!f.can) {
          rt.appendChild(el("div", "no", "Cannot equip this (" + h.class_name + ")."));
        } else {
          var dl = el("div", "delta"), n = 0;
          STAT_ORDER.forEach(function (k) {
            var v = f.delta && f.delta[k]; if (!v) return; n++;
            var from = h.stats[k], c = el("span", "dl " + (v > 0 ? "up" : "down"));
            c.appendChild(el("i", null, STAT_LABEL[k] + " " + from + " > ")); c.appendChild(el("b", null, (from + v) + " (" + (v > 0 ? "+" : "") + v + ")")); dl.appendChild(c);
          });
          if (!n) rt.appendChild(el("div", "nochange", "No change to their stats."));
          else rt.appendChild(dl);
          var be = el("button", "btn sm", "Buy & Equip - " + x.cost);
          be.disabled = poor;
          be.onclick = function () { buy("/api/shop/buy_equip", { equipment_id: x.id, character_id: h.id }); };
          rt.appendChild(be);
        }
        box.appendChild(rt); d.appendChild(box);
      });
      d.appendChild(el("div", "hint", "Buy & Equip puts it straight on that hero; whatever they wore in that slot goes to your stash. Nothing is spent if they can't wear it."));
    }
    d.scrollTop = keepScroll ? keep : 0;
  }

  function render(keepScroll) {
    document.getElementById("money").textContent = data.money;
    if (!partyMode) partyMode = defaultPartyMode();
    renderTabs();
    document.getElementById("sort-select").value = sortMode;
    renderList(keepScroll); renderDetail(keepScroll);
  }

  function buy(url, body) {
    fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        playSfx(res.ok === false ? SFX.denied : SFX.buySell);
        toast(res.message, res.ok !== false);
        if (res.items) { data = res; render(true); }
      })
      .catch(function () { playSfx(SFX.denied); toast("Could not reach the hub server.", false); });
  }

  document.getElementById("sort-select").addEventListener("change", function (ev) { sortMode = ev.target.value; renderList(false); });
  document.getElementById("q").addEventListener("input", function (ev) { query = ev.target.value; renderList(false); renderDetail(false); });
  document.addEventListener("keydown", function (ev) {
    if (!data || ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return;
    if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
    var list = visibleList(); if (!list.length) return;
    var i = list.findIndex(function (x) { return x.id === selId; });
    i = Math.max(0, Math.min(list.length - 1, i + (ev.key === "ArrowDown" ? 1 : -1)));
    selId = list[i].id; markSelected(); renderDetail(false);
    var c = document.querySelector('#list .card[data-id="' + selId + '"]'); if (c && c.scrollIntoView) c.scrollIntoView({ block: "nearest" });
    ev.preventDefault();
  });

  fetch("/api/shop").then(function (r) { return r.json(); })
    .then(function (d) { data = d; render(false); })
    .catch(function () { toast("Could not reach the hub server.", false); });
})();
</script>
</body>
</html>
