<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shop</title>
<style>
  :root {
    --gold: #e8c766;
    --panel-bg: rgba(18, 16, 28, 0.85);
    --panel-border: rgba(232, 199, 102, 0.35);
    --text: #f1ecdd;
    --dim: #b9b2a0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh; width: 100%;
    font-family: "Segoe UI", Verdana, sans-serif; color: var(--text);
    background: #0e0c14 radial-gradient(1200px 600px at 50% -10%, #241c3d 0%, #0e0c14 60%);
  }
  a { color: var(--gold); text-decoration: none; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px; border-bottom: 1px solid var(--panel-border);
  }
  #topbar h1 { margin: 0; font-size: 22px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; background: var(--panel-bg);
    border: 1px solid var(--panel-border); border-radius: 999px; padding: 6px 14px; font-weight: 700;
  }
  .pill .ico { width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #241a05;
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  #status { text-align: center; color: var(--dim); font-size: 13px; padding: 8px; min-height: 22px; }
  #tabs { display: flex; gap: 8px; padding: 0 22px 12px 22px; flex-wrap: wrap; }
  .tab {
    padding: 8px 18px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600;
    background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--dim);
  }
  .tab.active { background: linear-gradient(180deg, #e8c766, #b8892c); color: #241a05; border-color: #fff3c8; }
  #sort-bar { display: flex; align-items: center; gap: 8px; padding: 0 22px 12px 22px; font-size: 12px; color: var(--dim); }
  #sort-bar select {
    padding: 6px 10px; border-radius: 8px; background: var(--panel-bg); color: var(--text);
    border: 1px solid var(--panel-border); font-size: 12px;
  }
  #list { padding: 0 22px 40px 22px; display: flex; flex-direction: column; gap: 8px; max-width: 820px; margin: 0 auto; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 12px 16px;
  }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-weight: 700; font-size: 15px; }
  .row .desc { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .row .owned { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .buy {
    padding: 9px 16px; border-radius: 10px; border: 1px solid var(--panel-border); cursor: pointer;
    background: linear-gradient(180deg, #e8c766, #b8892c); color: #241a05; font-weight: 800; font-size: 13px; white-space: nowrap;
  }
  .buy:disabled { background: rgba(255,255,255,0.08); color: var(--dim); cursor: not-allowed; }
  .note { text-align: center; color: var(--dim); font-size: 12px; padding: 4px 22px 16px 22px; }
</style>
</head>
<body>
<div id="topbar">
  <h1>Shop</h1>
  <div style="display:flex;gap:16px;align-items:center;">
    <span class="pill"><span class="ico">$</span><span id="money">--</span></span>
    <a href="/">&larr; Back to Colosseum</a>
  </div>
</div>
<div id="status"></div>
<div id="tabs"></div>
<div id="sort-bar">
  <label for="sort-select">Sort by</label>
  <select id="sort-select">
    <option value="rarity">Rarity</option>
    <option value="type">Item type</option>
  </select>
</div>
<div class="note" id="note"></div>
<div id="list"></div>

<script>
(function () {
  "use strict";

  // ---- Sound: fire-and-forget SFX + a single looping hub music track. ----
  var SFX_VOLUME = 0.7, MUSIC_VOLUME = 0.35;
  function playSfx(url, vol) {
    if (!url) return;
    try {
      var a = new Audio(url);
      a.volume = vol != null ? vol : SFX_VOLUME;
      a.play()["catch"](function () {});
    } catch (e) { /* best-effort */ }
  }
  var _musicEl = null, _musicUrl = null;
  function playMusic(url, vol) {
    if (_musicUrl === url && _musicEl && !_musicEl.paused) return;
    stopMusic();
    try {
      _musicEl = new Audio(url);
      _musicEl.loop = true;
      _musicEl.volume = vol != null ? vol : MUSIC_VOLUME;
      _musicUrl = url;
      _musicEl.play()["catch"](function () {});
    } catch (e) { /* best-effort */ }
  }
  function stopMusic() {
    if (_musicEl) { try { _musicEl.pause(); } catch (e) {} }
    _musicEl = null; _musicUrl = null;
  }
  var SFX = {
    hover: "/assets/SFX/10_UI_Menu_SFX/001_Hover_01.wav",
    denied: "/assets/SFX/10_UI_Menu_SFX/033_Denied_03.wav",
    buySell: "/assets/SFX/10_UI_Menu_SFX/079_Buy_sell_01.wav",
  };
  playMusic("/assets/Music/Main/Main.mp3");
  var _lastHoverEl = null;
  var HOVER_SEL = "button, .tab, .row";
  document.addEventListener("mouseover", function (ev) {
    var el = ev.target.closest(HOVER_SEL);
    if (el && el !== _lastHoverEl && !el.disabled) { _lastHoverEl = el; playSfx(SFX.hover, 0.5); }
  });
  document.addEventListener("mouseout", function (ev) {
    var el = ev.target.closest(HOVER_SEL);
    if (el && el === _lastHoverEl) _lastHoverEl = null;
  });

  var RARITY_COLOR = { common: "#bebec3", rare: "#5aaae6", epic: "#b96ee6", legendary: "#ebaf3c", mythic: "#e63c5a" };
  var TABS = [
    { key: "items", label: "Items" },
    { key: "weapon", label: "Weapons" },
    { key: "offhand", label: "Off-Hand" },
    { key: "armor", label: "Armor" },
    { key: "helmet", label: "Helmets" },
    { key: "boots", label: "Boots" },
    { key: "accessory", label: "Accessories" },
  ];
  var RARITY_ORDER = ["common", "rare", "epic", "legendary", "mythic"];
  var data = null, tab = "items", sortMode = "rarity";

  function setStatus(m) { document.getElementById("status").textContent = m || ""; }

  function sortEquipment(list) {
    var sorted = list.slice();
    if (sortMode === "type") {
      sorted.sort(function (a, b) {
        var ta = a.subtype || a.slot, tb = b.subtype || b.slot;
        if (ta !== tb) return ta < tb ? -1 : 1;
        return RARITY_ORDER.indexOf(a.rarity) - RARITY_ORDER.indexOf(b.rarity);
      });
    } else {
      sorted.sort(function (a, b) {
        var ra = RARITY_ORDER.indexOf(a.rarity), rb = RARITY_ORDER.indexOf(b.rarity);
        if (ra !== rb) return ra - rb;
        return a.cost - b.cost;
      });
    }
    return sorted;
  }

  function renderTabs() {
    var el = document.getElementById("tabs");
    el.innerHTML = "";
    TABS.forEach(function (t) {
      var b = document.createElement("div");
      b.className = "tab" + (t.key === tab ? " active" : "");
      b.textContent = t.label;
      b.onclick = function () { tab = t.key; render(); };
      el.appendChild(b);
    });
  }

  function row(name, color, desc, owned, cost, onBuy) {
    var r = document.createElement("div");
    r.className = "row";
    var info = document.createElement("div");
    info.className = "info";
    info.innerHTML = '<div class="name"></div><div class="desc"></div><div class="owned"></div>';
    info.querySelector(".name").textContent = name;
    if (color) info.querySelector(".name").style.color = color;
    info.querySelector(".desc").textContent = desc;
    info.querySelector(".owned").textContent = owned;
    var b = document.createElement("button");
    b.className = "buy";
    b.textContent = "Buy - " + cost;
    b.disabled = data.money < cost;
    b.onclick = onBuy;
    r.appendChild(info); r.appendChild(b);
    return r;
  }

  function render() {
    document.getElementById("money").textContent = data.money;
    renderTabs();
    document.getElementById("sort-bar").style.display = tab === "items" ? "none" : "flex";
    document.getElementById("sort-select").value = sortMode;
    var list = document.getElementById("list");
    list.innerHTML = "";
    var note = document.getElementById("note");
    if (tab === "items") {
      note.textContent = "Consumables are used in battle.";
      data.items.forEach(function (it) {
        list.appendChild(row(it.name, null, it.description, "Owned: " + it.owned, it.cost,
          function () { buy("/api/shop/buy_item", { item_id: it.id }); }));
      });
    } else {
      note.textContent = "Bought gear goes to your stash - equip it from the Heroes page.";
      var shown = sortEquipment(data.equipment.filter(function (e) { return e.slot === tab; }));
      if (!shown.length) list.innerHTML = '<div class="note">Nothing for sale here.</div>';
      shown.forEach(function (e) {
        list.appendChild(row(e.name, RARITY_COLOR[e.rarity], e.bonus_text + (e.description ? " - " + e.description : ""),
          e.rarity + (e.subtype ? " " + e.subtype : "") + " | In stash: " + e.owned, e.cost,
          function () { buy("/api/shop/buy_equipment", { equipment_id: e.id }); }));
      });
    }
  }

  function buy(url, body) {
    playSfx(SFX.buySell);
    fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) { data = res; setStatus(res.message); render(); })
      .catch(function () { playSfx(SFX.denied); setStatus("Could not reach the hub server."); });
  }

  document.getElementById("sort-select").addEventListener("change", function (ev) {
    sortMode = ev.target.value; render();
  });

  fetch("/api/shop").then(function (r) { return r.json(); })
    .then(function (d) { data = d; render(); })
    .catch(function () { setStatus("Could not reach the hub server."); });
})();
</script>
</body>
</html>
