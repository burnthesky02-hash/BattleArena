<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skyborne Saga</title>
<style>
  :root { --gold: #e8c766; --gold-hi: #fff2c4; --gold-lo: #b8892c; --ink: #07060d; --dim: #b9b2d0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff;
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; user-select: none; -webkit-user-select: none; }

  /* ---- the looping key-art video: a blurred, dimmed copy fills the screen, the sharp square sits in the middle with feathered sides ---- */
  .vid { position: absolute; object-fit: cover; pointer-events: none; }
  #vid-bg { inset: -4%; width: 108%; height: 108%; filter: blur(34px) brightness(.55) saturate(1.2); }
  #vid-main { top: 50%; left: 50%; height: 100vh; width: 100vh; transform: translate(-50%, -50%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%); }
  #shade { position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(5,4,12,.82) 0%, rgba(5,4,12,.55) 26%, rgba(5,4,12,0) 52%),
      radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 52%, rgba(3,2,8,.72) 100%); }

  /* ---- title + menu column ---- */
  #col { position: absolute; left: 7vw; top: 0; bottom: 0; width: min(520px, 86vw); display: flex; flex-direction: column; justify-content: center; }
  #logo { margin: 0; line-height: .95; text-transform: uppercase; font-weight: 800; letter-spacing: .06em;
    font-size: clamp(36px, 6.2vh + 1.5vw, 86px); opacity: 0; transform: translateY(14px); animation: rise 1.6s .5s cubic-bezier(.2,.7,.2,1) forwards; }
  #logo span { display: block; background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 42%, var(--gold-lo) 58%, #f3d98a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 0 #3b2606) drop-shadow(0 0 22px rgba(255,205,110,.45)); }
  #logo span + span { margin-top: .04em; letter-spacing: .1em; font-size: .86em; }
  #rule { height: 2px; width: 0; margin: 2.2vh 0 1.8vh; background: linear-gradient(90deg, var(--gold), rgba(232,199,102,0)); animation: grow 1.4s 1.3s ease-out forwards; }
  #tag { font-size: clamp(13px, 1.9vh, 19px); letter-spacing: .32em; text-transform: uppercase; color: var(--dim); opacity: 0; animation: fade 1.6s 1.7s forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } } @keyframes fade { to { opacity: 1; } } @keyframes grow { to { width: min(420px, 70vw); } }

  #press { margin-top: 7vh; font-size: clamp(14px, 2vh, 20px); letter-spacing: .3em; text-transform: uppercase; color: var(--gold-hi); opacity: 0; animation: fade 1s 2.4s forwards, blink 2.4s 3.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #press.gone { display: none; }

  #menu { margin-top: 5vh; display: none; flex-direction: column; gap: .5vh; }
  #menu.show { display: flex; animation: fade .7s forwards; opacity: 0; }
  .item { position: relative; padding: .9vh 18px .9vh 34px; font-size: clamp(20px, 3.3vh, 34px); letter-spacing: .14em; text-transform: uppercase;
    color: #d9d2ee; cursor: pointer; text-shadow: 0 2px 8px #000; transition: color .15s, transform .15s, text-shadow .15s; width: max-content; max-width: 100%; }
  .item::before { content: ""; position: absolute; left: 8px; top: 50%; width: 10px; height: 10px; margin-top: -5px; transform: rotate(45deg) scale(0);
    background: var(--gold); box-shadow: 0 0 12px var(--gold); transition: transform .15s; }
  .item.cur { color: #fff; transform: translateX(6px); text-shadow: 0 0 18px rgba(255,214,120,.65), 0 2px 8px #000; }
  .item.cur::before { transform: rotate(45deg) scale(1); }
  .item.off { color: #6d6786; cursor: default; }
  .item.off.cur { color: #8e88a6; text-shadow: 0 2px 8px #000; }
  .item small { display: block; font-size: .42em; letter-spacing: .12em; color: var(--dim); text-transform: none; margin-top: .3em; opacity: .85; }

  /* ---- slot picker / confirm ---- */
  #panel { margin-top: 4vh; display: none; flex-direction: column; gap: 10px; }
  #panel.show { display: flex; animation: fade .5s forwards; opacity: 0; }
  #panel h2 { margin: 0 0 4px; font-size: clamp(15px, 2.2vh, 22px); letter-spacing: .3em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .slot { padding: 12px 18px; border: 1px solid rgba(232,199,102,.28); border-radius: 10px; background: rgba(14,12,26,.62); backdrop-filter: blur(3px);
    cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
  .slot.cur { border-color: var(--gold); background: rgba(40,30,60,.78); transform: translateX(6px); box-shadow: 0 0 22px rgba(232,199,102,.18); }
  .slot.off { opacity: .45; cursor: default; }
  .slot b { display: block; font-size: clamp(15px, 2.2vh, 21px); letter-spacing: .06em; color: #fff; font-weight: 600; }
  .slot b em { font-style: normal; color: var(--gold); margin-right: .6em; letter-spacing: .12em; font-size: .8em; text-transform: uppercase; }
  .slot span { display: block; margin-top: 4px; font-size: clamp(12px, 1.7vh, 15px); color: var(--dim); letter-spacing: .03em; }
  .back { margin-top: 4px; font-size: clamp(12px, 1.7vh, 15px); letter-spacing: .24em; text-transform: uppercase; color: var(--dim); cursor: pointer; width: max-content; padding: 6px 4px; }
  .back:hover, .back.cur { color: var(--gold-hi); }
  #msg { margin-top: 12px; min-height: 1.4em; font-size: 14px; color: #ff9a9a; letter-spacing: .04em; }

  #hint { position: absolute; left: 7vw; bottom: 3.2vh; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: rgba(190,184,214,.55); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity 1.3s ease; z-index: 9; }
  #fade.in { opacity: 0; } #fade.out { opacity: 1; transition-duration: 1.1s; }
  @media (max-width: 760px) { #shade { background: linear-gradient(0deg, rgba(5,4,12,.85), rgba(5,4,12,.3)); } #col { left: 6vw; } #hint { display: none; } }
</style>
</head>
<body>
<video id="vid-bg" class="vid" muted loop playsinline preload="auto"></video>
<video id="vid-main" class="vid" muted loop playsinline preload="auto"></video>
<div id="shade"></div>

<div id="col">
  <h1 id="logo"><span id="t1">Skyborne</span><span id="t2">Saga</span></h1>
  <div id="rule"></div>
  <div id="tag">Rise through the sands. Mend the world.</div>
  <div id="press">Press any key</div>

  <div id="menu"></div>
  <div id="panel"></div>
  <div id="msg"></div>
</div>
<div id="hint"></div>
<div id="fade"></div>

<script>
(function () {
  "use strict";
  /* ---- edit these ---- */
  var VIDEO = "/assets/title/Subtle-cinematic-loop-The-camera-performs-a-very-s.mp4";
  var MUSIC = "/assets/Music/mp3/19. East Town.mp3";
  var TITLE_LINES = ["Skyborne", "Saga"], TAGLINE = "Rise through the sands. Mend the world.";

  document.getElementById("t1").textContent = TITLE_LINES[0];
  document.getElementById("t2").textContent = TITLE_LINES[1] || "";
  document.getElementById("tag").textContent = TAGLINE;
  document.title = TITLE_LINES.join(" ");

  var $ = function (id) { return document.getElementById(id); };
  var bg = $("vid-bg"), mainV = $("vid-main"), fade = $("fade");
  bg.src = VIDEO; mainV.src = VIDEO;
  function play() { [bg, mainV].forEach(function (v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }); }
  mainV.addEventListener("loadeddata", function () { play(); fade.classList.add("in"); });
  setTimeout(function () { fade.classList.add("in"); play(); }, 1500);          // never stay black if the video is slow / missing
  mainV.addEventListener("timeupdate", function () { if (Math.abs(bg.currentTime - mainV.currentTime) > 0.5) { try { bg.currentTime = mainV.currentTime; } catch (e) {} } });

  /* ---- progress kept in the browser (see hub3d.js): replaced wholesale when a game starts or loads ---- */
  var PROG = /^(h3dCleared|h3dCp|h3dUntracked|h3dLast|h3dSeen_.*|ba_tutorial_seen_v1)$/;
  function clearProgress() {
    try { var del = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (PROG.test(k)) del.push(k); } del.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {}
    try { ["h3dPos", "h3dFishReturn", "h3dVendor", "dbgAuto"].forEach(function (k) { sessionStorage.removeItem(k); }); } catch (e) {}
  }
  function applyProgress(blob) { clearProgress(); try { for (var k in (blob || {})) if (PROG.test(k)) localStorage.setItem(k, blob[k]); } catch (e) {} }

  /* ---- music (starts on the first key press: browsers block sound before that) ---- */
  var audio = null;
  function musicVolume() { try { var s = JSON.parse(localStorage.getItem("rpgSettings") || "{}"); return typeof s.music === "number" ? s.music : 0.35; } catch (e) { return 0.35; } }
  function startMusic() {
    try { audio = new Audio(MUSIC); audio.loop = true; audio.volume = 0; var p = audio.play(); if (p && p.catch) p.catch(function () {});
      var t = 0, vol = musicVolume(), iv = setInterval(function () { t += 0.05; if (!audio) return clearInterval(iv); audio.volume = Math.min(vol, vol * t / 2); if (t >= 2) clearInterval(iv); }, 50);
    } catch (e) {}
  }
  function stopMusic() { if (!audio) return; var a = audio, iv = setInterval(function () { a.volume = Math.max(0, a.volume - 0.04); if (a.volume <= 0.001) { a.pause(); clearInterval(iv); } }, 50); }

  /* ---- state + screens ---- */
  var info = { slots: [], current: 1, continue: null }, screen = "press", cur = 0, items = [], pendingNew = null, busy = false;
  var menuEl = $("menu"), panelEl = $("panel"), msgEl = $("msg"), hintEl = $("hint"), pressEl = $("press");

  function fmtDate(t) { try { var d = new Date(t * 1000); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } }
  var SCENES = { island: "Paradise Island", prison: "The Pit", olympus: "The Colosseum", asteroid: "Outpost Kestrel", vault: "The Shard Vault", reach: "The Shattered Reach", forest: "The Whispering Wood", dungeon: "The Hollow Cave", outside: "Outside the Colosseum", plaza: "The Plaza" };
  function slotLine(s) {
    var bits = [(s.hero || "Hero") + " &middot; Lv " + s.level];
    if (s.rank != null && s.rank !== "") bits.push("Rank " + s.rank);
    bits.push((s.gold || 0).toLocaleString() + " gold");
    if (s.heroes) bits.push(s.heroes + (s.heroes === 1 ? " hero" : " heroes"));
    return bits.join(" &middot; ");
  }
  function slotSub(s) { var where = SCENES[s.scene] || ""; return (where ? where + " &middot; " : "") + (s.saved_at ? "Saved " + fmtDate(s.saved_at) : ""); }
  function anySave() { return info.slots.some(function (s) { return s.exists; }); }
  function setMsg(t) { msgEl.textContent = t || ""; }
  function setHint(t) { hintEl.textContent = t || ""; }

  function showMenu() {
    screen = "menu"; panelEl.className = ""; panelEl.innerHTML = ""; setMsg("");
    var cs = info.continue ? info.slots[info.continue - 1] : null;
    items = [
      { id: "continue", label: "Continue", off: !cs, sub: cs ? slotLine(cs) : "", run: function () { enter("load", info.continue); } },
      { id: "new", label: "New Game", run: function () { showSlots("new"); } },
      { id: "load", label: "Load Game", off: !anySave(), run: function () { showSlots("load"); } },
      { id: "exit", label: "Exit", run: exitGame }
    ];
    cur = cs ? 0 : 1;
    renderMenu(); menuEl.className = "show"; setHint("↑↓ choose   ·   Enter select");
  }
  function renderMenu() {
    menuEl.innerHTML = "";
    items.forEach(function (it, i) {
      var d = document.createElement("div"); d.className = "item" + (it.off ? " off" : "") + (i === cur ? " cur" : "");
      d.innerHTML = it.label + (it.sub ? "<small>" + it.sub + "</small>" : "");
      d.addEventListener("mouseenter", function () { cur = i; paint(); });
      d.addEventListener("click", function () { cur = i; activate(); });
      it.el = d; menuEl.appendChild(d);
    });
  }

  function showSlots(mode) {              // mode: "new" | "load"
    screen = mode; pendingNew = null; menuEl.className = ""; setMsg("");
    items = info.slots.map(function (s) {
      var off = mode === "load" && !s.exists;
      return { slot: s.slot, s: s, off: off, run: function () {
        if (mode === "load") enter("load", s.slot);
        else if (s.exists) confirmOverwrite(s);
        else pickDifficulty(s.slot);
      } };
    });
    items.push({ back: true, run: showMenu });
    var first = items.findIndex(function (it) { return !it.off && !it.back; });
    cur = first < 0 ? items.length - 1 : (mode === "load" && info.continue ? info.continue - 1 : (mode === "new" ? Math.max(0, items.findIndex(function (it) { return it.s && !it.s.exists; })) : first));
    renderPanel(mode === "new" ? "New game: choose a slot" : "Load game");
    setHint("↑↓ choose   ·   Enter select   ·   Esc back");
  }
  function renderPanel(title) {
    panelEl.className = "show"; panelEl.innerHTML = "<h2>" + title + "</h2>";
    items.forEach(function (it, i) {
      var d = document.createElement("div");
      if (it.back) { d.className = "back" + (i === cur ? " cur" : ""); d.innerHTML = "&larr; Back"; }
      else {
        d.className = "slot" + (it.off ? " off" : "") + (i === cur ? " cur" : "");
        d.innerHTML = it.s.exists ? "<b><em>Slot " + it.slot + "</em>" + (it.s.hero || "Hero") + "</b><span>" + slotLine(it.s) + "</span><span>" + slotSub(it.s) + "</span>"
                                  : "<b><em>Slot " + it.slot + "</em>Empty</b>" + (it.s.broken ? "<span>This save could not be read.</span>" : "");
      }
      d.addEventListener("mouseenter", function () { cur = i; paint(); });
      d.addEventListener("click", function () { cur = i; activate(); });
      it.el = d; panelEl.appendChild(d);
    });
  }
  function confirmOverwrite(s) {
    screen = "confirm"; setMsg("");
    items = [{ id: "yes", label: "Overwrite Slot " + s.slot, run: function () { pickDifficulty(s.slot); } }, { id: "no", label: "Cancel", run: function () { showSlots("new"); } }];
    cur = 1; panelEl.className = "show"; panelEl.innerHTML = "<h2>Start over in Slot " + s.slot + "?</h2><div class=\"slot off\" style=\"opacity:.8\"><b>" + (s.hero || "Hero") + "</b><span>" + slotLine(s) + "</span></div><span style=\"color:#ffb0b0;font-size:14px;letter-spacing:.04em\">The existing save in this slot will be replaced.</span>";
    items.forEach(function (it, i) {
      var d = document.createElement("div"); d.className = "item" + (i === cur ? " cur" : ""); d.style.fontSize = "clamp(17px, 2.6vh, 26px)"; d.textContent = it.label;
      d.addEventListener("mouseenter", function () { cur = i; paint(); }); d.addEventListener("click", function () { cur = i; activate(); });
      it.el = d; panelEl.appendChild(d);
    });
    setHint("↑↓ choose   ·   Enter select   ·   Esc cancel");
  }

  /* ---- difficulty (New Game): Easy / Normal / Hard, changeable later from Settings while in town ---- */
  var DIFFICULTIES = [
    { id: "easy",   name: "Easy",   desc: "Enemies are half as tough. Rewards are 75%." },
    { id: "normal", name: "Normal", desc: "The game as it was meant to be played." },
    { id: "hard",   name: "Hard",   desc: "Enemies are 1.5x as tough. Rewards are 150%." }
  ];
  function pickDifficulty(slot) {
    screen = "difficulty"; setMsg("");
    items = DIFFICULTIES.map(function (d) { return { diff: d, run: function () { enter("new", slot, d.id); } }; });
    items.push({ back: true, run: function () { showSlots("new"); } });
    cur = 1; panelEl.className = "show"; panelEl.innerHTML = "<h2>Choose a difficulty</h2>";
    items.forEach(function (it, i) {
      var d = document.createElement("div");
      if (it.back) { d.className = "back" + (i === cur ? " cur" : ""); d.innerHTML = "&larr; Back"; }
      else { d.className = "slot" + (i === cur ? " cur" : ""); d.innerHTML = "<b>" + it.diff.name + "</b><span>" + it.diff.desc + "</span>"; }
      d.addEventListener("mouseenter", function () { cur = i; paint(); }); d.addEventListener("click", function () { cur = i; activate(); });
      it.el = d; panelEl.appendChild(d);
    });
    setHint("↑↓ choose   ·   Enter select   ·   Esc back   ·   You can change this later in Settings, while in town");
  }

  function paint() { items.forEach(function (it, i) { if (it.el) it.el.classList.toggle("cur", i === cur); }); }
  function move(d) {
    if (busy) return;
    var n = items.length; if (!n) return;
    for (var k = 0; k < n; k++) { cur = (cur + d + n) % n; if (!items[cur].off || screen === "menu") break; }
    paint();
  }
  function activate() {
    if (busy) return; var it = items[cur]; if (!it) return;
    if (it.off) { setMsg(screen === "menu" && it.id === "continue" ? "There is no saved game yet." : "That slot is empty."); return; }
    setMsg(""); it.run();
  }
  function back() {
    if (busy) return;
    if (screen === "new" || screen === "load") showMenu();
    else if (screen === "confirm" || screen === "difficulty") showSlots("new");
  }

  /* ---- exit: fade out, then ask the server to close the game window (same call as Esc menu > Quit Game) ---- */
  function exitGame() {
    if (busy) return; busy = true; setHint(""); setMsg("");
    stopMusic(); fade.className = "out";
    setTimeout(function () {
      fetch("/api/menu/quit", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(function () {});
      setTimeout(function () { try { window.close(); } catch (e) {} }, 600);        // opened as a plain browser tab: the server is gone, close the tab if the browser allows it
    }, 1200);
  }

  /* ---- start a game ---- */
  function enter(kind, slot, difficulty) {
    if (busy || !slot) return; busy = true; setMsg("");
    fetch("/api/title/" + kind, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slot: slot, difficulty: difficulty }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r || !r.ok) { busy = false; setMsg((r && r.message) || "Could not start that game."); return; }
        if (kind === "new") clearProgress(); else applyProgress(r.client);
        var dest = "/";
        if (kind === "load") {
          try { var last = JSON.parse((r.client || {}).h3dLast || "null"); if (last && last.scene && isFinite(last.x) && isFinite(last.z)) dest = "/?scene=" + encodeURIComponent(last.scene) + "&at=" + last.x + "," + last.z + "&fromTitle=1"; } catch (e) {}
        }
        try { sessionStorage.setItem("hubStarted", "1"); } catch (e) {}
        stopMusic(); fade.className = "out"; setHint("");
        setTimeout(function () { location.href = dest; }, 1250);
      })
      .catch(function () { busy = false; setMsg("The game server could not be reached."); });
  }

  /* ---- input ---- */
  function begin() {
    if (screen !== "press") return;
    pressEl.classList.add("gone"); startMusic(); showMenu();
  }
  document.addEventListener("keydown", function (e) {
    if (e.repeat && screen === "press") return;
    if (screen === "press") { if (!/^(Shift|Control|Alt|Meta|Tab|F\d+)$/.test(e.key)) { e.preventDefault(); begin(); } return; }
    var k = e.key;
    if (k === "ArrowDown" || k === "s" || k === "S") { e.preventDefault(); move(1); }
    else if (k === "ArrowUp" || k === "w" || k === "W") { e.preventDefault(); move(-1); }
    else if (k === "Enter" || k === " ") { e.preventDefault(); activate(); }
    else if (k === "Escape" || k === "Backspace") { e.preventDefault(); back(); }
  });
  document.addEventListener("pointerdown", function () { if (screen === "press") begin(); });

  fetch("/api/title").then(function (r) { return r.json(); }).then(function (d) { info = d; })
    .catch(function () { setMsg("The game server could not be reached."); });
})();
</script>
</body>
</html>
