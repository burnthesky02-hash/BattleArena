/* ---------------------------------------------------------------------
   Skill/effect spritesheets -- data/Artwork/Effect_NAME/30fps/Spritesheets.
   Unlike battler sheets these are NOT a fixed 6x6 grid: each effect's
   frame size is baked into its filename ("..._WxHpx.png") and the sheet's
   actual pixel dimensions divided by that gives its own cols x rows. This
   is a separate, much simpler player than SpriteView -- it plays through
   its grid once (or loops, for a held glow) as a small absolutely
   positioned layer over the stage, then removes itself.
--------------------------------------------------------------------- */
const FX_BASE = "/assets/Artwork";
function fxUrl(folder, file) { return `${FX_BASE}/${folder}/30fps/Spritesheets/${file}`; }

// cols/rows are (sheet px size / frame px size, from the filename) -- precomputed here since the
// filenames are fixed; FxPlayer re-derives them from the loaded image too, as a sanity fallback.
const FX_DEFS = {
  impact:        { folder: "Effect_Impact",        file: "Effect_Impact_1_291x301.png",       fw: 291, fh: 301, cols: 6, rows: 5 },
  bigHit:        { folder: "Effect_BigHit",        file: "Effect_BigHit_1_557x553.png",       fw: 557, fh: 553, cols: 6, rows: 5 },
  smallHit:      { folder: "Effect_SmallHit",      file: "Effect_SmallHit_1_532x528.png",     fw: 532, fh: 528, cols: 6, rows: 5 },
  charged:       { folder: "Effect_Charged",       file: "Effect_Charged_1_321x371.png",      fw: 321, fh: 371, cols: 7, rows: 6 },
  anima:         { folder: "Effect_Anima",         file: "Effect_Anima_1_437x437.png",        fw: 437, fh: 437, cols: 6, rows: 5 },
  hyperspeed:    { folder: "Effect_Hyperspeed",    file: "Effect_Hyperspeed_1_517x515.png",   fw: 517, fh: 515, cols: 6, rows: 5 },
  explosion2:    { folder: "Effect_Explosion2",    file: "Effect_Explosion2_1_355x355.png",   fw: 355, fh: 355, cols: 6, rows: 5 },
  theVortex:     { folder: "Effect_TheVortex",     file: "Effect_TheVortex_1_427x431.png",    fw: 427, fh: 431, cols: 6, rows: 5 },
  tentacles:     { folder: "Effect_Tentacles",     file: "Effect_Tentacles_1_453x337.png",    fw: 453, fh: 337, cols: 6, rows: 5 },
  eldenRing:     { folder: "Effect_EldenRing",     file: "Effect_EldenRing_1_421x425.png",    fw: 421, fh: 425, cols: 6, rows: 5 },
  puffAndStars:  { folder: "Effect_PuffAndStars",  file: "Effect_PuffAndStars_1_120x109.png", fw: 120, fh: 109, cols: 7, rows: 6 },
  constellation: { folder: "Effect_Constellation", file: "Effect_Constellation_1_299x313.png", fw: 299, fh: 313, cols: 6, rows: 5 },
};

const fxImgCache = new Map();
function loadFxImage(def) {
  const url = fxUrl(def.folder, def.file);
  if (fxImgCache.has(url)) return fxImgCache.get(url);
  const p = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
  fxImgCache.set(url, p);
  return p;
}

// Most of these sheets are already coloured art (not the grayscale Effect_Impact); the filter is a
// cheap, deliberately-not-pixel-perfect way to push a shared sheet (mainly Hyperspeed, reused as the
// generic "travelling bolt" for every element) toward each element's colour, plus a matching glow.
const FX_TINTS = {
  fire:     "hue-rotate(-25deg) saturate(2.2) brightness(1.15) drop-shadow(0 0 10px #ff6a2acc)",
  ice:      "hue-rotate(140deg) saturate(1.5) brightness(1.15) drop-shadow(0 0 10px #7fe0ffcc)",
  thunder:  "hue-rotate(50deg) saturate(2.2) brightness(1.3) drop-shadow(0 0 10px #ffe27acc)",
  holy:     "grayscale(0.5) sepia(0.6) saturate(2.4) brightness(1.5) drop-shadow(0 0 12px #fff6c8cc)",
  dark:     "hue-rotate(220deg) saturate(2.2) brightness(0.75) drop-shadow(0 0 10px #7a3affcc)",
  neutral:  "saturate(0.7) brightness(1.05) drop-shadow(0 0 6px #ffffffaa)",
};

class FxPlayer {
  /* x/y are stage-space coordinates (same space as SpriteView.x/y) that the effect is centred on. */
  constructor(defKey, x, y, opts) {
    opts = opts || {};
    this.def = FX_DEFS[defKey];
    this.fps = opts.fps || 24;
    this.loop = !!opts.loop;
    this.size = opts.size || 150;
    this.done = false;
    this.el = document.createElement("div");
    this.el.style.position = "absolute";
    this.el.style.pointerEvents = "none";
    this.el.style.zIndex = String(opts.z || 350);
    this.el.style.transform = "translate(-50%, -50%)";
    this.el.style.imageRendering = "pixelated";
    if (opts.tint) this.el.style.filter = opts.tint;
    this.setPos(x, y);
    spriteLayer.appendChild(this.el);
    loadFxImage(this.def).then((img) => { this.img = img; if (img && !this.done) this._start(); else if (!img) this._finish(); });
  }
  setPos(x, y) { this._x = x; this._y = y; this.el.style.left = `${x}px`; this.el.style.top = `${y}px`; }
  _start() {
    const { fw, fh, cols, rows } = this.def;
    const w = this.size * (fw / fh), h = this.size;
    this.el.style.width = `${w}px`;
    this.el.style.height = `${h}px`;
    this.el.style.backgroundImage = `url(${this.img.src})`;
    this.el.style.backgroundRepeat = "no-repeat";
    this.el.style.backgroundSize = `${w * cols}px ${h * rows}px`;
    const total = cols * rows, startAt = performance.now();
    const step = (now) => {
      if (this.done) return;
      let idx = Math.floor((now - startAt) / (1000 / this.fps));
      if (idx >= total) {
        if (this.loop) idx %= total;
        else { this._finish(); return; }
      }
      const col = idx % cols, row = Math.floor(idx / cols);
      this.el.style.backgroundPosition = `-${col * w}px -${row * h}px`;
      this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);
  }
  _finish() {
    if (this.done) return;
    this.done = true;
    if (this._raf) cancelAnimationFrame(this._raf);
    this.el.remove();
    if (this._resolveDone) this._resolveDone();
  }
  stop() { this._finish(); }
  /* Resolves once the one-shot animation finishes (never, for a looping effect -- call stop() instead). */
  waitDone() {
    if (this.done) return Promise.resolve();
    if (!this._donePromise) this._donePromise = new Promise((res) => { this._resolveDone = res; });
    return this._donePromise;
  }
  /* Moves the effect's on-screen position from wherever it is to (tx,ty) over durationMs -- the
     "projectile" half of a ranged/magic attack, independent of which frame its own loop is on. */
  flyTo(tx, ty, durationMs) {
    return new Promise((resolve) => {
      const fromX = this._x, fromY = this._y, start = performance.now();
      const step = (now) => {
        if (this.done) { resolve(); return; }
        const t = Math.min(1, (now - start) / durationMs);
        this.setPos(fromX + (tx - fromX) * t, fromY + (ty - fromY) * t);
        if (t < 1) requestAnimationFrame(step);
        else resolve();
      };
      requestAnimationFrame(step);
    });
  }
}

// Per-element look for a ranged/magic attack: `travel` plays (looping) while the shot is in flight,
// `impact` plays once where it lands. "physical"/"none" (basic ranged attacks, piercing_shot,
// poison_dart -- any physical skill with no element) share a neutral steel-grey bolt.
const ELEMENT_FX = {
  physical: { travel: "hyperspeed", impact: "smallHit",   tint: "neutral" },
  none:     { travel: "hyperspeed", impact: "smallHit",   tint: "neutral" },
  fire:     { travel: "hyperspeed", impact: "explosion2", tint: "fire" },
  ice:      { travel: "hyperspeed", impact: "anima",      tint: "ice" },
  thunder:  { travel: "hyperspeed", impact: "charged",    tint: "thunder" },
  holy:     { travel: "hyperspeed", impact: "eldenRing",  tint: "holy" },
  dark:     { travel: "theVortex",  impact: "tentacles",  tint: "dark" },
};
const MELEE_IMPACT_FX = "bigHit";
const HEAL_FX = "puffAndStars";
const STATUS_FX = "constellation";

// Chest-height anchor point for a sprite, in stage-space -- SpriteView.x/y is the FEET position.
// In the 3D view the same call returns the PROJECTED screen point (DOM effects always live in screen space).
function screenPt(sprite, frac) {
  if (window.B3D && B3D.on) return B3D.screenPt(sprite, frac);
  return { x: sprite.x, y: sprite.y - SPRITE_H * sprite.hScale * frac };
}
function fxAnchor(sprite, frac) {
  return screenPt(sprite, frac === undefined ? 0.5 : frac);
}

// FX are sized as a fraction of the SPECIFIC sprite they're playing on/at, not a flat pixel guess --
// so an effect reads at the right proportion whether it's on a normal hero or a scaled-up boss.
function fxSize(sprite, frac) {
  return SPRITE_H * sprite.hScale * frac * ((window.B3D && B3D.on) ? B3D.persp(sprite) : 1);
}

async function playImpactFx(defKey, x, y, tintKey, size) {
  const fx = new FxPlayer(defKey, x, y, { tint: FX_TINTS[tintKey] || null, size: size || 150, fps: 26 });
  await fx.waitDone();
}

async function playProjectileFx(fromPt, toPt, elementCfg, boltSize, impactSize, impactSfx) {
  const fx = new FxPlayer(elementCfg.travel, fromPt.x, fromPt.y,
    { tint: FX_TINTS[elementCfg.tint], size: boltSize || 110, fps: 30, loop: true });
  await fx.flyTo(toPt.x, toPt.y, 380);
  fx.stop();
  playSfx(impactSfx);   // fire-and-forget, timed to land with the visual impact below
  await playImpactFx(elementCfg.impact, toPt.x, toPt.y, elementCfg.tint, impactSize || 170);
}

async function handleActionEvent(msg) {
  await returnDone;            // one action finishes (attacker back home) before the next begins
  combatHint = { element: msg.element || "physical", skill_kind: msg.skill_kind, crit: new Set(), weak: new Set() };
  const actor = sprites.get(msg.actor_id);
  const animKind = msg.anim_kind || (msg.is_melee ? "melee" : null);
  if (!actor || !animKind) return;   // unknown actor, or a message from an older server build

  const targetIds = (msg.target_ids && msg.target_ids.length) ? msg.target_ids
                   : (msg.target_id ? [msg.target_id] : []);
  const targets = targetIds.map((id) => sprites.get(id)).filter(Boolean);

  if (animKind !== "melee") actor.poke("cast");
  if (animKind === "melee") {
    await animateMelee(actor, targets[0] || null);
    return;
  }

  if (animKind === "status") {
    // Self buff/debuff application (warcry, iron_stance, weaken, sunder...): no run-in, no
    // projectile -- just a small sparkle on whoever's acting, once the idle pose has settled.
    actor.setPose("Idle");
    await wait(windupMs(actor, "status"));
    await playImpactFx(STATUS_FX, fxAnchor(actor).x, fxAnchor(actor).y, null, fxSize(actor, 0.55));
    return;
  }

  if (animKind === "heal") {
    actor.setPose(poseFor("heal", actor.name));
    await wait(windupMs(actor, "heal"));   // let the cast/heal pose actually reach its release flash
    const pts = targets.length ? targets.map((t) => fxAnchor(t)) : [fxAnchor(actor)];
    await Promise.all(pts.map((p, i) => playImpactFx(HEAL_FX, p.x, p.y, "holy", fxSize(targets[i] || actor, 0.8))));
    if (actor.castMode === null) actor.setPose("Idle");
    return;
  }

  if (animKind === "ranged" || animKind === "magic") {
    actor.setPose(poseFor(animKind === "ranged" ? "shoot" : "cast", actor.name));
    await wait(windupMs(actor, animKind));   // wait for the actual release-flash frame, not a guess
    const fromPt = fxAnchor(actor);
    const el = msg.element === "none" ? "physical" : (msg.element || "physical");
    const cfg = ELEMENT_FX[el] || ELEMENT_FX.physical;
    const impactSfx = animKind === "magic" ? MAGIC_IMPACT_SFX[el] : SFX.slash;
    const dests = targets.length ? targets.map((t) => fxAnchor(t)) : [fromPt];
    await Promise.all(dests.map((toPt, i) =>
      playProjectileFx(fromPt, toPt, cfg, fxSize(actor, 0.6), fxSize(targets[i] || actor, 0.9), impactSfx)));
    if (actor.castMode === null) actor.setPose("Idle");
    return;
  }
}

function fmtReward(r) { return `${r.money} gold, ${r.gems} gems, ${r.xp} XP`; }

const LV_STATS = [["max_hp", "HP"], ["max_mp", "MP"], ["atk", "ATK"], ["def_", "DEF"], ["mag", "MAG"], ["res", "RES"], ["spd", "SPD"], ["luk", "LUK"]];
let _lvTimer = null;
// Level-up screen: one card per hero that gained a level, showing level and every stat before -> after.
function showLevelUps(list, onClose) {
  const ov = document.getElementById("levelup-overlay");
  if (!list || !list.length || !ov) { if (onClose) onClose(); return; }
  const wrap = document.getElementById("levelup-cards"); wrap.innerHTML = "";
  list.forEach((h, i) => {
    const card = document.createElement("div"); card.className = "lv-card"; card.style.animationDelay = (i * 0.15) + "s";
    const b = (h.stats && h.stats.before) || {}, a = (h.stats && h.stats.after) || {};
    const rows = LV_STATS.filter(([k]) => a[k] !== undefined).map(([k, label]) => {
      const d = (a[k] || 0) - (b[k] || 0);
      return `<tr><td>${label}</td><td>${b[k] || 0} &rarr; <b>${a[k] || 0}</b></td><td class="${d > 0 ? "up" : ""}">${d > 0 ? "+" + d : ""}</td></tr>`;
    }).join("");
    const img = document.createElement("img"); img.src = h.portrait || ""; img.alt = ""; img.onerror = function () { this.style.visibility = "hidden"; };
    card.appendChild(img);
    const tail = document.createElement("div");
    tail.innerHTML = `<div class="nm"></div><div class="cl"></div><div class="lvl">Lv ${h.from} &rarr; ${h.to}</div><table>${rows}</table>` +
      (h.talent_points_gained > 0 ? `<div class="tp">+${h.talent_points_gained} Talent Point${h.talent_points_gained > 1 ? "s" : ""}!</div>` : "");
    tail.querySelector(".nm").textContent = h.name; tail.querySelector(".cl").textContent = String(h["class"] || "").replace(/_/g, " ");
    while (tail.firstChild) card.appendChild(tail.firstChild);
    wrap.appendChild(card);
  });
  const btn = document.getElementById("levelup-ok");
  btn.onclick = function () { ov.style.display = "none"; if (onClose) onClose(); };
  ov.style.display = "flex";
}

let cashingOut = false;
let debugBattle = false;
function handleBattleEnd(msg) {
  const result = msg.result;
  lastBattleResult = result;
  playMusic(MUSIC.main);   // swap straight back to hub music for the results screen (simple cut, no crossfade)
  document.getElementById("command-panel").style.display = "none";
  const overlay = document.getElementById("end-overlay");
  overlay.className = result; // victory | defeat | fled
  document.getElementById("end-title").textContent =
    result === "victory" ? "Victory!" : result === "fled" ? "Fled" : "Defeat";
  const rw = document.getElementById("end-reward");
  const sub = document.getElementById("end-sub");
  const hubBtn = document.getElementById("btn-hub");
  // "Return to Colosseum" is only accurate for a hub-started fight; a from_world fight (or any page
  // opened with ?return=world) actually sends the player back to /world -- see returnToHub() below.
  const returnLabel = RETURN_TARGET === "hub3d" ? "Continue Exploring" : (msg.from_world || RETURN_TARGET === "world") ? "Return to the Overworld" : "Return to Colosseum";
  if (result === "victory") {
    let t = `This win: ${fmtReward(msg)}`;
    if (msg.multiplier > 1) t += ` (x${msg.multiplier} streak bonus)`;
    rw.textContent = msg.from_world ? t : t + `\nCurrent reward: ${fmtReward(msg.pot)}`;
    sub.textContent = msg.can_continue
      ? `HP/MP carry over. Next win pays x${msg.next_multiplier}. If you are defeated you lose the whole reward.` : "";
    hubBtn.textContent = msg.can_continue ? "Cash Out & Return to Colosseum" : returnLabel;
  } else if (result === "defeat") {
    rw.textContent = msg.forfeited && (msg.forfeited.money || msg.forfeited.gems || msg.forfeited.xp)
      ? `Rewards lost: ${fmtReward(msg.forfeited)}` : "No rewards earned.";
    sub.textContent = "";
    hubBtn.textContent = returnLabel;
  } else {
    rw.textContent = msg.paid ? `Escaped with: ${fmtReward(msg.paid)}` : "";
    sub.textContent = "";
    hubBtn.textContent = returnLabel;
  }
  if (msg.boss && result === "victory") {
    const r = msg.rewards_paid ? msg.paid : msg;
    rw.textContent = (msg.first_clear ? "FIRST CLEAR BONUS!\n" : "Rematch reward\n") + fmtReward(r)
      + (msg.rewards_paid ? "" : "\n(debug fight - not granted)");
    sub.textContent = "";
  }
  if (msg.debug) {
    if (!msg.boss || result !== "victory") rw.textContent = msg.boss && msg.rewards_paid === false ? "Debug boss fight - no rewards" : "Debug battle - no rewards";
    hubBtn.textContent = "Back to Debug Menu";
  }
  const rn = document.getElementById("end-renown");
  rn.textContent = ""; rn.style.color = "";
  const r = msg.renown;
  if (r && !msg.debug) {
    if (r.rank_up) {
      rn.style.color = "#ffe27a";
      rn.textContent = `RANK UP!  You are now Rank ${r.rank} - ${r.rank_name}` +
        (r.next_boss ? `\nNext challenger: ${r.next_boss}` : "\nNo challengers remain... for now.");
    } else if (r.delta > 0) {
      rn.style.color = "#8fe8a0";
      rn.textContent = `+${r.delta} Renown` + (r.gate ? `  (${r.total} / ${r.gate})` : "") +
        (r.can_challenge ? "\nA boss challenge awaits in the Colosseum!" : "");
    } else if (r.delta < 0) {
      rn.style.color = "#ff8a8a";
      rn.textContent = `${r.delta} Renown` + (r.gate ? `  (${r.total} / ${r.gate})` : "");
    }
  }
  debugBattle = !!msg.debug;
  const el = document.getElementById("end-ladder");
  el.textContent = ""; document.getElementById("perk-choices").style.display = "none";
  document.getElementById("btn-hub").style.display = "";
  const L = msg.ladder;
  if (L && L.active) {
    renderLadderHud(L);
    if (result === "victory" && L.perk_choices) {
      el.textContent = `LADDER: win #${L.wins}` + (L.can_cash_out ? " - you may cash out after picking a perk." : ` - ${L.until_cash_out} more until you can cash out.`);
      showPerkChoices(L);
    } else if (result !== "victory") {
      el.textContent = "The ladder run is over.";
      document.getElementById("ladder-hud").style.display = "none";
    }
  }
  rw.style.whiteSpace = "pre-line";
  const tk = (o) => Object.entries(o || {}).filter(([, n]) => n > 0).map(([k, n]) => `+${n} ${k === "premium" ? "Premium" : "Common"} Ticket${n > 1 ? "s" : ""}`).join(", ");
  const won = tk(msg.tickets_won), potT = tk(msg.pot_tickets), lost = tk(msg.forfeited && msg.forfeited.tickets);
  if (result === "victory" && won && !msg.debug) rw.textContent += `\nTickets found: ${won}` + (msg.boss ? "" : ` (held in the pot: ${potT})`);
  if (result === "victory" && msg.items_won && msg.items_won.length && !msg.debug) rw.textContent += `\nItems found: ${msg.items_won.map((x) => (x.n > 1 ? x.n + "x " : "") + x.name).join(", ")}`;
  if (msg.paid && msg.paid.tickets && tk(msg.paid.tickets)) rw.textContent += `\nTickets received: ${tk(msg.paid.tickets)}`;
  if (lost) rw.textContent += `\nTickets lost: ${lost}`;
  document.getElementById("btn-next").style.display = (msg.can_continue && !(L && L.perk_choices)) ? "" : "none";
  // A from_world fight (a wild overworld encounter or the dungeon guardian -- see hub_server.py's
  // run_battle) never offers "Continue", but it also shouldn't offer "Fight Again": reloading the
  // page would just start an unrelated fresh fight instead of returning to /world, which isn't what
  // "one battle, then back to the world" means. "Return to Colosseum" (relabeled to /world by
  // RETURN_TARGET below) stays the only way out.
  document.getElementById("btn-again").style.display = (msg.can_continue || msg.from_world) ? "none" : "";
  // Lost a fight in a 3D scene (island / dungeon): nothing is lost -- choose to retry the same battle or, in a
  // dungeon, start it over from the entrance. (The server already put everyone's HP/MP back to how it was.)
  const againBtn = document.getElementById("btn-again"), restartBtn = document.getElementById("btn-restart");
  againBtn.textContent = "Fight Again"; againBtn.onclick = function () { location.reload(); }; restartBtn.style.display = "none";
  if (msg.hub3d && result === "defeat" && !msg.debug) {
    const hasRestart = !!new URLSearchParams(window.location.search).get("restart");
    againBtn.textContent = "Retry Battle"; againBtn.style.display = ""; againBtn.onclick = retryBattle;
    if (hasRestart) { restartBtn.style.display = ""; document.getElementById("btn-hub").style.display = "none"; }
    else { hubBtn.textContent = { olympus: "Back to the Colosseum", asteroid: "Back to the Base", vault: "Back to the Base" }[new URLSearchParams(window.location.search).get("scene")] || "Back to the Village"; }
  }
  cashingOut = msg.can_continue;
  if (msg.paid && msg.paid.levelups && msg.paid.levelups.length && !msg.debug) {
    showLevelUps(msg.paid.levelups, function () { overlay.style.display = "flex"; });
  } else {
    overlay.style.display = "flex";
  }
}

// ---- Ladder Mode ----
let ladderActive = false, ladderCanCashOut = false;
function renderLadderHud(l) {
  const hud = document.getElementById("ladder-hud");
  ladderActive = !!l.active;
  if (!l.active) { hud.style.display = "none"; return; }
  ladderCanCashOut = !!l.can_cash_out;
  hud.style.display = "block";
  hud.innerHTML = `LADDER MODE &nbsp;&middot;&nbsp; Wins ${l.wins}<br>` +
    (l.can_cash_out ? "Cash-out available!" : `Cash out in ${l.until_cash_out} win${l.until_cash_out === 1 ? "" : "s"}`) +
    `<div class="perks"></div>`;
  const box = hud.querySelector(".perks");
  for (const p of l.perks || []) {
    const chip = document.createElement("span"); chip.className = "perk-chip"; chip.title = p.name + ": " + p.desc;
    chip.appendChild(makeIcon(p.icon, 26));
    if (p.count > 1) { const n = document.createElement("b"); n.textContent = "x" + p.count; chip.appendChild(n); }
    box.appendChild(chip);
  }
}
function showPerkChoices(l) {
  const box = document.getElementById("perk-choices");
  box.innerHTML = ""; box.style.display = "flex";
  for (const p of l.perk_choices) {
    const card = document.createElement("button"); card.className = "perk-card";
    card.appendChild(makeIcon(p.icon, 44));
    card.insertAdjacentHTML("beforeend", `<b>${p.name}</b><span>${p.desc}</span>`);
    card.onclick = () => { for (const c of box.children) c.disabled = true; socket.send(JSON.stringify({type: "perk", id: p.id})); };
    box.appendChild(card);
  }
  document.getElementById("btn-next").style.display = "none";
  document.getElementById("btn-hub").style.display = "none";
}
function handlePerkApplied(msg) {
  document.getElementById("perk-choices").style.display = "none";
  document.getElementById("end-ladder").textContent = msg.message || "";
  renderLadderHud(msg);
  if (msg.state) { try { handleState(msg.state); } catch (e) {} }
  document.getElementById("btn-next").style.display = "";
  const hb = document.getElementById("btn-hub");
  hb.style.display = ladderCanCashOut ? "" : "none";
  hb.textContent = "Cash Out & Return to Colosseum";
}

function nextBattle() {
  autoUsed = { potion: 0, revive: 0, ether: 0 };
  document.getElementById("end-overlay").style.display = "none";
  document.getElementById("command-panel").style.display = "";
  // handleBattleEnd cut the music to Main.mp3 for the results screen and battleAudioStarted latched
  // true after the first fight's opening state message -- without resetting it here, the next state
  // message (this new fight) would be silently ignored by that one-shot guard and Main.mp3 would just
  // keep playing through the whole next battle. Resetting it makes the next handleState() re-detect
  // boss-vs-regular and switch the music (and re-fire the encounter stinger) same as a fresh fight.
  battleAudioStarted = false;
  socket.send(JSON.stringify({type: "continue"}));
}

// Defeat in a 3D scene: re-run the very same fight (the server remembers the last request), or leave and
// restart the dungeon (hub3d.js resets that dungeon's progress and puts the party back at the entrance).
function retryBattle() {
  document.getElementById("btn-again").disabled = true;
  fetch("/api/world/hub_battle", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ retry: true }) })
    .then(function () { location.reload(); }, function () { location.reload(); });
}
function restartDungeon() {
  const P = new URLSearchParams(window.location.search);
  window.location.href = HUB_URL + "?view=3d&scene=" + encodeURIComponent(P.get("scene") || "olympus") + "&restart=" + encodeURIComponent(P.get("restart") || "");
}

function returnToHub() {
  if (cashingOut) {
    // Wait for the server to confirm the payout is saved before leaving.
    try { socket.send(JSON.stringify({type: "leave"})); } catch (e) {}
    document.getElementById("btn-hub").disabled = true;
    return;
  }
  if (!debugBattle && RETURN_TARGET === "hub3d") {
    const P = new URLSearchParams(window.location.search);
    let u = HUB_URL + "?view=3d&scene=" + encodeURIComponent(P.get("scene") || "olympus");
    if (lastBattleResult === "victory" && P.get("key")) u += "&cleared=" + encodeURIComponent(P.get("key"));
    window.location.href = u;
    return;
  }
  window.location.href = debugBattle ? HUB_URL + "debug" : (RETURN_TARGET === "world" ? HUB_URL + "world" : HUB_URL);
}

function connect() {
  socket = new WebSocket("ws://127.0.0.1:8766/");
  const banner = document.getElementById("connect-banner");
  socket.onopen = () => { banner.style.display = "none"; };
  socket.onclose = () => { banner.textContent = "Disconnected from battle_server.py."; banner.style.display = "block"; };
  socket.onerror = () => { banner.textContent = "Couldn't reach battle_server.py -- is it running?"; banner.style.display = "block"; };
  // Server messages are played back strictly in order: a melee action holds the queue until the attacker
  // has reached its target, and the next action waits for it to get back (see returnDone).
  socket.onmessage = (event) => {
    msgQueue.push(JSON.parse(event.data));
    pumpMessages();
  };
}

const msgQueue = [];
let pumping = false;
async function pumpMessages() {
  if (pumping) return;
  pumping = true;
  while (msgQueue.length) {
    const msg = msgQueue.shift();
    try { await dispatchMessage(msg); } catch (e) { console.error("message handler failed", msg.type, e); }
  }
  pumping = false;
}
async function dispatchMessage(msg) {
  switch (msg.type) {
    case "state": handleState(msg.state); break;
    case "log": appendLog(msg.message, msg.debug); break;
    case "action_event": await handleActionEvent(msg); break;
    case "dialogue": await returnDone; showDialogue(msg.lines || []); break;
    case "fx": handleFx(msg); if (msg.kind === "pause") await wait(msg.ms || 0); break;
    case "need_action": await returnDone; handleNeedAction(msg.actor_id, msg.state); break;
    case "battle_end": await returnDone; handleBattleEnd(msg); break;
    case "ladder_status": renderLadderHud(msg); break;
    case "perk_applied": handlePerkApplied(msg); break;
    case "cashed_out": {
      const lu = msg.paid && msg.paid.levelups;
      if (lu && lu.length) showLevelUps(lu, function () { window.location.href = HUB_URL; });
      else window.location.href = HUB_URL;
      break;
    }
  }
}

function animationLoop(now) {
  sprites.forEach((s) => s.tick(now));
  if (window.B3D && B3D.on) B3D.frame(now);
  requestAnimationFrame(animationLoop);
}

function fitStage() {
  const stage = document.getElementById("stage");
  const scale = Math.min(window.innerWidth , window.innerHeight , 1);
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener("resize", fitStage);
fitStage();

document.getElementById("stage").style.backgroundImage = "url(/assets/Artwork/Background.webp)";

requestAnimationFrame(animationLoop);
if (window.B3D) B3D.init({
  sprites, SPRITE_H, NAMED_POSE_CFG, ROW_DEPTH_X, ROW_SLOT_GAP_Y, staticBounds,
  // re-run the layout after switching 2D <-> 3D (the two use different coordinate spaces)
  relayout: () => { layoutAllSprites(); sprites.forEach((s) => s.setPosition(s.homeX, s.homeY)); },
});
connect();
</script>
