<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Battle Arena -- Battle (HTML, real backend)</title>
<style>
  :root {
    --panel-bg: rgba(18, 14, 28, 0.68);
    --panel-border: rgba(255,255,255,0.10);
    --text-main: #f0ecff;
    --text-dim: #a79fc9;
    --accent: #7c5cff;
    --hp: #e0455a;
    --mp: #4aa3e0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #060409;
    color: var(--text-main);
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  #viewport {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  /* Fixed 1280x800 design canvas, scaled to fit the window -- same design
     resolution the pygame build settled on, for a fair comparison. */
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    background: #14101f no-repeat center/cover;
    transform-origin: center center;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
  }

  #auto-btn {
    position: absolute; top: 6px; left: calc(50% + 80px); z-index: 20;
    background: var(--panel-bg); color: var(--text-dim); border: 1px solid var(--panel-border);
    border-radius: 999px; padding: 4px 14px; font-size: 13px; cursor: pointer;
  }
  #auto-btn.on { background: var(--accent); color: #fff; border-color: #fff8; }
  #round-label {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: var(--text-dim);
    background: var(--panel-bg); padding: 4px 14px; border-radius: 999px;
    border: 1px solid var(--panel-border);
  }

  /* --- log panel, top-left, translucent --- */
  #log-panel {
    position: absolute; top: 36px; left: 16px; width: 420px; height: 96px;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 8px 12px; font-size: 12px;
    overflow-y: auto; line-height: 1.5; color: var(--text-dim);
  }
  #log-panel .line { color: var(--text-main); }
  #log-panel .line.calc { color: #8fb4ff; font-family: Consolas, monospace; font-size: 11px; padding-left: 10px; }
  #log-panel.dbg { resize: both; min-width: 300px; min-height: 60px; max-width: 95%; z-index: 6; }
  #log-panel.dbg.expanded { width: 760px; height: 62vh; }
  #log-toggle {
    display: none; position: absolute; top: 38px; left: 442px; z-index: 7; padding: 2px 8px;
    font-size: 11px; border-radius: 6px; cursor: pointer; border: 1px solid var(--panel-border);
    background: var(--panel-bg); color: var(--text-main);
  }
  #log-toggle.on { left: 782px; }

  /* --- sprites --- */
  .sprite-anchor {
    position: absolute;
    transition: left 0.35s ease, top 0.35s ease;
    cursor: pointer;
  }
  .sprite-anchor.not-targetable { cursor: default; }
  /* transform-origin defaults to the element's own center (50% 50%), but .sprite-mirror wraps
     .sprite-frame, which is ALREADY shifted onto the anchor point by its own translate(-50%,-100%)
     (or, for a calibrated pose, a custom foot-based translate) -- scaleX(-1) around that default
     center pivots around the middle of the frame's pre-shift box, not around the anchor itself, so
     every mirrored (party-side, facing-left) sprite renders visibly offset from its own nameplate/
     hit-box by roughly one sprite-width while every non-mirrored (enemy) sprite lines up fine. Since
     .sprite-mirror's own box always starts exactly at the anchor position (it's an unpositioned,
     zero-offset child of .sprite-anchor), pivoting at its own left edge (x: 0%) is pivoting at the
     anchor itself -- which keeps the flip's fixed point (in the fixed-point-of-a-reflection sense)
     exactly where the frame's own transform already put the character's feet, for every character
     and every pose, calibrated or not. */
  .sprite-mirror { transition: transform 0.1s linear; transform-origin: 0 0; }
  .sprite-frame {
    background-repeat: no-repeat;
    image-rendering: pixelated;
    transform: translate(-50%, -100%); /* anchor = feet position */
  }
  .sprite-anchor.ko .sprite-mirror { opacity: 0.35; filter: grayscale(1); }
  .sprite-mirror { transition: opacity .7s, filter .7s; }
  .sprite-anchor.targetable .sprite-frame { filter: drop-shadow(0 0 8px #ffe27acc); }
  .sprite-anchor.targetable:hover .sprite-frame,
  .sprite-anchor.hl .sprite-frame { filter: drop-shadow(0 0 14px #fff) drop-shadow(0 0 6px #ffe27a); }

  /* --- nameplate above every sprite --- */
  .nameplate {
    position: absolute; left: 0; transform: translateX(-50%);
    min-width: 70px; text-align: center; white-space: nowrap; pointer-events: none;
    font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px #000, 0 0 4px #000;
  }

  /* --- floating combat text + overhead status icons (Icons.png sprite sheet) --- */
  .dmgfloat { position: absolute; transform: translateX(-50%); z-index: 450; pointer-events: none; white-space: nowrap; text-align: center;
    font-weight: 900; font-size: 26px; line-height: 1; letter-spacing: 0.02em; color: var(--c, #fff);
    -webkit-text-stroke: 1.5px #000; paint-order: stroke fill; text-shadow: 0 2px 4px #000, 0 0 10px var(--c, #fff);
    animation: dmg-rise 1.15s cubic-bezier(.2,.8,.3,1) forwards; }
  .dmgfloat.crit { font-size: 38px; animation-name: dmg-crit; }
  .dmgfloat.heal, .dmgfloat.mp { font-size: 24px; }
  .dmgfloat.status { font-size: 15px; letter-spacing: 0.04em; }
  .dmgfloat small { display: block; font-size: 12px; letter-spacing: 0.1em; margin-bottom: 2px; }
  .dmgfloat .ico { display: inline-block; vertical-align: middle; margin-right: 3px; }
  @keyframes dmg-rise { 0% { opacity: 0; transform: translate(-50%, 8px) scale(0.6); } 12% { opacity: 1; transform: translate(-50%, -6px) scale(1.25); }
    25% { transform: translate(-50%, -14px) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -64px) scale(0.95); } }
  @keyframes dmg-crit { 0% { opacity: 0; transform: translate(-50%, 8px) scale(0.5); } 10% { opacity: 1; transform: translate(-50%, -8px) scale(1.5); }
    22% { transform: translate(-50%, -16px) scale(1.15); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1.05); } }
  :root { --icons: url('/assets/Artwork/Icons.png'); }
  .ico { background-image: var(--icons); background-repeat: no-repeat; image-rendering: pixelated; flex: none; }
  .np-status { position: absolute; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%); display: flex; gap: 1px; pointer-events: none; }
  .sprite-anchor.targetable .np-status { bottom: calc(100% + 22px); }
  .sprite-anchor.ko .np-status { display: none; }
  .np-status .ico { filter: drop-shadow(0 1px 2px #000); animation: ico-pop 0.25s ease-out; }
  @keyframes ico-pop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .nameplate.party .np-name { color: #8fe8d0; }
  .nameplate.enemy .np-name { color: #ff9a9a; }
  .nameplate .np-bar { height: 5px; margin: 2px auto 0; width: 64px; background: #000a; border-radius: 3px; overflow: hidden; }
  .nameplate .np-fill { height: 100%; background: #56d06a; }
  .nameplate.enemy .np-fill { background: #e0455a; }
  .sprite-anchor.ko .nameplate { opacity: 0.5; }
  .sprite-anchor.targetable .nameplate .np-name,
  .sprite-anchor.hl .nameplate .np-name { color: #ffe27a; }
  .sprite-anchor.targetable .nameplate::before {
    content: "\25BC"; position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%);
    color: #ffe27a; font-size: 14px; animation: np-bob 0.6s ease-in-out infinite alternate;
  }
  @keyframes np-bob { from { margin-bottom: 0; } to { margin-bottom: 6px; } }

  /* --- bottom command panel --- */
  #command-panel {
    position: absolute; left: 16px; bottom: 16px; width: 220px;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px; display: none;
  }
  #command-panel .title { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  #command-panel button {
    display: block; width: 100%; margin-bottom: 6px;
    padding: 9px 10px; border-radius: 8px; border: none;
    background: rgba(255,255,255,0.08); color: var(--text-main);
    font-size: 13px; text-align: left; cursor: pointer;
  }
  #command-panel button:hover { background: var(--accent); }
  #command-panel button:disabled { opacity: 0.35; cursor: not-allowed; background: rgba(255,255,255,0.05); }
  #command-panel button.back { color: var(--text-dim); font-size: 12px; }

  .tooltip {
    display: none; position: fixed; z-index: 900; max-width: 260px;
    background: rgba(10,8,18,0.97); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.45;
    box-shadow: 0 6px 20px rgba(0,0,0,0.55); pointer-events: none;
  }
  .tooltip .tt-title { font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
  .tooltip .tt-meta { color: var(--accent); font-size: 11px; letter-spacing: 0.02em; margin-bottom: 4px; }
  .tooltip .tt-desc { color: var(--text-dim); }

  /* --- party status panel, bottom-right --- */
  #status-panel {
    position: absolute; right: 16px; bottom: 16px; width: 260px;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px;
  }
  .status-row { margin-bottom: 8px; font-size: 12px; }
  .status-row:last-child { margin-bottom: 0; }
  .status-row .name { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .status-row .name.acting { color: #ffe27a; font-weight: 700; }
  .bar-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 3px; }
  .bar-fill { height: 100%; transition: width 0.4s ease; }
  .bar-fill.hp { background: var(--hp); }
  .bar-fill.mp { background: var(--mp); }
  .status-row.ko { opacity: 0.45; }

  /* --- boss: bar, dialogue, fx --- */
  #boss-bar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: 360px; display: none; z-index: 4;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px; padding: 6px 12px; text-align: center; font-size: 12px; }
  #boss-bar .bb-row + .bb-row { margin-top: 8px; }
  #boss-bar .bb-track { height: 12px; border-radius: 6px; background: rgba(255,255,255,0.12); overflow: hidden; margin-top: 4px; position: relative; }
  #boss-bar .bb-fill { height: 100%; background: linear-gradient(90deg, #b8322f, #e0455a); transition: width 0.5s ease; }
  #boss-bar .bb-row.enraged .bb-fill { background: linear-gradient(90deg, #ff1a1a, #ff6a3a); }
  #boss-bar .bb-row.enraged .bb-name { color: #ff6a6a; }
  #boss-bar .bb-row.down { opacity: 0.45; }
  #boss-bar .bb-shield { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; margin-top: 3px; }
  #boss-bar .bb-shield > div { height: 100%; background: linear-gradient(90deg, #9fd8ff, #ffffff); transition: width 0.3s ease; }
  /* --- twin mechanics: floating callouts, shield bar, bloodlust glow --- */
  .callout { position: absolute; transform: translateX(-50%); z-index: 400; pointer-events: none; white-space: nowrap;
    font-weight: 900; font-size: 22px; letter-spacing: 0.06em; text-shadow: 0 2px 6px #000, 0 0 12px #000;
    animation: callout-rise 1.3s ease-out forwards; }
  @keyframes callout-rise { 0% { opacity: 0; margin-top: 14px; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }
  .nameplate .np-shield { height: 4px; margin: 2px auto 0; width: 64px; background: #000a; border-radius: 3px; overflow: hidden; display: none; }
  .nameplate .np-shield > div { height: 100%; background: linear-gradient(90deg, #9fd8ff, #fff); }
  .sprite-anchor.enraged .sprite-frame { animation: rage-glow 0.85s ease-in-out infinite alternate; }
  @keyframes rage-glow {
    from { filter: drop-shadow(0 0 6px #ff2020) drop-shadow(0 0 14px #b00000) saturate(1.35) brightness(1.0); }
    to   { filter: drop-shadow(0 0 14px #ff3030) drop-shadow(0 0 34px #ff0000) saturate(1.7) brightness(1.12); } }
  .sprite-anchor.enraged.targetable .sprite-frame, .sprite-anchor.enraged:hover.targetable .sprite-frame { animation: none;
    filter: drop-shadow(0 0 14px #ff3030) drop-shadow(0 0 10px #ffe27a) saturate(1.6); }
  .sprite-anchor.enraged .nameplate .np-name { color: #ff5a5a; }
  /* --- twin mechanics, round two: mark, bulwark, dance, harmony --- */
  .sprite-anchor.marked .sprite-frame { animation: mark-pulse 0.7s ease-in-out infinite alternate; }
  @keyframes mark-pulse {
    from { filter: drop-shadow(0 0 4px #ff2a4a) drop-shadow(0 0 10px #a00020) saturate(1.1); }
    to   { filter: drop-shadow(0 0 12px #ff2a4a) drop-shadow(0 0 28px #ff0030) saturate(1.5) brightness(1.1); } }
  .sprite-anchor.marked.targetable .sprite-frame { animation: none;
    filter: drop-shadow(0 0 12px #ff2a4a) drop-shadow(0 0 10px #ffe27a); }
  .nameplate .np-mark { display: none; margin: 2px auto 0; width: max-content; padding: 1px 8px; border-radius: 8px;
    background: #b0102c; color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 0.08em; animation: mark-blink 0.8s steps(2) infinite; }
  .sprite-anchor.marked .nameplate .np-mark { display: block; }
  @keyframes mark-blink { 50% { background: #ff3a5a; } }
  .sprite-anchor.bulwark .sprite-frame { filter: drop-shadow(0 0 10px #5aa8ff) drop-shadow(0 0 22px #2f6cd6) brightness(1.08); }
  .sprite-anchor.bulwark .nameplate .np-name { color: #8fc8ff; }
  .sprite-anchor.dancing .sprite-frame { animation: dance-glow 0.5s ease-in-out infinite alternate; }
  @keyframes dance-glow {
    from { filter: drop-shadow(-8px 0 6px #ff3a7a88) drop-shadow(8px 0 6px #ff3a7a88) brightness(1.0); }
    to   { filter: drop-shadow(-16px 0 10px #ff3a7acc) drop-shadow(16px 0 10px #ff3a7acc) brightness(1.15); } }
  #boss-bar .bb-harmony { margin-top: 8px; }
  #boss-bar .bb-harmony .bb-hlabel { font-size: 11px; letter-spacing: 0.1em; color: #ff9ad1; }
  #boss-bar .bb-harmony .bb-htrack { height: 8px; border-radius: 5px; background: rgba(255,255,255,0.12); overflow: hidden; margin-top: 3px; }
  #boss-bar .bb-harmony .bb-hfill { height: 100%; background: linear-gradient(90deg, #7a4bd6, #ff7ac0); transition: width 0.4s ease; }
  #boss-bar .bb-harmony.full .bb-hfill { animation: harm-full 0.6s ease-in-out infinite alternate; }
  #boss-bar .bb-harmony.full .bb-hlabel { color: #fff; font-weight: 800; }
  @keyframes harm-full { from { filter: brightness(1); } to { filter: brightness(1.7) drop-shadow(0 0 6px #ff9ad1); } }
  #boss-bar .bb-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; padding: 0 5px; margin-left: 4px; border-radius: 6px; }
  #boss-bar .bb-tag.bulwark { background: #2a5fb0; color: #dcecff; }
  #boss-bar .bb-tag.dance { background: #b0245a; color: #ffe0ee; }
  #boss-bar .bb-tag.unyielding { background: #8a6a1a; color: #fff0c0; }
  #boss-bar .bb-tag.chant { background: #4a5a80; color: #fff; }
  #boss-bar .bb-tag.rage { background: #b01010; color: #fff; }
  #dialogue { box-sizing: border-box; position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); width: min(820px, 94%); z-index: 30; display: none;
    background: linear-gradient(180deg, rgba(34,28,52,0.98), rgba(12,10,22,0.98)); border: 2px solid #e8c766; border-radius: 16px; padding: 30px 26px 28px; cursor: pointer;
    box-shadow: 0 0 0 3px rgba(0,0,0,.65), 0 0 0 5px rgba(232,199,102,.35), 0 14px 44px rgba(0,0,0,.75), 0 0 36px rgba(232,199,102,.18); }
  #dialogue .dlg-row { display: flex; gap: 20px; align-items: flex-start; }
  #dialogue .dlg-portrait { width: 140px; height: 176px; border-radius: 12px; object-fit: cover; object-position: top center; display: none; flex: none;
    border: 2px solid #e8c766; background: #120f1c; box-shadow: 0 0 0 3px rgba(0,0,0,.7), 0 8px 24px rgba(0,0,0,.7); margin-top: -50px; }
  #dialogue .dlg-speaker { position: absolute; left: 26px; top: -15px; padding: 4px 18px 5px; border-radius: 9px; font-weight: 800; font-size: 14px; letter-spacing: .09em;
    text-transform: uppercase; color: #241a05; background: linear-gradient(180deg, #f2d67e, #b8892c); box-shadow: 0 3px 12px rgba(0,0,0,.6); }
  #dialogue .dlg-speaker:empty { display: none; }
  #dialogue.has-pic .dlg-speaker { left: 186px; }
  #dialogue .dlg-text { font-size: 18px; line-height: 1.55; min-height: 56px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #dialogue .dlg-hint { text-align: right; font-size: 12px; color: #e8c766; margin-top: 8px; }
  #dim { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: none; z-index: 25; }
  #announce { position: absolute; left: 0; right: 0; top: 34%; text-align: center; z-index: 28; pointer-events: none; display: none;
    font-size: 40px; font-weight: 900; letter-spacing: 0.12em; color: #ffe27a; text-shadow: 0 0 24px #ff7a2a, 0 3px 0 #000; }
  #announce.show { display: block; animation: ann 2.2s ease forwards; }
  @keyframes ann { 0% { opacity: 0; transform: scale(1.4); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  #flash { position: absolute; inset: 0; z-index: 27; pointer-events: none; opacity: 0; }
  #flash.go { animation: fl 0.6s ease-out; }
  @keyframes fl { 0% { opacity: 0.75; } 100% { opacity: 0; } }
  #stage.shake { animation: shk 0.5s linear; }
  @keyframes shk { 0%,100% { transform: translate(0,0); } 15% { transform: translate(-9px,4px); } 30% { transform: translate(8px,-5px); }
    45% { transform: translate(-7px,-3px); } 60% { transform: translate(6px,5px); } 80% { transform: translate(-3px,2px); } }


  /* --- level-up screen --- */
  #levelup-overlay { position: absolute; inset: 0; z-index: 1100; background: rgba(4,3,8,0.92); display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px; overflow-y: auto; }
  #levelup-overlay h1 { margin: 0; font-size: 34px; letter-spacing: 3px; color: #ffe27a; text-shadow: 0 0 18px rgba(255,200,60,0.6); animation: lvpulse 1.4s ease-in-out infinite; }
  @keyframes lvpulse { 50% { text-shadow: 0 0 30px rgba(255,220,100,0.95); } }
  #levelup-cards { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 1100px; }
  .lv-card { width: 230px; padding: 12px; border: 1px solid rgba(255,226,122,0.6); border-radius: 12px; color: #fff; text-align: center;
    background: linear-gradient(180deg, rgba(60,48,20,0.92), rgba(24,20,34,0.95)); box-shadow: 0 6px 22px rgba(255,220,100,0.18);
    animation: lvin .45s ease-out both; }
  @keyframes lvin { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  .lv-card img { width: 96px; height: 96px; object-fit: cover; border-radius: 50%; border: 2px solid #ffe27a; background: #1a1626; }
  .lv-card .nm { font-size: 17px; font-weight: 800; margin-top: 6px; }
  .lv-card .cl { font-size: 11px; opacity: .7; text-transform: capitalize; }
  .lv-card .lvl { font-size: 20px; font-weight: 800; color: #ffe27a; margin: 6px 0 8px; }
  .lv-card table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lv-card td { padding: 2px 4px; text-align: right; }
  .lv-card td:first-child { text-align: left; opacity: .8; }
  .lv-card .up { color: #8fe8a0; font-weight: 700; }
  .lv-card .tp { margin-top: 8px; font-size: 12px; color: #9fd3ff; font-weight: 700; }
  #levelup-overlay button { padding: 10px 32px; border-radius: 999px; border: none; background: var(--accent); color: white; font-weight: 700; font-size: 14px; cursor: pointer; }

  /* --- end overlay --- */
  #end-overlay {
    position: absolute; inset: 0; z-index: 1000; background: rgba(4,3,8,0.88);
    display: none; align-items: center; justify-content: center; flex-direction: column;
  }
  #ladder-hud { position: absolute; top: 10px; right: 12px; z-index: 500; display: none; max-width: 330px; text-align: right;
    font-size: 12px; font-weight: 700; color: #ffe27a; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #ladder-hud .perks { margin-top: 4px; display: flex; gap: 2px; justify-content: flex-end; flex-wrap: wrap; }
  #ladder-hud .perk-chip { position: relative; }
  #ladder-hud .perk-chip b { position: absolute; right: -2px; bottom: -3px; font-size: 10px; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  #perk-choices { display: none; gap: 10px; margin: 8px 0; justify-content: center; }
  #end-overlay .perk-card { width: 170px; min-height: 150px; padding: 12px 10px; margin: 0; border: 1px solid rgba(255,226,122,0.6); border-radius: 12px; cursor: pointer; text-align: center;
    background: linear-gradient(180deg, rgba(60,48,20,0.92), rgba(24,20,34,0.95)); color: #fff; font-family: inherit; font-size: 12px; font-weight: 400; }
  #end-overlay .perk-card:hover { transform: translateY(-3px); box-shadow: 0 6px 22px rgba(255,220,100,0.35); }
  .perk-card .ico { display: block; margin: 0 auto 6px; }
  .perk-card b { display: block; font-size: 14px; color: #ffe27a; margin-bottom: 4px; }
  .perk-card span { font-size: 12px; color: #ddd; line-height: 1.3; }
  #end-overlay h1 { font-size: 36px; margin: 0 0 8px; }
  #end-overlay.victory h1 { color: #6fe3c8; }
  #end-overlay.defeat h1 { color: #e0455a; }
  #end-overlay.fled h1 { color: #ebaf3c; }

<script>
/* ---------------------------------------------------------------------
   Layout constants -- a single staggered zigzag column per side (Andrew's
   own sketch, 2026-09-23), replacing the earlier two-fixed-ranks formation:
   position 0 stands nearest the camera (bottom of the playfield, drawn on
   top), each further position steps up the screen and alternates a
   horizontal offset toward the opposing side, so the column reads as a
   staggered line rather than two flat rows.
--------------------------------------------------------------------- */
const HUB_URL = "http://127.0.0.1:8767/"; // hub_server.py's own fixed HTTP_PORT -- see its docstring
// A wild overworld encounter (game/world.py) links here as "/battle?return=world" so the win/lose
// screen's "Return to Colosseum" button sends the player back out into the overworld instead of the
// Colosseum hub -- see returnToHub() below. Anything else (the hub's own "Enter Battle", a boss
// challenge, the debug screen) omits this param and keeps the old behavior.
const RETURN_TARGET = new URLSearchParams(window.location.search).get("return");
// "?return=hub3d&scene=<id>&key=<id>" comes from a 3D hub scene's `battle` action (island dungeon):
// returnToHub() sends the player back into that scene, adding &cleared=<key> after a win so the
// scene can remove the monster (see html_hub/3d/hub3d.js).
let lastBattleResult = "";

/* ---------------------------------------------------------------------
   Sound: fire-and-forget SFX one-shots + a single persistent looping music
   element (so switching tracks stops the old one instead of stacking).
   SFX_VOLUME/MUSIC_VOLUME below are the only tuning knobs -- no in-game
   volume control yet. Autoplay-block rejections are swallowed on purpose:
   sound is a nice-to-have, never worth breaking the battle over.
--------------------------------------------------------------------- */
const SFX_VOLUME = 0.7, MUSIC_VOLUME = 0.35;
function playSfx(url, vol) {
  if (!url) return;
  try {
    const a = new Audio(url);
    a.volume = vol != null ? vol : SFX_VOLUME;
    a.play().catch(() => {});
  } catch (e) { /* best-effort */ }
}
let _musicEl = null, _musicUrl = null;
function playMusic(url, vol) {
  if (_musicUrl === url && _musicEl && !_musicEl.paused) return; // already the track we want
  stopMusic();
  try {
    _musicEl = new Audio(url);
    _musicEl.loop = true;
    _musicEl.volume = vol != null ? vol : MUSIC_VOLUME;
    _musicUrl = url;
    _musicEl.play().catch(() => {});
  } catch (e) { /* best-effort */ }
}
function stopMusic() {
  if (_musicEl) { try { _musicEl.pause(); } catch (e) {} }
  _musicEl = null; _musicUrl = null;
}
// Arena music: a battle map (html_battle/maps/<id>.json, edited in /builder3d) may set `music` and `bossMusic` = {url, intro?}.
function playTrack(m) {
  if (!m || !m.url) return false;
  if (!m.intro) { playMusic(m.url, m.volume); return true; }
  stopMusic();
  try {
    const ia = new Audio(m.intro); ia.volume = m.volume != null ? m.volume : MUSIC_VOLUME; _musicEl = ia; _musicUrl = m.intro;
    ia.onended = () => { if (_musicEl !== ia) return; const la = new Audio(m.url); la.loop = true; la.volume = ia.volume; _musicEl = la; _musicUrl = m.url; la.play().catch(() => {}); };
    ia.play().catch(() => {});
  } catch (e) {}
  return true;
}
async function startBattleMusic(isBoss) {
  let m = null;
  try {
    const q = new URLSearchParams(location.search); let id = q.get("map"); if (!id) { try { id = localStorage.getItem("battleMap"); } catch (e) {} }
    if (id && id !== "painted") { const def = await (await fetch("/battle/maps/" + encodeURIComponent(id) + ".json")).json(); m = (isBoss && def.bossMusic) || def.music || null; }
  } catch (e) {}
  if (!playTrack(m)) playMusic(isBoss ? MUSIC.boss : MUSIC.battle);
}
const SFX = {
  slash:    "/assets/SFX/10_Battle_SFX/22_Slash_04.wav",       // melee impact (default for melee AND physical ranged)
  koDeath:  "/assets/SFX/10_Battle_SFX/69_Enemy_death_01.wav", // either side's combatant falls
  flee:     "/assets/SFX/10_Battle_SFX/51_Flee_02.wav",
  encounter:"/assets/SFX/10_Battle_SFX/55_Encounter_02.wav",
  block:    "/assets/SFX/10_Battle_SFX/39_Block_03.wav",       // played when Defend is chosen -- see finish()
  fire:     "/assets/SFX/8_Atk_Magic_SFX/04_Fire_explosion_04_medium.wav",
  ice:      "/assets/SFX/8_Atk_Magic_SFX/13_Ice_explosion_01.wav",
  thunder:  "/assets/SFX/8_Atk_Magic_SFX/18_Thunder_02.wav",
  charge:   "/assets/SFX/8_Atk_Magic_SFX/45_Charge_05.wav",    // magic cast windup stinger
  heal:     "/assets/SFX/8_Buffs_Heals_SFX/02_Heal_02.wav",
  revive:   "/assets/SFX/8_Buffs_Heals_SFX/30_Revive_03.wav",  // an ally goes KO'd -> alive again (holy_reset etc.)
  atkUp:    "/assets/SFX/8_Buffs_Heals_SFX/16_Atk_buff_04.wav",
  defUp:    "/assets/SFX/8_Buffs_Heals_SFX/17_Def_buff_01.wav",
  debuff:   "/assets/SFX/8_Buffs_Heals_SFX/21_Debuff_01.wav",  // atk_down/def_down (weaken/sunder etc.)
  sleep:    "/assets/SFX/8_Buffs_Heals_SFX/44_Sleep_01.wav",   // stunned
  poison:   "/assets/SFX/8_Buffs_Heals_SFX/46_Poison_01.wav",
  useItem:  "/assets/SFX/10_UI_Menu_SFX/051_use_item_01.wav",
  hover:    "/assets/SFX/10_UI_Menu_SFX/001_Hover_01.wav",
};
// New-status-key -> SFX, consumed by emitCombatText()'s per-combatant diff below. Only the keys with
// a clear matching sample are listed -- an unlisted status key (bulwark, counter, marked...) just
// stays silent, same as before this pass.
const STATUS_SFX = { poison: SFX.poison, stun: SFX.sleep, atk_up: SFX.atkUp, atk_down: SFX.debuff,
  def_up: SFX.defUp, def_down: SFX.debuff };
// Elemental magic impact stinger, played the instant the bolt lands (see playProjectileFx). holy/dark
// have no matching explosion sample in the SFX pack, so they rely on the charge/cast stinger alone.
const MAGIC_IMPACT_SFX = { fire: SFX.fire, ice: SFX.ice, thunder: SFX.thunder };
const MUSIC = {
  battle: "/assets/Music/Battle/Battle1.mp3",
  boss:   "/assets/Music/Boss/Boss1.mp3",
  main:   "/assets/Music/Main/Main.mp3",
};
let STAGE_W = 800;
let STAGE_H = 600;
const ENEMY_COL_X = 280;
const GROUND_BOTTOM_MARGIN = 100;
const SPRITE_H = 190;                    // fixed, never shrunk
// Battle formations (engine/formation.py): fixed 2x3 grid -- 3 depth rows (front nearest the
// enemy line, then middle, then rear farthest back) each with up to 2 stacked "set spots" --
// matching the Party Select preview's own orientation (html_hub/party.html): depth runs
// horizontally (front closest to the opposing side, rear pulled back from it), not vertically.
// ROW_ORDER only controls draw order here; ROW_DEPTH_X is how far each row pushes toward (front,
// positive) or away from (rear, negative) the opponent, and ROW_SLOT_GAP_Y is the vertical spacing
// between the two spots in a row when it holds more than one occupant.
const ROW_ORDER = ['front', 'middle', 'rear'];
const ROW_DEPTH_X = { front: 170, middle: 0, rear: -170 };
const ROW_SLOT_GAP_Y = 150;
const IDLE_FPS = 8;
const FRAME_COLS = 6, FRAME_ROWS = 6;

//updates screen size dynamically
window.addEventListener('resize', () => {
  STAGE_H = window.innerHeight;
  STAGE_W = window.innerWidth;

});

STAGE_H = window.innerHeight;
STAGE_W = window.innerWidth;

function columnLayout(combatants, anchorX, facingRight) {
  if (window.B3D && B3D.on) return B3D.layout(combatants, facingRight);   // 3D view: arena-centred virtual layout
  // Returns [{x, y, z}], one per entry in `combatants` (in the same order). Fixed 2x3 formation
  // grid, depth running horizontally: combatants are grouped by their formation row (front/middle/
  // rear -- unrecognized or missing values fall back to middle), each row's line sits at a fixed X
  // (front pushed toward the opposing side by ROW_DEPTH_X, rear pulled back from it), and occupants
  // within a row are centered vertically on that line -- a lone occupant sits dead center, two
  // spread symmetrically up/down by ROW_SLOT_GAP_Y (and it degrades gracefully if a row somehow
  // ends up with more than two). z follows each sprite's own Y so a lower (nearer-camera) sprite
  // draws in front of a higher one, same painter's-algorithm rule a flat side-view stage needs
  // regardless of which row a sprite is in.
  const inset = facingRight ? 1 : -1;
  const finalX = anchorX + inset * STAGE_W * 0.15;
  const baseY = STAGE_H - GROUND_BOTTOM_MARGIN;

  const byRow = { front: [], middle: [], rear: [] };
  combatants.forEach((c) => {
    const row = Object.prototype.hasOwnProperty.call(byRow, c.formation) ? c.formation : 'middle';
    byRow[row].push(c);
  });

  const slotsById = new Map();
  ROW_ORDER.forEach((row) => {
    const occupants = byRow[row];
    const x = finalX + inset * ROW_DEPTH_X[row];
    occupants.forEach((c, slotIdx) => {
      const spread = (slotIdx - (occupants.length - 1) / 2) * ROW_SLOT_GAP_Y;
      const y = baseY + spread;
      slotsById.set(c, { x, y, z: Math.round(y) });
    });
  });

  return combatants.map((c) => slotsById.get(c));
}

/* ---------------------------------------------------------------------
   Sprite sheet loading -- mirrors ui/pygame_ui.py's fallback chain: a
   combatant's own sheet for this pose, else Draven's sheet for this pose,
   else Draven's own Idle. Cached globally per (name, pose) so repeats
   don't refetch.
--------------------------------------------------------------------- */
const DEFAULT_BATTLER = "Draven";
const sheetCache = new Map(); // "name/pose" -> {img, ready:Promise}

function sheetUrl(name, pose) {
  return `/assets/Battlers/${encodeURIComponent(name)}/${encodeURIComponent(name)}-${pose}.png`;
}

// Visible (non-transparent) bounds of a static sprite, measured once per image.
function staticBounds(img) {
  if (img._bounds) return img._bounds;
  let b = { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight };
  try {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 >= x0 && y1 >= y0) b = { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  } catch (e) { /* tainted/unreadable canvas: use the full image */ }
  img._bounds = b;
  return b;
}

const urlSheetCache = new Map();
function loadUrlSheet(url) {
  if (urlSheetCache.has(url)) return urlSheetCache.get(url);
  const p = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
  urlSheetCache.set(url, p);
  return p;
}

/* Mythic hero battlers don't all name their non-Idle poses the same way (e.g. Kael and Yulia's
   attack sheets are "-Attack.png", not "-Melee.png", and Sera's cast sheet is "-Cast.png" while
   Lyra's is "-Casting.png") -- a tiny per-character alias table beats hardcoding one pose name and
   silently falling back to Draven for anyone whose art doesn't match it. Unlisted characters use
   the default guess for that animation kind, which still falls back through loadSheet()'s normal
   Draven chain if no such sheet exists for them.
--------------------------------------------------------------------- */
const POSE_ALIAS = {
  melee: { Kael: "Attack", Yulia: "Attack" },
  cast:  { Sera: "Cast" },
  heal:  { Sera: "Cast" },
};
const DEFAULT_POSE = { melee: "Melee", cast: "Casting", shoot: "Shoot", heal: "Heal" };
function poseFor(kind, name) {
  return (POSE_ALIAS[kind] && POSE_ALIAS[kind][name]) || DEFAULT_POSE[kind];
}

function loadSheet(name, pose) {
  const key = `${name}/${pose}`;
  if (sheetCache.has(key)) return sheetCache.get(key);
  const promise = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => {
      if (name !== DEFAULT_BATTLER) {
        resolve(loadSheet(DEFAULT_BATTLER, pose));
      } else if (pose !== "Idle") {
        resolve(loadSheet(DEFAULT_BATTLER, "Idle"));
      } else {
        resolve(null); // truly nothing to show -- caller falls back to a plain box
      }
    };
    img.src = sheetUrl(name, pose);
  });
  sheetCache.set(key, promise);
  return promise;
}

// Per-character, per-pose calibration for the mythic heroes' new Attack/Shoot/Cast(ing) art, filling
// the same role `poseCfg` plays for multi-pose bosses (see the `cfg.ref_h` branch in tick() below) --
// two separate problems, both measured directly off the actual PNGs rather than guessed:
//
// SIZE: these sheets draw the character noticeably smaller within their 6x6 frame (more surrounding
// canvas) than Idle/Run do, so at a fixed display height they render visibly smaller and don't quite
// land on the ground. ref_h/foot are the character's actual pixel height and feet position within
// that pose's own frame (bounding box of non-transparent pixels, frame-local coordinates) -- scaling
// by H/ref_h and pinning at foot normalizes every pose to the same apparent size and ground contact.
//
// TIMING: Shoot/Casting/Cast are all-in-one 36-frame sheets (draw/charge -> release flash -> follow
// -through), inspected frame-by-frame as a contact sheet: Rook holds the bow drawn until frame ~25
// (the arrow-loosing flash), Lyra's/Sera's charge builds to a release burst around frame ~20. Played
// at the same 8fps as Idle that's 2.5-3+ seconds before anything visibly happens, which is why waiting
// a fixed few hundred ms just clipped the still-drawn hold -- there was no visible windup to see yet.
// `fps`/`release` let these specific poses play faster (so the sequence still reads in under a
// second) while `windupMs()` below derives the actual wait from release/fps instead of a flat guess,
// so the projectile launches right as the release flash hits, whatever fps this ends up tuned to.
// Idle/Run aren't listed here -- they already size and read correctly at the default 8fps.
const NAMED_POSE_CFG = {
  // Melee poses: animateMelee times its own swing/impact independently of fps -- fps/frames/loop are
  // kept at the same values the old (calibration-less) default branch used, so only sizing changes.
  Kael:  { Attack:  { ref_h: 370, foot: [251.5, 434], fps: IDLE_FPS, frames: [0, 35], loop: true } },
  Yulia: { Attack:  { ref_h: 679, foot: [235.0, 695], fps: IDLE_FPS, frames: [0, 35], loop: true } },
  // Ranged/magic windup poses: sped up so the draw/charge -> release sequence reads in under a
  // second (see windupMs() below) instead of the 8fps default's 2.5-3+ second crawl to the release
  // frame -- `release` is that frame's index, measured from the actual art.
  Rook:  { Shoot:   { ref_h: 520, foot: [307.0, 522], fps: 30, frames: [0, 35], loop: true, release: 25 } },
  Lyra:  { Casting: { ref_h: 517, foot: [196.0, 516], fps: 30, frames: [0, 35], loop: true, release: 20 } },
  Sera:  { Cast:    { ref_h: 455, foot: [179.5, 489], fps: 30, frames: [0, 35], loop: true, release: 20 } },
};
// Fallback windup for a ranged/magic actor with no measured `release` frame above (e.g. a future
// hero recruit whose art hasn't been calibrated yet) -- better than firing with zero windup at all.
const WINDUP_MS_FALLBACK = { ranged: 500, magic: 700, heal: 600, status: 200 };
function windupMs(actorSprite, kind) {
  if (kind === "status") return WINDUP_MS_FALLBACK.status;   // plays on Idle -- no release frame to sync to
  const poseName = kind === "ranged" ? "shoot" : kind === "heal" ? "heal" : "cast";
  const pose = poseFor(poseName, actorSprite.name);
  const ncfg = NAMED_POSE_CFG[actorSprite.name] && NAMED_POSE_CFG[actorSprite.name][pose];
  if (ncfg && ncfg.release != null) return Math.round((ncfg.release / ncfg.fps) * 1000);
  return WINDUP_MS_FALLBACK[kind] || 400;
}

/* ---------------------------------------------------------------------
   One sprite: owns its DOM nodes, current pose/frame, and position.
--------------------------------------------------------------------- */
class SpriteView {
  constructor(id, name, facingRight, bossCfg, staticCfg) {
    // staticCfg: single-image art for a regular enemy ({url, scale, native_left}); a boss with "static" art
    // keeps its bossCfg (boss-sized, boss bar...) and also renders through the static path.
    this.staticCfg = (bossCfg && bossCfg.static) ? bossCfg : (staticCfg || null);
    this.bossCfg = bossCfg || null;   // {url, scale, native_left, idle_only} or {scale, poses{}} for scripted bosses
    this.poseCfg = (this.bossCfg && this.bossCfg.poses) || null;   // multi-pose boss: pose -> {url, ref_h, foot, frames, fps, loop}
    this.baseScale = this.bossCfg ? this.bossCfg.scale : (this.staticCfg ? this.staticCfg.scale : 1);
    this.hScale = this.baseScale;
    this.hScaleTarget = this.baseScale;
    this.castMode = null;             // null | "start" | "loop" | "broken" (Selene's revive chant)
    this.hScale = this.baseScale;
    this.id = id;
    this.name = name;
    this.facingRight = facingRight; // enemies face right (native sheet direction); party face left (mirrored)
    this.pose = "Idle";
    this.frame = 0;
    this.lastFrameTime = performance.now();
    this.homeX = 0; this.homeY = 0; this.z = 0;
    this.x = 0; this.y = 0;
    this.placed = false; // becomes true once setHome has actually applied a DOM position

    this.anchor = document.createElement("div");
    this.anchor.className = "sprite-anchor not-targetable";
    this.mirror = document.createElement("div");
    this.mirror.className = "sprite-mirror";
    this.frameEl = document.createElement("div");
    this.frameEl.className = "sprite-frame";
    this.mirror.appendChild(this.frameEl);
    this.anchor.appendChild(this.mirror);
    this.nameplate = document.createElement("div");
    this.nameplate.className = "nameplate " + (facingRight ? "enemy" : "party");
    this.nameplate.style.top = `${-SPRITE_H * this.hScale - 30}px`;

  tick(now) {

    // between them, though (see the two branches further down) -- a boss is genuinely meant to render
    // bigger than its nameplate/hit-box footprint when its art has padding, but a hero pose isn't, so
    // they're kept as separate variables rather than one merged cfg for the sizing decision.

        }

    const row = Math.floor(this.frame / FRAME_COLS);

      // feet -- the whole frame (padding included) grows to match, which is fine/expected for a boss
      // that's deliberately meant to loom larger than a normal hit-box footprint.
      const k = H / bossCfg.ref_h;
      const w = frameW * k, h = frameH * k;

      this.frameEl.style.height = `${h}px`;
      this.frameEl.style.transform = `translate(${-bossCfg.foot[0] * k}px, ${-bossCfg.foot[1] * k}px)`;
      this.frameEl.style.backgroundImage = `url(${img.src})`;
      this.frameEl.style.backgroundSize = `${w * FRAME_COLS}px ${h * FRAME_ROWS}px`;
      this.frameEl.style.backgroundPosition = `-${col * w}px -${row * h}px`;
    } else if (heroCfg) {
      // Named-hero pose with more padding than Idle/Run: unlike the boss branch above, the box here
      // stays EXACTLY the same size as every other hero pose (matches Idle -- and matches the nameplate/
      // hit-box, which are sized off that same H, not off this frame). What changes is a zoom: the
      // background is scaled up by s = H/ref_h (so the character's own pixels read at true height H,
      // same as Idle) and then cropped, via backgroundPosition, to a box centred horizontally on the
      // character and grounded at its measured foot point -- so the extra canvas padding gets cropped
      // away instead of inflating the box past what the hit-box/nameplate expect.
      const s = H / heroCfg.ref_h;
      const targetW = H * (frameW / frameH);
      this.frameEl.style.width = `${targetW}px`;
      this.frameEl.style.height = `${H}px`;
      this.frameEl.style.backgroundImage = `url(${img.src})`;
      this.frameEl.style.backgroundSize = `${frameW * FRAME_COLS * s}px ${frameH * FRAME_ROWS * s}px`;
      const bgX = -(col * frameW * s) + (targetW / 2 - heroCfg.foot[0] * s);
      const bgY = -(row * frameH * s) + (H - heroCfg.foot[1] * s);
      this.frameEl.style.backgroundPosition = `${bgX}px ${bgY}px`;
    } else {
      const targetW = H * (frameW / frameH);
      this.frameEl.style.width = `${targetW}px`;
      this.frameEl.style.height = `${H}px`;
      this.frameEl.style.backgroundImage = `url(${img.src})`;
      this.frameEl.style.backgroundSize = `${targetW * FRAME_COLS}px ${H * FRAME_ROWS}px`;
      this.frameEl.style.backgroundPosition = `-${col * targetW}px -${row * H}px`;
    }

    this.mirror.style.transform = (this.facingRight !== !!flip) ? "scaleX(1)" : "scaleX(-1)";
  }
}

async function animateMelee(actorSprite, targetSprite) {
  if (!actorSprite || !targetSprite) return;
  const dir = actorSprite.facingRight ? -1 : 1; // stop just short of the target, on the near side
  const bigPad = (s) => (s.bossCfg ? 70 * (s.hScale - 1) + 60 : 0);   // stay clear of a big boss sprite
  const engageX = targetSprite.homeX + dir * (90 + bigPad(targetSprite) + bigPad(actorSprite));
  actorSprite.setPose("Run");
  await tweenPosition(actorSprite, engageX, actorSprite.homeY, 320);
  actorSprite.setPose(poseFor("melee", actorSprite.name));
  actorSprite.poke("lunge");
  // Resolve at the moment of impact so the damage numbers / HP change land with the blow; the rest of the
  // swing and the run back continue in the background. The NEXT action (a counter-attack, the next
  // combatant's turn...) waits on `returnDone` so it never starts until this attacker is back in place.
  const swing = actorSprite.meleeMs(), impact = Math.round(swing * 0.45);
  await wait(impact);
  const hitPt = fxAnchor(targetSprite, 0.6);
  playImpactFx(MELEE_IMPACT_FX, hitPt.x, hitPt.y, null, fxSize(targetSprite, 0.7));   // fire-and-forget: doesn't hold up the swing
  playSfx(SFX.slash);
  returnDone = (async () => {
    await wait(swing - impact);
    actorSprite.setPose("Run");
    await tweenPosition(actorSprite, actorSprite.homeX, actorSprite.homeY, 320);
    // don't stomp a pose the state machine owns (e.g. a chant that began mid-animation)
    if (actorSprite.castMode === null) actorSprite.setPose("Idle");
  })();
}

const ICON_URL = "/assets/Artwork/Icons.png", ICON_X0 = 23, ICON_Y0 = 23, ICON_PITCH = 57, ICON_W = 620, ICON_H = 848;

      const g = cv.getContext("2d"); g.drawImage(img, 0, 0);

const DMG_COLORS = { physical: "#ffffff", none: "#ffffff", fire: "#ff8a3d", ice: "#7fdcff", thunder: "#ffe94d", holy: "#fff2a0",
  dark: "#c47bff", poison: "#9be04a", true: "#ff7a7a", heal: "#5dff8a", mp: "#6ab8ff", shield: "#bfe9ff" };

function spawnFloat(id, html, cls, color, delay) {
  const sp = sprites.get(id);

  const now = performance.now();
  const slot = Math.max(now, floatQueue.get(id) || 0) + (delay || 0);
  floatQueue.set(id, slot + 170);
  const wait = Math.max(0, slot - now);

    const el = document.createElement("div");

function noteCombatLog(line) {
  if (!combatHint || !latestState) return;
  const crit = /critical/i.test(line), weak = /weak/i.test(line);
  if (!crit && !weak) return;
  const names = [...latestState.party, ...latestState.enemies].map((c) => [c.name, c.id]);
  const m = line.match(/^\s*(.+?) takes \d+/) || line.match(/attacks (.+?) for \d+/);
  if (!m) return;
  const hit = names.find(([n]) => n === m[1].trim());
  if (!hit) return;
  if (crit) combatHint.crit.add(hit[1]);
  if (weak) combatHint.weak.add(hit[1]);
}

function emitCombatText(state) {
  const all = [...state.party, ...state.enemies];
  const hint = combatHint; combatHint = null;
  for (const c of all) {
    const p = prevSnap.get(c.id);
    if (p) {
      const dHp = c.hp - p.hp;
      if (dHp < 0) {
        let type = hint ? (hint.element || "physical") : (p.statuses.includes("poison") ? "poison" : "true");
        if (hint && hint.skill_kind === "heal") type = "true";
        const crit = !!(hint && hint.crit.has(c.id)), weak = !!(hint && hint.weak.has(c.id));
        const tag = crit ? "<small>CRITICAL</small>" : weak ? "<small>WEAK</small>" : "";
        spawnFloat(c.id, `${tag}${-dHp}${crit ? "!" : ""}`, "dmg" + (crit ? " crit" : ""), DMG_COLORS[type] || "#fff");
        const hs = sprites.get(c.id); if (hs && c.alive) hs.poke("hit");
      } else if (dHp > 0) {
        spawnFloat(c.id, `+${dHp}`, "heal", DMG_COLORS.heal);
        // Revive (was KO'd, is alive again -- e.g. a phoenix item or holy_reset) gets its own stinger;
        // any other HP gain from a heal skill/item just gets the plain heal chime.
        if (!p.alive && c.alive) playSfx(SFX.revive);
        else if (hint && hint.skill_kind === "heal") playSfx(SFX.heal);
      }
      // KO: either side's combatant crossing alive -> not alive, whatever dropped them there.
      if (p.alive && !c.alive) playSfx(SFX.koDeath);
      const dSh = (c.shield || 0) - (p.shield || 0);
      if (dSh < 0) spawnFloat(c.id, `${-dSh}`, "dmg", DMG_COLORS.shield);
      const dMp = c.mp - p.mp;
      if (dMp > 0 && p.mp !== undefined && dMp >= 3) spawnFloat(c.id, `+${dMp} MP`, "mp", DMG_COLORS.mp);
      for (const k of c.statuses || []) {
        if (!p.statuses.includes(k)) {
          const v = STATUS_VISUALS[k] || STATUS_VISUALS._unknown;
          const ic = makeIcon(v.cell, 22).outerHTML;
          spawnFloat(c.id, `${ic}${v.name}`, "status", v.color, 120);
          playSfx(STATUS_SFX[k]);
        }

    }

}

    if (!liveIds.has(id)) { sprite.anchor.remove(); sprites.delete(id); }
  }
  const enemySlots = columnLayout(latestState.enemies, ENEMY_COL_X, true);
  const partySlots = columnLayout(latestState.party, STAGE_W - ENEMY_COL_X, false);
  latestState.enemies.forEach((c, i) => placeSprite(c, enemySlots[i], true));
  latestState.party.forEach((c, i) => placeSprite(c, partySlots[i], false));
}

function placeSprite(c, slot, isEnemy) {
  let sprite = sprites.get(c.id);
  if (!sprite) {
    sprite = new SpriteView(c.id, c.sprite_name, isEnemy, c.boss_sprite, c.static_sprite);
    sprites.set(c.id, sprite);
    spriteLayer.appendChild(sprite.anchor);
  }
  sprite.setHome(slot.x, slot.y, slot.z);
  sprite.setKO(!c.alive);
  sprite.setInfo(c);
  sprite.applyState(c);
}

function renderStatusPanel(actingId) {
  const panel = document.getElementById("status-panel");
  panel.innerHTML = "";
  for (const c of latestState.party) {
    const row = document.createElement("div");
    row.className = "status-row" + (c.alive ? "" : " ko");
    const hpPct = Math.max(0, (c.hp / c.max_hp) * 100);
    const mpPct = c.max_mp > 0 ? Math.max(0, (c.mp / c.max_mp) * 100) : 0;
    row.innerHTML = `
      <div class="name${c.id === actingId ? " acting" : ""}"><span>${c.name}</span><span>${c.hp}/${c.max_hp} HP</span></div>
      <div class="bar-track"><div class="bar-fill hp" style="width:${hpPct}%"></div></div>
      ${c.max_mp > 0 ? `<div class="bar-track"><div class="bar-fill mp" style="width:${mpPct}%"></div></div>` : ""}
    `;
    panel.appendChild(row);
  }
}

let debugOn = false;
function setDebugUi(on) {
  if (on === debugOn) return;
  debugOn = on;
  document.getElementById("log-panel").classList.toggle("dbg", on);
  document.getElementById("log-toggle").style.display = on ? "block" : "none";
}
function toggleLog() {
  const p = document.getElementById("log-panel");
  p.style.width = ""; p.style.height = "";  // drop any manual resize so the preset applies
  const on = p.classList.toggle("expanded");
  const b = document.getElementById("log-toggle");
  b.classList.toggle("on", on);
  b.textContent = on ? "Collapse log" : "Expand log";
  p.scrollTop = p.scrollHeight;
}

function appendLog(message, isCalc) {
  const panel = document.getElementById("log-panel");
  const line = document.createElement("div");
  line.className = "line" + (isCalc ? " calc" : "");
  line.textContent = message;
  if (!isCalc) noteCombatLog(message);
  panel.appendChild(line);
  while (panel.children.length > (debugOn ? 600 : 60)) panel.removeChild(panel.firstChild);
  panel.scrollTop = panel.scrollHeight;
}

function pickTarget(candidateIds) {
  return new Promise((resolve) => {
    pendingTarget = { resolve };
    candidateIds.forEach((id) => sprites.get(id)?.setTargetable(true));
  });
}

window.onSpriteClicked = function (id) {
  if (pendingTarget && sprites.get(id)?.anchor.classList.contains("targetable")) {
    const resolve = pendingTarget.resolve;
    clearTargeting();
    resolve(id);
  }
};

function clearTargeting() {
  pendingTarget = null;
  sprites.forEach((s) => { s.setTargetable(false); s.anchor.classList.remove("hl"); });
}

function send(msg) {
  socket.send(JSON.stringify(msg));
}

// Battle formations (engine/formation.py's reachable_targets, mirrored here): which of a living
// enemy list a single-target action from the current actor can actually reach. A ranged/magical
// actor (state.actor_is_melee === false) always reaches anyone; a melee actor is blocked by an
// occupied front row. `is_melee` is a property of the ACTOR (their class), not of any one skill --
// see engine/formation.py's module docstring -- so this same filter applies to a plain Attack and
// to any single_enemy skill alike, and doesn't need to know which one is being used.
function reachableEnemies(state, aliveEnemies) {
  if (state.actor_is_melee === false) return aliveEnemies;
  const front = aliveEnemies.filter((c) => c.formation === "front");
  return front.length ? front : aliveEnemies;
}

/* ---- Auto battle: simple heuristic that picks a party member's action ---- */
let autoOn = false;
let currentNeed = null; // {actorId, state} while the server is waiting on a party action

// Per-fight caps on what auto-battle will spend, so it can't burn the whole inventory.
let autoUsed = { potion: 0, revive: 0, ether: 0 };
const AUTO_LIMITS = { potion: 2, revive: 1, ether: 1 };

function autoDecide(state, actorId) {
  const aliveEnemies = state.enemies.filter((c) => c.alive);
  if (aliveEnemies.length === 0) return { action: "defend" };
  const enemies = reachableEnemies(state, aliveEnemies);
  const skills = state.available_skills || [];
  const items = state.available_items || [];
  const mp = state.actor_mp;
  const ratio = (c) => c.hp / c.max_hp;
  const weakest = (list) => list.reduce((a, b) => (ratio(b) < ratio(a) ? b : a));
  const me = state.party.find((c) => c.id === actorId) || {};
  const role = me.role || "melee_dps";
  const alive = state.party.filter((c) => c.alive);

  // Is another living healer (support) able to keep the party topped up?
  const healerCovering = alive.some((c) => c.id !== actorId && c.role === "support" && c.mp >= 8);
  const iAmHealer = role === "support";
  const heals = skills.filter((s) => s.kind === "heal" && s.target === "single_ally" && s.mp_cost <= mp);
  const prayer = skills.find((s) => s.id === "prayer" && s.mp_cost <= mp);

  // 1) Healing (tuned in a headless simulation). A healer steps in at 75%; anyone else
  //    with a single-target heal at 40%. Prayer when two or more allies are hurt; a big
  //    heal for a big deficit, a cheap one for a small deficit.
  const hurt = alive.filter((c) => ratio(c) < (iAmHealer ? 0.75 : 0.4));
  if (hurt.length && (heals.length || prayer)) {
    if (prayer && alive.filter((c) => ratio(c) < 0.65).length >= 2) {
      return { action: "skill", skill_id: prayer.id, target_id: null };
    }
    if (heals.length) {
      const t = weakest(hurt);
      const s = heals.reduce((a, b) => ((1 - ratio(t) > 0.5) === (b.mp_cost > a.mp_cost) ? b : a));
      return { action: "skill", skill_id: s.id, target_id: t.id };
    }
  }

  // Only ONE ally ever spends turns on items: the tank (or whoever deals the least
  // damage if there's no tank). Everyone else keeps attacking.
  const order = ["tank", "melee_dps", "ranged_dps", "mage", "support"];
  const itemUser = order.map((r) => alive.find((c) => c.role === r)).find(Boolean);
  const iAmItemUser = itemUser && itemUser.id === actorId;

  // 2) Potions: item user only, no healer covering, ally in real danger, capped per fight.
  const critical = alive.filter((c) => ratio(c) < 0.3);
  if (critical.length && iAmItemUser && !healerCovering && autoUsed.potion < AUTO_LIMITS.potion) {
    const pot = ["hi_potion", "potion"].map((id) => items.find((i) => i.id === id)).find(Boolean);
    if (pot) { autoUsed.potion++; return { action: "item", item_id: pot.id, target_id: weakest(critical).id }; }
  }
  // 3) Revive: item user only, only to bring back the healer (or if nearly wiped), once per fight.
  const phoenix = items.find((i) => i.id === "phoenix_down");
  if (phoenix && iAmItemUser && !healerCovering && autoUsed.revive < AUTO_LIMITS.revive) {
    const downHealer = state.party.find((c) => !c.alive && c.role === "support");
    const down = downHealer || (alive.length <= 1 ? state.party.find((c) => !c.alive) : null);
    if (down) { autoUsed.revive++; return { action: "item", item_id: phoenix.id, target_id: down.id }; }
  }
  // 4) A mage or healer that's dry may drink one Ether per fight.
  const ether = items.find((i) => i.id === "ether");
  if (ether && autoUsed.ether < AUTO_LIMITS.ether && me.max_mp > 0 &&
      (role === "mage" || role === "support") && mp < me.max_mp * 0.15) {
    autoUsed.ether++;
    return { action: "item", item_id: ether.id, target_id: actorId };
  }
  // 5) A tank about to fall with a healer nearby guards instead of trading blows.
  if (role === "tank" && ratio(me) < 0.3 && healerCovering) return { action: "defend" };

  // 6) Attack: focus the enemy closest to dying (among reachable targets -- see reachableEnemies),
  //    and pick the skill that deals the most total damage (power x targets) rather than the one
  //    that merely costs the most. All_enemies skills ignore the front-row block (see
  //    engine/formation.py's reachable_targets, which only narrows single-target actions), so their
  //    value is scored against every alive enemy, not just the reachable subset.
  const target = enemies.reduce((a, b) => (b.hp < a.hp ? b : a));
  const n = aliveEnemies.length;
  const value = (s) => (s.power || 1) * (s.target === "all_enemies" ? n : 1);
  const offense = skills
    .filter((s) => (s.kind === "physical" || s.kind === "magical") && s.mp_cost <= mp &&
                   (s.target === "single_enemy" || s.target === "all_enemies"))
    .sort((a, b) => value(b) - value(a) || a.mp_cost - b.mp_cost);
  let skillChance = { mage: 1, ranged_dps: 1, melee_dps: 1, tank: 0.8, support: 0.8 }[role] ?? 0.8;
  // Healers keep MP in reserve for healing.
  if (iAmHealer && mp < me.max_mp * 0.6) skillChance = 0;
  if (offense.length && Math.random() < skillChance) {
    const s = offense[0];
    return { action: "skill", skill_id: s.id, target_id: s.target === "single_enemy" ? target.id : null };
  }
  return { action: "attack", target_id: target.id };
}

function autoAct() {
  if (!autoOn || !currentNeed) return;
  const { actorId, state } = currentNeed;
  currentNeed = null;
  clearTargeting();
  document.getElementById("command-panel").style.display = "none";
  send({ type: "action", actor_id: actorId, ...autoDecide(state, actorId) });
}

function toggleAuto() {
  autoOn = !autoOn;
  const btn = document.getElementById("auto-btn");
  btn.textContent = autoOn ? "Auto: ON" : "Auto: OFF";
  btn.classList.toggle("on", autoOn);
  if (autoOn && currentNeed) autoAct(); // already waiting on a choice -- take it now
  else if (!autoOn && currentNeed) handleNeedAction(currentNeed.actorId, currentNeed.state); // hand control back
}

const esc = (t) => String(t).replace(/[&<>]/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));

// Hover tooltip for skill/item buttons in the command panel -- shows the description
// text the server already sends (Skill.description / Item.description) so the player
// doesn't have to remember what an ability does. Positioned next to whatever button is
// hovered, flipped to the left side if it would run off the right edge of the screen.
const tooltipEl = document.getElementById("skill-tooltip");
function showTooltip(btn, html) {
  tooltipEl.innerHTML = html;
  tooltipEl.style.display = "block";
  const r = btn.getBoundingClientRect();
  const tw = tooltipEl.offsetWidth, th = tooltipEl.offsetHeight;
  let x = r.right + 10;
  if (x + tw > window.innerWidth - 8) x = r.left - tw - 10;
  if (x < 8) x = 8;
  let y = r.top;
  if (y + th > window.innerHeight - 8) y = window.innerHeight - th - 8;
  if (y < 8) y = 8;
  tooltipEl.style.left = x + "px";
  tooltipEl.style.top = y + "px";
}
function hideTooltip() { tooltipEl.style.display = "none"; }

const SKILL_TARGET_LABEL = {
  single_enemy: "1 Enemy", all_enemies: "All Enemies",
  single_ally: "1 Ally", all_allies: "All Allies", self: "Self",
};
function skillTooltipHtml(s) {
  const meta = [`${s.mp_cost} MP`, s.element && s.element !== "physical" ? s.element[0].toUpperCase() + s.element.slice(1) : null,
    SKILL_TARGET_LABEL[s.target] || null].filter(Boolean).join(" &middot; ");
  // rank/max_rank are new as of the skill-rank/talent-point system (engine/battle.py's build_state) --
  // mp_cost/power above already reflect this actor's current rank, this just makes that visible.
  const rankLine = (s.rank !== undefined && s.max_rank) ? `<div class="tt-meta">Rank ${s.rank} / ${s.max_rank}</div>` : "";
  return `<div class="tt-title">${esc(s.name)}</div>${rankLine}<div class="tt-meta">${meta}</div>` +
    (s.description ? `<div class="tt-desc">${esc(s.description)}</div>` : "");
}
function itemTooltipHtml(it) {
  return `<div class="tt-title">${esc(it.name)}</div>` +
    (it.description ? `<div class="tt-desc">${esc(it.description)}</div>` : "");
}

// need_action carries the engine's own snapshot, which lacks the fields hub_server adds to `state`
// messages (level, sprite_name, boss_sprite, role). Carry those over so nameplates keep their level
// and boss bars/sprites keep working between turns.
function mergeStaticFields(state, prev) {
  if (!prev) return state;
  for (const side of ["party", "enemies"]) {
    for (const c of state[side] || []) {
      const old = (prev[side] || []).find((o) => o.id === c.id);
      if (!old) continue;
      for (const k of ["level", "sprite_name", "boss_sprite", "static_sprite", "role", "stats", "status_detail", "resist"]) if (c[k] === undefined && old[k] !== undefined) c[k] = old[k];
    }
  }
  return state;
}

async function handleNeedAction(actorId, state) {
  state = mergeStaticFields(state, latestState);
  latestState = state; // full snapshot -- includes actor-specific fields too
  layoutAllSprites();
  renderStatusPanel(actorId);
  currentNeed = { actorId, state };
  if (autoOn) {
    const need = currentNeed;
    setTimeout(() => { if (currentNeed === need) autoAct(); }, 500); // brief beat so the fight stays readable
    return;
  }

  const panel = document.getElementById("command-panel");
  const buttons = document.getElementById("command-buttons");
  document.getElementById("command-title").textContent = `${state.actor_name}: choose an action`;
  panel.style.display = "block";

  async function chooseTargetFrom(pool, allowEmpty) {
    const ids = pool.map((c) => c.id);
    if (ids.length === 0) return null;
    if (ids.length === 1 && !allowEmpty) return ids[0];
    document.getElementById("command-title").textContent = "Choose a target (click a sprite or a name)";
    buttons.innerHTML = "";
    hideTooltip();
    for (const c of pool) {
      const btn = document.createElement("button");
      btn.textContent = `${c.level ? "Lv" + c.level + " " : ""}${c.name}  ${c.hp}/${c.max_hp} HP${c.alive ? "" : " (KO)"}`;
      btn.onclick = () => window.onSpriteClicked(c.id);
      btn.onmouseenter = () => { sprites.get(c.id)?.anchor.classList.add("hl"); playSfx(SFX.hover, 0.5); };
      btn.onmouseleave = () => sprites.get(c.id)?.anchor.classList.remove("hl");
      buttons.appendChild(btn);
    }
    const cancel = document.createElement("button");
    cancel.textContent = "< Cancel"; cancel.className = "back";
    cancel.onclick = () => {
      clearTargeting();
      document.getElementById("command-title").textContent = `${state.actor_name}: choose an action`;
      showMainMenu();
    };
    buttons.appendChild(cancel);
    const id = await pickTarget(ids);
    return id;
  }

  function showMenu(items) {
    buttons.innerHTML = "";
    hideTooltip();
    for (const item of items) {
      const btn = document.createElement("button");
      btn.textContent = item.label;
      btn.disabled = !!item.disabled;
      btn.className = item.back ? "back" : "";
      btn.onclick = item.onClick;
      btn.onmouseenter = () => {
        if (!item.disabled) playSfx(SFX.hover, 0.5);
        if (item.tooltip) showTooltip(btn, item.tooltip);
      };
      if (item.tooltip) btn.onmouseleave = () => hideTooltip();
      buttons.appendChild(btn);
    }
  }

  function finish(actionMsg) {
    currentNeed = null;
    panel.style.display = "none";
    hideTooltip();
    clearTargeting();
    if (actionMsg.action === "defend") playSfx(SFX.block);
    else if (actionMsg.action === "flee") playSfx(SFX.flee);
    else if (actionMsg.action === "item") playSfx(SFX.useItem);
    send({ type: "action", actor_id: actorId, ...actionMsg });
  }

  function showMainMenu() {
    showMenu([
      { label: "Attack", onClick: async () => {
          const targetId = await chooseTargetFrom(reachableEnemies(state, state.enemies.filter((c) => c.alive)));
          finish({ action: "attack", target_id: targetId });
        } },
      { label: `Skill (${state.available_skills.length})`, onClick: showSkillMenu,
        disabled: state.available_skills.length === 0 },
      { label: `Item (${state.available_items.length})`, onClick: showItemMenu,
        disabled: state.available_items.length === 0 },
      { label: "Defend", onClick: () => finish({ action: "defend" }) },
      { label: "Flee", onClick: () => finish({ action: "flee" }) },
    ]);
  }

  function showSkillMenu() {
    const items = state.available_skills.map((s) => ({
      label: `${s.name}${s.rank > 1 ? ` Rk${s.rank}` : ""} (${s.mp_cost} MP)`,
      disabled: state.actor_mp < s.mp_cost,
      tooltip: skillTooltipHtml(s),
      onClick: async () => {
        let targetId = null;
        hideTooltip();
        if (s.target === "single_enemy") targetId = await chooseTargetFrom(reachableEnemies(state, state.enemies.filter((c) => c.alive)));
        else if (s.target === "single_ally") targetId = await chooseTargetFrom(state.party.filter((c) => c.alive));
        finish({ action: "skill", skill_id: s.id, target_id: targetId });
      },
    }));
    items.push({ label: "< Back", back: true, onClick: showMainMenu });
    showMenu(items);
  }

  function showItemMenu() {
    const items = state.available_items.map((it) => ({
      label: `${it.name} x${it.count}`,
      tooltip: itemTooltipHtml(it),
      onClick: async () => {
        // All current items are single-ally targeted (see data/items_db.py);
        // KO'd party members are included so revive items have someone to target.
        hideTooltip();
        const targetId = await chooseTargetFrom(state.party);
        finish({ action: "item", item_id: it.id, target_id: targetId });
      },
    }));
    items.push({ label: "< Back", back: true, onClick: showMainMenu });
    showMenu(items);
  }

  showMainMenu();
}

function renderDebugGraphs(state) {
  const on = !!state.debug;
  const dmg = state.damage || {};
  const esc = (t) => String(t).replace(/[&<>]/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));
  const draw = (elId, title, list) => {
    const el = document.getElementById(elId);
    el.style.display = on ? "block" : "none";
    if (!on) return;
    const vals = list.map((c) => dmg[c.id] || 0);
    const total = vals.reduce((a, b) => a + b, 0);
    const max = Math.max(1, ...vals);
    el.innerHTML = `<div class="dbg-title">${title} - damage dealt</div>` + list.map((c, i) =>
      `<div class="dbg-row"><div class="dbg-l"><span>${esc(c.name)}</span><span>${vals[i]}${total ? " (" + Math.round(100 * vals[i] / total) + "%)" : ""}</span></div>` +
      `<div class="dbg-track"><div class="dbg-fill" style="width:${100 * vals[i] / max}%"></div></div></div>`).join("") +
      `<div class="dbg-total"><span>Team total</span><span>${total}</span></div>`;
  };
  draw("dbg-enemy", "Enemies", state.enemies);
  draw("dbg-party", "Party", state.party);

  // Live stats boxes: base value, and the effective value (green/red) when statuses are modifying it.
  const STAT_LABEL = { atk: "ATK", def_: "DEF", mag: "MAG", res: "RES", spd: "SPD", luk: "LUK" };
  const drawStats = (elId, title, list) => {
    const el = document.getElementById(elId);
    el.style.display = on ? "block" : "none";
    if (!on) return;
    el.innerHTML = `<div class="dbg-title">${title} - stats</div>` + list.map((c) => {
      const st = c.stats || {};
      const cells = Object.keys(STAT_LABEL).filter((k) => st[k]).map((k) => {
        const b = st[k].base, e = st[k].eff, diff = Math.round((e - b) * 10) / 10;
        const cls = diff > 0 ? "st-up" : diff < 0 ? "st-down" : "";
        const val = diff === 0 ? `${b}` : `<span class="${cls}">${Math.round(e)}</span> <span class="st-res">(${b}${diff > 0 ? " +" : " "}${Math.round(diff)})</span>`;
        return `<div>${STAT_LABEL[k]} ${val}</div>`;
      }).join("");
      const chips = (c.status_detail || []).map((s) => {
        const mods = Object.entries(s.mods || {}).map(([k, m]) => `${STAT_LABEL[k] || k} x${m}`).join(" ");
        return `<span class="st-chip" title="${esc(s.name)}">${esc(s.name)} ${s.duration < 0 ? "" : s.duration + "t"}${mods ? " " + mods : ""}</span>`;
      }).join("") + (c.defending ? '<span class="st-chip">Defending</span>' : "");
      const resist = Object.entries(c.resist || {}).filter(([, m]) => m !== 1)
        .map(([e, m]) => `${e} ${m === 0 ? "immune" : "x" + m}`).join(", ");
      return `<div class="st-block${c.alive ? "" : " ko"}"><div class="st-name"><span>${esc(c.name)}</span><span>HP ${c.hp}/${c.max_hp} &middot; MP ${c.mp}/${c.max_mp}</span></div>` +
        `<div class="st-grid">${cells}</div>` + (chips ? `<div>${chips}</div>` : "") +
        (resist ? `<div class="st-res">Resist: ${esc(resist)}</div>` : "") + `</div>`;
    }).join("");
  };
  drawStats("dbg-stats-enemy", "Enemies", state.enemies);
  drawStats("dbg-stats-party", "Party", state.party);
}

let battleAudioStarted = false;
function handleState(state) {
  latestState = state;
  emitCombatText(state);
  setDebugUi(!!state.debug);
  const bosses = state.enemies.filter((c) => c.boss_sprite);
  if (!battleAudioStarted) {
    // First state snapshot of the fight: now we know whether it's a boss fight or not.
    battleAudioStarted = true;
    startBattleMusic(bosses.length > 0);
    playSfx(SFX.encounter);
  }
  const bb = document.getElementById("boss-bar");
  if (bosses.length) {
    bb.style.display = "block";
    bb.innerHTML = bosses.map((b) => {
      const shield = b.shield_max > 0 && b.shield > 0
        ? `<div class="bb-shield"><div style="width:${100 * b.shield / b.shield_max}%"></div></div>` : "";
      const cls = "bb-row" + (b.enraged ? " enraged" : "") + (b.alive ? "" : " down");
      const sts = b.statuses || [];
      let tags = "";
      if (!b.alive) tags = '<span class="bb-tag chant">DOWN</span>';
      else {
        if (b.enraged) tags += '<span class="bb-tag rage">BLOODLUST</span>';
        if (b.channeling) tags += '<span class="bb-tag chant">CHANTING</span>';
        if (b.dancing) tags += '<span class="bb-tag dance">DANCE OF BLADES</span>';
        if (sts.includes("bulwark")) tags += '<span class="bb-tag bulwark">BULWARK</span>';
        if (sts.includes("unyielding")) tags += '<span class="bb-tag unyielding">UNYIELDING</span>';
      }
      return `<div class="${cls}"><div class="bb-name">${b.name}${tags}  -  ${b.hp} / ${b.max_hp}</div>` +
             `<div class="bb-track"><div class="bb-fill" style="width:${Math.max(0, 100 * b.hp / b.max_hp)}%"></div></div>${shield}</div>`;
    }).join("") + (() => {
      const h = bosses.find((b) => b.harmony_max);
      const both = bosses.filter((b) => b.alive && !b.enraged).length >= 2;
      if (!h || !both) return "";
      const pct = Math.max(0, Math.min(100, 100 * h.harmony / h.harmony_max));
      const full = h.harmony >= h.harmony_max;
      return `<div class="bb-harmony${full ? " full" : ""}"><div class="bb-hlabel">${full ? "IN SYNC - THE UNBROKEN PAIR STRIKES NEXT" : "TWIN HARMONY"}</div>` +
             `<div class="bb-htrack"><div class="bb-hfill" style="width:${pct}%"></div></div></div>`;
    })();
  } else bb.style.display = "none";
  renderDebugGraphs(state);
  layoutAllSprites();
  renderStatusPanel(null);
  document.getElementById("round-label").textContent = `Round ${state.round}`;
}

let dlgQueue = [], dlgActive = false, dlgTyping = null;
function showDialogue(lines) {
  dlgQueue.push(...lines);
  if (!dlgActive) nextDialogueLine();
}
function nextDialogueLine() {
  const box = document.getElementById("dialogue");
  if (!dlgQueue.length) {
    dlgActive = false;
    box.style.display = "none";
    document.getElementById("dim").style.display = "none";
    try { socket.send(JSON.stringify({type: "dialogue_done"})); } catch (e) {}
    return;
  }
  dlgActive = true;
  const line = dlgQueue.shift();
  box.style.display = "block";
  document.getElementById("dim").style.display = "block";
  document.getElementById("dlg-speaker").textContent = line.speaker || "";
  const pic = document.getElementById("dlg-portrait");
  const pname = line.portrait || line.speaker;      // no explicit portrait: try /assets/Portraits/<speaker>.webp (hidden if absent)
  const lp = pname ? (/[\/.]/.test(pname) ? (pname[0] === "/" ? pname : "/assets/" + pname)
    : `/assets/Portraits/${encodeURIComponent(pname)}.webp`) : "";
  pic.style.display = "none"; box.classList.remove("has-pic");
  pic.onerror = function () { this.style.display = "none"; box.classList.remove("has-pic"); }; pic.onload = function () { this.style.display = "block"; box.classList.add("has-pic"); };
  if (lp) pic.src = lp; else pic.removeAttribute("src");
  const el = document.getElementById("dlg-text");

    if (i >= line.text.length) { clearInterval(dlgTyping); dlgTyping = null; }
  }, 22);

}
function advanceDialogue() {
  if (!dlgActive) return;

document.addEventListener("keydown", (e) => {
